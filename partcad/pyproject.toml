[project]
name = "partcad"
version = "0.7.146"
description = "Package manager for CAD models and a modelling framework"
readme = "README.md"
keywords = ["cadquery", "build123d", "cad", "design", "openscad", "step", "stl"]
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "PartCAD", email = "support@partcad.org" }
]
maintainers = [
  {name = "PartCAD", email = "support@partcad.org" }
]
dynamic = ["dependencies", "optional-dependencies"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[tool.setuptools.package-data]
"partcad.wrappers" = ["*.py"]
"partcad.template" = ["*.yaml"]
"partcad.schema" = ["**/partcad.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# Optional AI providers. The corresponding SDKs are imported lazily, so they are
# only required when the matching AI provider is actually used.
[tool.setuptools.dynamic.optional-dependencies]
ai-google = {file = ["requirements-ai-google.txt"]}
ai-openai = {file = ["requirements-ai-openai.txt"]}
ai-ollama = {file = ["requirements-ai-ollama.txt"]}
ai = {file = ["requirements-ai.txt"]}

[project.urls]
Homepage = "https://github.com/partcad/partcad"
Issues = "https://github.com/partcad/partcad/issues"
