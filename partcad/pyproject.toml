[project]
name = "partcad"
version = "0.8.0"
description = "Package manager for CAD models and a modelling framework"
readme = "README.md"
keywords = ["cadquery", "build123d", "sdf", "cad", "design", "openscad", "step", "stl"]
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
authors = [
  {name = "PartCAD", email = "support@partcad.org" }
]
maintainers = [
  {name = "PartCAD", email = "support@partcad.org" }
]
dynamic = ["dependencies", "optional-dependencies"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

# Explicit, because this distribution ships two top-level packages and
# auto-discovery finding both is not something to leave implicit: 'partcad' and
# 'partcad_ide_client', the Python half of the PartCAD IDE viewer protocol. The
# latter has no dependencies of its own (standard library only), so shipping it
# here costs the wheel ~7 KiB and adds nothing to the install closure. See "The
# PartCAD IDE viewer client" in AGENTS.md for why it is not a distribution of
# its own.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The '.mjs' files are the JavaScript wrappers, read at runtime and handed to a
# sandboxed Node.js exactly like the '.py' ones are handed to a sandboxed Python.
"partcad.wrappers" = ["*.py", "*.mjs"]
# The packages PartCAD ships inside itself and reaches at '//builtin' (see
# partcad/builtin/). Their 'partcad.yaml' is read and their scripts are executed
# by path in a sandbox, so both have to land in the wheel as files.
"partcad.builtin" = ["*.yaml"]
"partcad.builtin.export" = ["*.py", "*.yaml"]
"partcad.builtin.render" = ["*.py", "*.yaml"]
"partcad.template" = ["*.yaml"]
"partcad.schema" = ["**/partcad.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
# Optional linting dependency. `ruff` ships a native executable that is resolved
# and launched lazily, so it is only required when `pc lint` actually runs.
lint = {file = ["requirements-lint.txt"]}
# The two cache tiers that reach off this machine. Each carries a client
# library the core imports lazily, so neither is a dependency of the wheel:
# 'cacheRemote' (memcached) and 'cacheS3' (object storage).
memcache = {file = ["requirements-memcache.txt"]}
aws = {file = ["requirements-aws.txt"]}

[project.urls]
Homepage = "https://github.com/partcad/partcad"
Issues = "https://github.com/partcad/partcad/issues"
