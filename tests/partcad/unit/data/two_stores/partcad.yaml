desc: >
  A board and a screw two stores sell: the board says nothing of how to buy
  it, and each store publishes an alias of it with a SKU of its own (the west
  one in a pack of ten as well); the screw names the east store's SKU, and the
  west store sells it under an alias. The package buys from both.

dependencies:
  east:
    type: local
    path: east
  west:
    type: local
    path: west

suppliers:
  //east:store:
  //west:store:

parts:
  board:
    type: cadquery
    path: cube.py
    desc: A board
  screw:
    type: cadquery
    path: cube.py
    desc: A screw the east store sells
    vendor: east
    sku: E-SCREW
  shelf:
    type: cadquery
    path: cube.py
    desc: A shelf cut from the board, which only the stores' aliases sell
    parameters:
      tolerance: 0.1
    manufacturing:
      method: subtractive
      source: board
      laser:
        kerf: 0.2
