desc: |
  Parts read with the SolidCraft plugin, from the files beside this one:

  - 'plate.solidcraft', a 40 x 30 mm plate whose thickness is the design's
    'height' parameter (built from 'plate.json' with
    'solidcraft-cli run plate.json --save plate.solidcraft');
  - 'slab.3dm', a 25 x 15 x 5 mm box saved as a Rhino 7 file;
  - 'cylinder.igs', a 5 mm radius, 12 mm tall cylinder as an IGES B-rep.

# The plugin lives in this repository until it has one of its own; a workspace
# that uses it imports it from the public index or from git instead.
dependencies:
  solidcraft:
    type: local
    path: ../../../../../plugins/solidcraft

parts:
  plate:
    type: solidcraft:solidcraft
    parameters:
      height:
        type: float
        default: 20
  slab:
    type: solidcraft:rhino
  cylinder:
    type: solidcraft:iges
