#
# PartCAD ships one Python distribution: `partcad`.
#
# It used to ship five -- `partcad`, `partcad-cli`, `partcad-utils`,
# `partcad-client` and `partcad-service-json-rpc` -- each with its own
# pyproject.toml, its own requirements.txt, and `==` pins on the others. Every
# packaging problem this repository had came out of that: which distribution
# owns an import name, which pin went stale, which of five names is registered
# on PyPI. One distribution owning all six packages makes the questions stop
# existing.
#
# The boundaries the packaging used to express are still real; they are just
# enforced where they always actually were:
#
#   * A remote daemon is never told to upgrade itself. That is a *protocol*
#     rule -- there is no upgrade or self-update method in the JSON-RPC surface,
#     and there must not be one. `src/partcad_service_json_rpc/AGENTS.md` says
#     so beside the method table. Updating a *local* daemon is unaffected:
#     `pc upgrade` stops them, replaces the installation and restarts, which has
#     always been a client acting on its own machine.
#   * A daemon does not discover or stop other daemons. Enforced by
#     `partcad_service_json_rpc` not importing `partcad_client`.
#
# `partcad-cli` is still published, as a shim: no modules, no entry points, one
# dependency on this. See `dev-tools/shim/pyproject.toml`.
#
# This file is also the development environment: Poetry reads the `[project]`
# metadata above and the `[tool.poetry.group.*]` dependency groups below, so
# `poetry install` from the repository root installs PartCAD editable plus
# everything the tests, the docs and the CAD-backed suites need.
#

[project]
name = "partcad"
version = "0.8.51"
description = "Package manager for CAD models and a modelling framework"
readme = "README.md"
keywords = ["cadquery", "build123d", "sdf", "cad", "design", "openscad", "step", "stl"]
requires-python = ">=3.10,<3.15"
# PEP 639: an SPDX expression, with the file named separately. The older
# `license = {file = "LICENSE.txt"}` inlined the whole Apache text into the
# `License:` metadata field, which is what PyPI then shows in place of a
# license name.
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
  {name = "PartCAD", email = "support@partcad.org" }
]
maintainers = [
  {name = "PartCAD", email = "support@partcad.org" }
]
dynamic = ["dependencies", "optional-dependencies"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.scripts]
pc = "partcad_cli.click.command:cli"
partcad = "partcad_cli.click.command:cli"
partcad-json-rpc = "partcad_service_json_rpc.__main__:main"

[project.urls]
Homepage = "https://github.com/partcad/partcad"
Issues = "https://github.com/partcad/partcad/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Explicit rather than left to auto-discovery: this distribution ships six
# top-level packages, and that is not something to leave implicit.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
# Optional linting dependency. `ruff` ships a native executable that is resolved
# and launched lazily, so it is only required when `pc lint` actually runs.
lint = {file = ["requirements-lint.txt"]}
# The off-machine cache tier whose client is heavy enough to leave out:
# 'cacheS3' (object storage) pulls aioboto3, and through it a botocore that pins
# tightly and weighs 13 MiB. 'cacheRemote' (memcached) used to be an extra
# beside it and is now an ordinary dependency -- see requirements.txt.
aws = {file = ["requirements-aws.txt"]}

[tool.setuptools.package-data]
# The '.mjs' files are the JavaScript wrappers, read at runtime and handed to a
# sandboxed Node.js exactly like the '.py' ones are handed to a sandboxed Python.
"partcad.wrappers" = ["*.py", "*.mjs"]
# The packages PartCAD ships inside itself and reaches at '//builtin' (see
# src/partcad/builtin/). Their 'partcad.yaml' is read and their scripts are
# executed by path in a sandbox, so both have to land in the wheel as files.
"partcad.builtin" = ["*.yaml"]
"partcad.builtin.export" = ["*.py", "*.yaml"]
"partcad.builtin.render" = ["*.py", "*.yaml"]
"partcad.template" = ["*.yaml"]
# The schemas `partcad_utils.assy_lint` validates against: the ASSY one and the
# `partcad.yaml` one. Both live in `partcad_utils` because both ends check both
# kinds of file -- the daemon over a package, every client over the one file
# somebody is editing.
"partcad_utils.schema" = ["**/*.json"]

[tool.pytest.ini_options]
# tests/partcad/unit carries helper modules that tests import by name (see
# git_http_server.py). With --import-mode importlib pytest does not put the
# test's own directory on the path, so it has to be named here.
pythonpath = [
    "src",
    "tests/partcad/unit",
    # The FreeCAD addon is not a package that gets installed: FreeCAD loads it
    # from its own directory, which is what it is importable from here too.
    "cad/freecad",
    # Same reason as `tests/partcad/unit` above: the IDE build-tooling tests do
    # `from conftest import REPO_ROOT` (and `import brand`, from the `tools`
    # directory their conftest adds), which `--import-mode importlib` does not
    # put on the path on its own. Without this the whole-repo run in
    # "test-dev.yml" fails to collect them -- and, because that job's `runCmd`
    # ends in `echo DONE`, reports success anyway while having run nothing.
    "ide/standalone/tests",
]
# The `--cov` list below names every package the one wheel ships, for the same
# reason `dev-tools/coverage.rc` writes its `include` list out by hand: a name
# that is missing is a package coverage never traces. `--cov=partcad` alone
# traced exactly one of the six, and that is upstream of the report --
# `coverage.rc` does list all of them, but an `include` filter cannot report a
# file that was never measured. So every unit test of the other five counted for
# nothing, and their only coverage came from behave driving the installed `pc`.
# That is end-to-end, so it walks success paths: the error branches those suites
# test read as untested, and a pull request adding one was told its patch was
# uncovered.
#
# Keep the list here, above the string -- `addopts` is a TOML string, so a '#'
# line inside it is passed to pytest as an argument rather than ignored.
addopts = """
    --import-mode importlib
    --alluredir=allure-results
    --cov-report=html:pytest-results/htmlcov
    --cov-report=xml:pytest-results/coverage.xml
    --cov=partcad
    --cov=partcad_cli
    --cov=partcad_client
    --cov=partcad_ide_client
    --cov=partcad_service_json_rpc
    --cov=partcad_utils
    --durations-min=1.0
    --durations=0
    --html=pytest-results/report.html
    --junitxml=pytest-results/junit.xml
    --self-contained-html
    --ignore-glob="openscad*"
    """
#    --log-cli-level=DEBUG # Add this flag to see debug logs during test runs
filterwarnings = [
    "ignore:.*is a deprecated alias for.*:DeprecationWarning"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# TODO(clairbee): make the below work instead of "behave.ini"
# [tool.behave]
# tags = ["~@wip"]
# log_capture = true
# paths = ["features/"]
# format = "allure_behave.formatter:AllureFormatter"
# outfile = "allure-results"

[tool.black]
line-length = 120
target-version = ['py310']

[tool.flake8]
exclude = ".venv"
extend-ignore = "E203"
max-line-length = 120

[tool.pylint."messages control"]
ignore = ["setup.py", "__init__.py"]
disable = "all"
enable = [
  "empty-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring"
]

[tool.isort]
profile = "black"
known_first_party = ["partcad"]

[tools.pyright]
reportMissingTypeArgument = true  # Report generic classes used without type arguments
strictListInference = true  # Use union types when inferring types of lists elements, instead of Any

# export POETRY_MULTIPROJECT_CHECK_DIR="/tmp/.check_partcad-dev"
# export POETRY_MULTIPROJECT_PREPARE_DIR="/tmp/.prepare_partcad-dev"

[tool.ruff.lint]
ignore = ["F401", "F403", "F405"]

# `poetry install` installs the root project editable, and it resolves what to
# put on `sys.path` with poetry-core, not with the `[tool.setuptools]` config
# above. Left to auto-detection it would look for a single package named after
# the project -- and it looks in the project root *before* `src/`, so a stray
# `./partcad/` directory left over from the pre-monorepo layout (git leaves the
# directory behind when the only files still in it are ignored ones like
# `__pycache__/`) makes `poetry install` fail with "partcad is not a package."
# and install nothing. Naming the six explicitly says the same thing
# `[tool.setuptools.packages.find]` does, and cannot be shadowed.
[tool.poetry]
packages = [
    { include = "partcad", from = "src" },
    { include = "partcad_cli", from = "src" },
    { include = "partcad_client", from = "src" },
    { include = "partcad_ide_client", from = "src" },
    { include = "partcad_service_json_rpc", from = "src" },
    { include = "partcad_utils", from = "src" },
]

#
# The development environment. Poetry 2 reads the `[project]` metadata above for
# the package itself and these groups for everything around it. There is no
# separate `partcad-dev` distribution any more: the project *is* `partcad`, so
# `poetry install` installs it editable and the groups add what the suites need.
#
[tool.poetry.group.dev.dependencies]
# black and isort are not run by any CI job or pre-commit hook (see
# dev-tools/pre-commit-config.yaml), so these are the versions a developer
# gets, not a gate. Note that black 26's stable style reformats ~54 files in
# this repo and isort does not agree with the tree as committed today;
# applying either belongs in its own PR, not in a dependency bump.
black = "^26.5.1"
flake8 = "^7.3.0"
isort = "^8.0.1"
sentry-sdk = {extras = ["opentelemetry"], version = "^2.66.0"}
poetry-plugin-shell = "^1.0.1"

[tool.poetry.group.test.dependencies]
# Serves a throwaway git repository over smart HTTP, so tests can exercise
# server-side behaviour that file:// cannot express. See
# tests/partcad/unit/git_http_server.py.
flask = "^3.1.3"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-html = "^4.2.0"
pytest-durations = "^1.7.0"
pytest-timeout = "^2.4.0"
allure-pytest = "^2.16.0"
coverage = "^7.15.2"
# behave is deliberately held at the 1.2 line: behave 1.3 is a rewrite of the
# runner and behavex (which the pre-commit hook and CI both drive) only
# declares behave <2.0 without having been validated against it. Note "^1.2.6"
# would allow 1.3.x -- and did, which is what broke the dev-container Behave
# run: 1.3 defaults use_nested_step_modules to False, so it silently skips
# every step module under features/steps/*/ (leaving hundreds of steps
# "undefined"), and it segfaulted under 'coverage run'. The exact bound keeps
# the dev container on the same 1.2.6 the native CI pins in requirements-dev.
behave = ">=1.2.6,<1.3"
behavex = "^4.6.5"
allure-behave = "^2.16.0"
pytest-xdist = "^3.8.0"
pyhamcrest = "^2.1.0"
strip-ansi = "^0.1.1"
nox = "^2026.7.11"
nox-poetry = "^1.2.0"
python-jsonrpc-server = "^0.4.0"
# cibuildwheel dropped Python 3.10 in its 3.0 release.
cibuildwheel = [
  { version = "^2.22.0", python = "<3.11" },
  { version = "^4.1.0", python = ">=3.11" },
]

[tool.poetry.group.docs.dependencies]
# Sphinx 9 and several of its extensions require Python 3.12 or newer. Read the
# Docs builds on 3.13 (see .readthedocs.yaml), so the newer line is what
# actually renders the published site; the older line only keeps a local
# "make html" working for a developer still on 3.10/3.11.
sphinx = [
  { version = "^8.1.3", python = "<3.12" },
  { version = "^9.1.0", python = ">=3.12" },
]
sphinx-rtd-theme = "^3.1.0"
# Follows sphinx: the 8.1 line caps docutils at <0.22, and sphinx-rtd-theme 3.1
# caps it at <0.23 on both sides.
docutils = [
  { version = "^0.21.2", python = "<3.12" },
  { version = "^0.22.4", python = ">=3.12" },
]
readthedocs-sphinx-search = "^0.3.2"
sphinx-autodoc-typehints = [
  { version = "3.0.1", python = "<3.12" },
  { version = "^3.13.0", python = ">=3.12" },
]
sphinx-copybutton = "^0.5.2"
sphinx-hoverxref = "^1.4.2"
sphinx-design = [
  { version = "^0.6.1", python = "<3.11" },
  { version = "^0.7.0", python = ">=3.11" },
]
mkdocs-material = "^9.7.7"
mdx-truly-sane-lists = "^1.3"
sphinx-autobuild = [
  { version = "^2024.10.3", python = "<3.11" },
  { version = "^2025.8.25", python = ">=3.11" },
]

[tool.poetry.group.partcad.dependencies]
# cadquery-ocp, build123d and ocpsvg are NOT wheel runtime dependencies at all:
# the published 'partcad' wheel declares no CAD dependency, because the core
# builds/renders/exports every shape - and reads STEP assemblies, and converts
# files - in sandboxed runtimes, and only needs a CAD library in-process for the
# opt-in convert("build123d"/"cadquery")/show() live-object features (which warn
# if it is missing). They stay in this dev group so the monorepo test suite,
# which exercises those features, has them installed. In OCP 7.9 the native
# library moved into 'cadquery-ocp-proxy'; 'cadquery-ocp' and the
# 'cadquery-ocp-novtk' that build123d depends on are both thin wrappers over it,
# so they coexist.
cadquery-ocp = "7.9.3.1.1"
ocpsvg = "0.6.0"
build123d = "0.11.1"
pyyaml = ">=6.0.1"
# Pinned to match partcad/requirements.txt, which explains why. 1.18.2 is the
# last pygit2 line that supports Python 3.10; 1.19 and later require 3.11.
pygit2 = [
  { version = "1.18.2", python = "<3.11" },
  { version = "1.20.0", python = ">=3.11" },
]
ruamel-yaml = ">=0.18.5"
vyper-config = "^1.2.1"
packaging = ">=23.1"
setuptools = "^83.0.0"
jinja2 = "^3.1.6"
requests = "^2.34.2"
aiofiles = "^25.1.0"
aiohttp = "^3.14.2"
pillow = "^12.2.0"
async-lru = "^2.3.0"
docker = "^7.2.0"
psutil = "^7.2.2"
ruff = "^0.15.22"
jsonschema = "^4.26.0"
# Only below 3.14, where the standard library has no 'compression.zstd'.
"backports.zstd" = { version = ">=1.6.0", python = "<3.14" }
# The clients behind the two off-machine cache tiers, both driven by the
# monorepo test suite against local mock servers. 'aiomcache' is an ordinary
# dependency of the published wheel; 'aioboto3' is its 'aws' extra, and is here
# because the suite needs it either way.
aiomcache = "^0.8.2"
aioboto3 = "^15.5.0"
# The CLI's own two. They are ordinary runtime dependencies of the wheel -- a
# console script cannot be conditional on an extra, so `pc` needs them
# unconditionally -- and they are restated here for the same reason as
# everything above: Poetry does not read `dynamic = ["dependencies"]`, so the
# dev container and `.devcontainer/requirements.txt` see only what this group
# names. They used to arrive through a `cli` group that the one-wheel migration
# deleted; `click` happens to be pulled in transitively today, `rich-click` is
# not, and `partcad_cli.click.command` imports it at the top.
click = "^8.4.2"
rich-click = "^1.9.8"

[tool.poetry.group.performance.dependencies]
snakeviz = "^2.2.2"
