[project]
name = "partcad-cli"
version = "0.8.0"
description = "Command-line interface to PartCAD"
readme = "README.md"
keywords = ["cadquery", "build123d", "sdf", "cad", "design", "openscad", "step", "stl"]
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE.txt"}
authors = [
  {name = "PartCAD", email = "support@partcad.org" }
]
maintainers = [
  {name = "PartCAD", email = "support@partcad.org" }
]
dynamic = ["dependencies", "optional-dependencies"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.scripts]
pc = "partcad_cli.click.command:cli"
partcad = "partcad_cli.click.command:cli"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# Pass-through extras: they pull in the matching `partcad` extra.
[tool.setuptools.dynamic.optional-dependencies]
lint = {file = ["requirements-lint.txt"]}
# The off-machine cache tier whose client is heavy enough to leave out:
# 'cacheS3' (object storage). 'cacheRemote' (memcached) used to be an extra
# beside it and is now an ordinary dependency of 'partcad'.
aws = {file = ["requirements-aws.txt"]}

[project.urls]
Homepage = "https://github.com/partcad/partcad"
Issues = "https://github.com/partcad/partcad/issues"
