[project]
name = "partcad-cli"
version = "0.7.146"
description = "Command-line interface to PartCAD"
readme = "README.md"
keywords = ["cadquery", "build123d", "cad", "design", "openscad", "step", "stl"]
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE.txt"}
authors = [
  {name = "PartCAD", email = "support@partcad.org" }
]
maintainers = [
  {name = "PartCAD", email = "support@partcad.org" }
]
dynamic = ["dependencies", "optional-dependencies"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.scripts]
pc = "partcad_cli.click.command:cli"
partcad = "partcad_cli.click.command:cli"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# Pass-through extras: they pull in the matching `partcad` extra.
[tool.setuptools.dynamic.optional-dependencies]
ai-google = {file = ["requirements-ai-google.txt"]}
ai-openai = {file = ["requirements-ai-openai.txt"]}
ai-ollama = {file = ["requirements-ai-ollama.txt"]}
ai = {file = ["requirements-ai.txt"]}
lint = {file = ["requirements-lint.txt"]}

[project.urls]
Homepage = "https://github.com/partcad/partcad"
Issues = "https://github.com/partcad/partcad/issues"
