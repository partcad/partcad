[tool.bumpversion]
current_version = "0.8.4"
commit = "true"
commit_args = "--no-verify"
tag = "true"
tag_name = "{new_version}"
message = "Version updated from {current_version} to {new_version}"

# One distribution, one version, and this file is what moves it everywhere.
#
# It used to be three times this length, because five distributions each carried
# a version and `==` pins on the others -- twenty-odd entries whose whole job was
# to keep those pins agreeing with each other. `partcad-utils` and
# `partcad-service-json-rpc` were once added to the monorepo without being added
# here, so their versions stayed at whatever they were created with while
# everything else moved; the three `partcad-cli` extras froze the same way at
# 0.7.146 and 0.7.158. None of those failure modes exists any more: within one
# distribution a pin is an import.
#
# What is left is the version constants each package reports at runtime, and the
# places outside Python that state the release.
# `tests/partcad_cli/unit/test_versions.py` fails if any of them fall out of
# step, or if any entry below stops matching the file it names.

# ---------------------------------------------------------------------------
# The wheel, and the shim published beside it
# ---------------------------------------------------------------------------

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

# The shim states its own version and pins the wheel at exactly it, so both move.
[[tool.bumpversion.files]]
filename = "shim/pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "shim/pyproject.toml"
search = "dependencies = [\"partcad=={current_version}\"]"
replace = "dependencies = [\"partcad=={new_version}\"]"

[[tool.bumpversion.files]]
filename = "shim/pyproject.toml"
search = "lint = [\"partcad[lint]=={current_version}\"]"
replace = "lint = [\"partcad[lint]=={new_version}\"]"

[[tool.bumpversion.files]]
filename = "shim/pyproject.toml"
search = "aws = [\"partcad[aws]=={current_version}\"]"
replace = "aws = [\"partcad[aws]=={new_version}\"]"

# ---------------------------------------------------------------------------
# The version each package reports at runtime
# ---------------------------------------------------------------------------
#
# `pc upgrade` asks `partcad_client.__version__` what is installed and compares
# it against the newest release, so a constant that stopped moving is not
# cosmetic: it makes the CLI either never upgrade or upgrade forever.

[[tool.bumpversion.files]]
filename = "src/partcad/__init__.py"
search = "__version__: str = \"{current_version}\""
replace = "__version__: str = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/partcad_cli/__init__.py"
search = "__version__: str = \"{current_version}\""
replace = "__version__: str = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/partcad_utils/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/partcad_client/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/partcad_service_json_rpc/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/partcad_ide_client/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

# The minimum-version check the extension's activation runs. It moved out of the
# bundled language server and into the shared operations core with the JSON-RPC
# migration; the entry kept naming the old file, so the bound stopped moving with
# it. That language server is gone entirely now.
[[tool.bumpversion.files]]
filename = "src/partcad_service_json_rpc/core/operations.py"
search = "(\">={current_version}\")"
replace = "(\">={new_version}\")"

# ---------------------------------------------------------------------------
# Everything outside Python that states the release
# ---------------------------------------------------------------------------

# The FreeCAD addon. It is not installed from PyPI -- FreeCAD's Addon Manager
# reads "package.xml" -- but it is released under the monorepo's one version like
# everything else, so both places that state it have to move with it.
[[tool.bumpversion.files]]
filename = "cad/freecad/partcad_freecad/__init__.py"
search = "__version__: str = \"{current_version}\""
replace = "__version__: str = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "cad/freecad/package.xml"
search = "<version>{current_version}</version>"
replace = "<version>{new_version}</version>"

[[tool.bumpversion.files]]
filename = "ide/vscode/package.json"
search = "version\": \"{current_version}\""
replace = "version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "ide/vscode/package.json"
search = "v{current_version} is not found"
replace = "v{new_version} is not found"

[[tool.bumpversion.files]]
filename = "docs/source/contributing.rst"
search = "Installing the current project: partcad ({current_version})"
replace = "Installing the current project: partcad ({new_version})"

[[tool.bumpversion.files]]
filename = "examples/partcad.yaml"
search = "partcad: \">={current_version}\""
replace = "partcad: \">={new_version}\""

[[tool.bumpversion.files]]
filename = ".github/workflows/test.yml"
search = "VERSION: {current_version}"
replace = "VERSION: {new_version}"

[[tool.bumpversion.files]]
filename = ".github/workflows/test-dev.yml"
search = "VERSION: {current_version}"
replace = "VERSION: {new_version}"

[[tool.bumpversion.files]]
filename = ".devcontainer/devcontainer.json"
search = "devcontainer:{current_version}"
replace = "devcontainer:{new_version}"

[[tool.bumpversion.files]]
filename = ".devcontainer/Dockerfile"
search = "IMAGE_VERSION={current_version}"
replace = "IMAGE_VERSION={new_version}"

[[tool.bumpversion.files]]
filename = "tools/containers/python/Dockerfile"
search = "partcad-devcontainer:{current_version}"
replace = "partcad-devcontainer:{new_version}"
