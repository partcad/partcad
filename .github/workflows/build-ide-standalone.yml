# The PartCAD IDE: the editor, the PartCAD extension and the command line tools
# in one application, for users who install an IDE rather than a toolchain.
name: IDE # Keep the action badge icon short

on:
  workflow_dispatch:
  # Called by "deploy.yml", which uploads the archives to the GitHub release.
  workflow_call:
    inputs:
      tools_in_this_run:
        description: >-
          Set it to true when the caller has already built the standalone
          command line bundles in this run: a called workflow shares the run's
          artifacts, so the IDE build downloads them from here. Left false, it
          instead finds the sibling "Standalone" workflow run for this commit
          and downloads them from there -- see the "bundles" job below. Only
          "deploy.yml" builds the bundles itself, and it is the only caller.
        type: boolean
        default: false
  merge_group:
  # Not on every change: this builds the standalone command line bundles first,
  # to put them inside the IDE, and those pull ~500MB of OpenCASCADE per runner.
  # Only the changes that can alter what ships.
  #
  # On a push that is a "paths:" filter and stays one. On a pull request it is
  # the "set-matrix" job's gate instead, for the two reasons
  # "build-standalone.yml" sets out beside its own trigger: "merge_group"
  # supports no "paths:" filter, so this workflow used to build three IDEs in the
  # queue for a change to a README; and a workflow skipped by "paths:" never
  # creates the check run a required check waits for, while a skipped job does.
  push:
    branches: ["devel"]
    paths:
      - "ide/standalone/**"
      - "ide/vscode/**"
      - ".vscode/extensions.json"
      - "install.sh"
      - ".github/workflows/build-ide-standalone.yml"
  pull_request:
    branches: ["main", "devel"]

# `actions: read` is what lets the "build" job list and download the artifacts
# of *another* workflow run -- the sibling "Standalone" run that froze the
# command line bundles. `contents: read` alone reaches only the current run's
# artifacts. Nothing here writes anything, so this is the whole of it.
permissions:
  contents: read
  actions: read

# Version bumps get a concurrency group of their own, keyed by commit, as in
# "test.yml" and "build.yml". This workflow builds the IDE a release ships, and
# a bump is the commit that release is cut from: cancelling its run leaves that
# version with no IDE archives, and the next bump's run is not a substitute --
# it built a different version. Five bumps landed within forty minutes on
# 2026-09-01 and runs 147 through 152 were all cancelled this way, which is also
# why the macOS first-start check below went three versions without once being
# allowed to report.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ startsWith(github.event.head_commit.message, 'Version updated') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# One IDE per operating system and architecture, and `platform` names the
# archive. `bundle` names the command line bundle that goes inside it, and the
# two are spelled differently on purpose: the IDE carries its own Electron
# runtime, while the frozen command line bundle links against the C library of
# the machine that froze it and is therefore built once per OS *version*
# ("build-standalone.yml" explains why).
#
# Every `bundle` here must be a platform "build-standalone.yml" actually builds
# in a run of this depth -- this workflow downloads that artifact rather than
# freezing it, and a name nothing uploaded is an hour of building followed by a
# failed download.
#
# The macOS builders are the 15 images, not "macos-latest". The IDE archive
# carries no OS version, so unlike a command line bundle there is nowhere to say
# what it needs and no way for a client to compare a machine against it: whatever
# floor the builder gives it is a floor nobody can see. Building on the oldest
# supported image is how it does not acquire one. It also keeps a moving label
# out of what gets released -- "macos-latest" moved from macOS 15 to macOS 26 in
# July 2026, which would have raised that invisible floor with no commit to point
# at. (`ubuntu-latest` and `windows-latest` below are the same shape of risk and
# are left alone here: neither carries a bundle whose floor this workflow sets,
# and moving them belongs with the wheel matrix in "test.yml", not here.)
env:
  # Built on every run. Each `bundle` is one of PLATFORMS_CORE there, so a
  # reduced run has them.
  IDE_CORE: >-
    [{"os": "ubuntu-latest", "platform": "linux-x86_64", "bundle": "ubuntu-24.04-x86_64"},
    {"os": "macos-15", "platform": "macos-arm64", "bundle": "macos-15-arm64"},
    {"os": "windows-latest", "platform": "windows-x86_64", "bundle": "windows-2022-x86_64"}]
  # Added only on a deep run: the nightly schedule, a manual dispatch, a push --
  # which includes the release path -- or "#deepTest" in the pull request. See
  # ".github/actions/test-depth".
  #
  # macOS on x86_64. Its command line bundle is in PLATFORMS_DEEP over in
  # "build-standalone.yml", so this leg has to be deep-only too: on a reduced run
  # there is no "partcad-standalone-macos-15-x86_64" to put inside it. The other
  # direction is safe -- a deep run of this workflow takes its bundles either
  # from the sibling "Standalone" run for the same commit, which is deep for the
  # same reason this one is, or from the newest run on the base branch, which is
  # a push or a dispatch and therefore deep as well.
  #
  # "macos-15-intel" is the x86_64 macOS image ("macos-15" is Apple silicon);
  # `ide/standalone/build.sh` reads the architecture off the machine and asks
  # VSCodium for its "darwin-x64" build there. One Intel IDE, not two, for the
  # same reasons as the bundle inside it.
  IDE_DEEP: >-
    [{"os": "macos-15-intel", "platform": "macos-x86_64", "bundle": "macos-15-x86_64"}]

  # Extra "Install" legs: an IDE run on a runner that did not build it.
  #
  # Every platform this run built is installed on the image that built it -- the
  # "Set matrix" job derives that from the lists above. These add the newest
  # macOS, matching what "build-standalone.yml" does for the bundles: an
  # application built on macOS 15, carrying a `pc` frozen on macOS 15, has to
  # start on the newest macOS, and this is the only place that is tried. Note
  # that it is tried twice over -- `partcad-ide --version` is the editor,
  # `pc version` is the frozen bundle inside it.
  #
  # "macos-latest" here and pinned labels in IDE_CORE above, on purpose: what is
  # built has to be reproducible and what is tested forward has to keep asking
  # about whatever macOS is newest today. "build-standalone.yml" spells that rule
  # out before its own `env`.
  IDE_INSTALL_FORWARD_CORE: >-
    [{"os": "macos-latest", "platform": "macos-arm64"}]
  # Pinned, because "macos-latest-intel" is not a label: the moving one exists on
  # Apple silicon only, and "macos-latest-large" is a paid larger runner rather
  # than an x86_64 equivalent. This line needs editing when a macOS 27 Intel
  # image appears; the arm64 one above does not.
  IDE_INSTALL_FORWARD_DEEP: >-
    [{"os": "macos-26-intel", "platform": "macos-x86_64"}]

jobs:
  set-matrix:
    name: "Set matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.set-matrix.outputs.build }}
      install: ${{ steps.set-matrix.outputs.install }}
      # Whether this change can alter what the IDE ships. Every job below needs
      # this one, so this is the whole workflow's gate. See
      # ".github/actions/changed-scopes".
      ide: ${{ steps.scope.outputs.ide }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide the depth
        id: depth
        uses: ./.github/actions/test-depth

      - name: Decide what the change touches
        id: scope
        uses: ./.github/actions/changed-scopes
        with:
          deep: ${{ steps.depth.outputs.deep }}

      - name: Set matrix
        id: set-matrix
        env:
          DEEP: ${{ steps.depth.outputs.deep }}
          QUEUE: ${{ steps.depth.outputs.queue }}
        run: |
          if [ "${DEEP}" = "true" ]; then
            platforms=$(jq -cn --argjson core '${{ env.IDE_CORE }}' --argjson deep '${{ env.IDE_DEEP }}' '$core + $deep')
            forward=$(jq -cn --argjson core '${{ env.IDE_INSTALL_FORWARD_CORE }}' --argjson deep '${{ env.IDE_INSTALL_FORWARD_DEEP }}' '$core + $deep')
          else
            platforms='${{ env.IDE_CORE }}'
            forward='${{ env.IDE_INSTALL_FORWARD_CORE }}'
          fi
          # A pull request builds no macOS IDE, matching "build-standalone.yml",
          # which freezes no macOS bundle for one -- so asking for the macOS IDE
          # here on a reduced run would be asking to unpack a bundle that nothing
          # built. Restored by the merge queue and by "#deepTest".
          if [ "${QUEUE}" != "true" ]; then
            drop_macos='map(select(.os | startswith("macos") | not))'
            platforms=$(jq -c "${drop_macos}" <<<"${platforms}")
            forward=$(jq -c "${drop_macos}" <<<"${forward}")
          fi
          echo "Platforms: ${platforms}"
          echo 'build={"include": '"${platforms}"'}' >> "${GITHUB_OUTPUT}"

          # Everything the "Install" job can exercise, which is everything but
          # Windows: there is no shell installer there, and the setup program that
          # takes its place is what "install-windows" runs instead.
          #
          # Derived from the build list, so an IDE this run builds is installed
          # somewhere whether or not anyone remembered to say so; the forward legs
          # are the second list, and they are checked against what this run built.
          own=$(jq -c 'map(select(.platform | startswith("windows") | not) | {os, platform})' <<<"${platforms}")
          install=$(jq -cn --argjson own "${own}" --argjson forward "${forward}" \
            '($own + $forward) | unique_by([.os, .platform])')
          echo "Install: ${install}"
          built=$(jq -c '[.[].platform]' <<<"${platforms}")
          orphans=$(jq -r --argjson built "${built}" \
            '[.[] | select(.platform as $p | $built | index($p) | not) | .platform] | unique | join(" ")' \
            <<<"${install}")
          if [ -n "${orphans}" ]; then
            echo "::error::the Install matrix asks for IDEs this run does not build: ${orphans}"
            exit 1
          fi
          echo 'install={"include": '"${install}"'}' >> "${GITHUB_OUTPUT}"

  # The build tooling's own tests: the extension policy, the branding, the
  # checks the build runs on its result. Seconds, and they fail before an hour
  # of building does.
  tools:
    name: "Build tooling"
    needs: set-matrix
    if: ${{ needs.set-matrix.outputs.ide == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      # `-o addopts=` because the repository-wide options in pyproject.toml pull
      # in coverage and reporting plugins this job has no use for.
      - name: Run the tests
        run: python -m pytest ide/standalone/tests -o addopts= -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # The IDE bootstrap extension: what it does on the first start, against a
      # stubbed editor. No dependencies -- `node --test` is in Node itself.
      - name: Run the bootstrap extension's tests
        run: node --test ide/standalone/bootstrap/test/*.test.js

  # Where the command line bundles that go inside the IDE come from.
  #
  # They are the same bundles `install.sh` installs, frozen by the "Standalone"
  # workflow, and this workflow no longer calls it. It used to: this job was
  # `uses: ./.github/workflows/build-standalone.yml`. That was wrong twice over.
  #
  # "Standalone" runs on its own `push`/`pull_request` triggers, and its path
  # filters overlap this workflow's -- every version bump touches
  # "ide/vscode/package.json" (ours) and "src/**" (theirs).
  # So one commit started the seven-platform, ~35-minute freeze twice: once as
  # its own run and once inside this one, and half of it was thrown away.
  #
  # Worse, the two cancelled each other. A called workflow evaluates
  # `github.workflow` as the *caller's* name, so the called instance computed
  # the same concurrency group this run was already holding and
  # `cancel-in-progress` killed it -- in 13 seconds, with no failed job to point
  # at. See the note on `concurrency` in "build-standalone.yml", which is where
  # that is fixed.
  #
  # The arrangement now is the one "deploy.yml" already used on the release
  # path, generalised: exactly one run owns the freeze and everyone else
  # downloads what it produced. On the release path that run is the
  # `build-standalone` job of the "Deployment" run itself, and the matrix below
  # downloads from its own run (`tools_in_this_run`). On every other trigger it
  # is the sibling "Standalone" run for this same commit, which this job finds,
  # waits for, and hands down as `run-id`.
  #
  # Rejected: keeping the call and only giving it a distinct concurrency group.
  # That fixes the cancellation and leaves the duplication -- fourteen frozen
  # bundles per version bump instead of seven.
  #
  # Rejected: building the IDE without the command line tools on push and pull
  # request. The archive would then not be the artifact that gets released, and
  # the "Install" jobs below -- which are the point of building it at all --
  # could not check that `pc` runs out of the installed IDE.
  #
  # This is one ubuntu-latest job rather than a step inside the matrix because
  # the answer is the same for all three platforms and the matrix runners are
  # macOS and Windows, billed at 10x and 2x. It is also unconditional rather
  # than skipped on the release path: a skipped dependency would drag "build"
  # into the `!cancelled() && ... == 'skipped'` contortion this file used to
  # need, and the step inside it costs seconds when there is nothing to look up.
  bundles:
    name: "Command line tools"
    needs: set-matrix
    if: ${{ needs.set-matrix.outputs.ide == 'true' }}
    runs-on: ubuntu-latest
    # Long enough to sit out a whole "Standalone" run. The freeze itself is
    # ~35 minutes; the install, snap and examples jobs after it have taken the
    # run past an hour. The step below gives up before this does, so the
    # failure says what it was waiting for instead of "timed out".
    timeout-minutes: 90
    outputs:
      # The run whose "partcad-standalone-*" artifacts the matrix downloads.
      # Empty when the caller froze them in this run, where there is nothing to
      # look up and nothing reads this.
      run-id: ${{ steps.resolve.outputs.run-id }}
      # And which of them that run actually holds, space separated. The matrix
      # checks its own bundle against this before it builds anything: a run of
      # "Standalone" whose depth does not match this one has the core bundles and
      # not the deep-only ones, and "actions/download-artifact" reports that as a
      # bare "Artifact not found" an unpacked editor later.
      artifacts: ${{ steps.resolve.outputs.artifacts }}
    steps:
      # Note that a sibling run is no longer guaranteed even in the merge queue.
      # "build-standalone.yml" is gated on what the change touches now, so a
      # change to "ide/standalone" alone -- which is not a change to what gets
      # frozen -- leaves this commit with no "Standalone" run anywhere. That is
      # the case the base-branch fallback below was written for; what it costs is
      # GRACE_SECONDS of waiting to establish that there is nothing to wait for.
      - name: Find the "Standalone" run that built the bundles
        id: resolve
        # `toJSON` rather than `inputs.tools_in_this_run == true`. Outside
        # "workflow_call"/"workflow_dispatch" there is no `inputs` context, so
        # the value is null, and GitHub compares mismatched types by coercing
        # both to numbers -- null and false both become 0, and the comparison
        # then cannot tell "not passed" from "passed as false". `toJSON`
        # compares the value as text ("null", "true", "false"), which can.
        # This file learned that the hard way once already; see git history for
        # the day the IDE build downloaded artifacts that were never built.
        #
        # Not `github.event_name == 'workflow_call'`: in a called workflow the
        # `github` context is the caller's, so that reads "push" on the release
        # path, never "workflow_call".
        if: ${{ toJSON(inputs.tools_in_this_run) != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          # The commit both workflows saw. On a pull request `github.sha` is the
          # merge commit, which no workflow ever ran on -- the head of the
          # branch is what "Standalone" recorded as its `head_sha`.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Where to look when this commit has no "Standalone" run of its own.
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}
          # Long enough for the freeze plus everything after it, and short
          # enough that this job's own timeout above never gets there first.
          WAIT_SECONDS: "4500"
          # The sibling run is created in the same second as this one but its
          # first job takes a moment to appear, so "no run for this commit" is
          # not a conclusion that can be drawn immediately. Anything less than
          # this and a race decides whether the IDE embeds this commit's
          # bundles or an older commit's.
          GRACE_SECONDS: "300"
          POLL_SECONDS: "30"
        run: |
          set -euo pipefail

          workflow="build-standalone.yml"
          base="${BASE_BRANCH#refs/heads/}"

          say() { printf '%s  %s\n' "$(date -u '+%H:%M:%S')" "$*"; }
          run_url() { printf '%s/%s/actions/runs/%s' "${SERVER_URL}" "${REPO}" "$1"; }

          # Every unexpired "partcad-standalone-*" artifact a run still holds.
          #
          # This, and not the run's conclusion, is the test. "Standalone"
          # uploads the bundles in its "Build" jobs and then spends another
          # half hour running examples through them, and those fail on their
          # own schedule: at the time of writing not one of the last thirty
          # "Standalone" runs on devel concluded `success`, while their bundles
          # were built, uploaded and perfectly good. Requiring `success` here
          # would mean the IDE never builds again. A run that produced no
          # bundle at all is the real failure, and it is caught below.
          bundles_of() {
            gh api "repos/${REPO}/actions/runs/$1/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)
                     | select(.name | startswith("partcad-standalone-")) | .name]
                    | sort | join(" ")'
          }

          # id, status and conclusion of every "Standalone" run for a commit,
          # newest first. Called workflows do not get a run of their own -- they
          # are jobs of the caller's run -- so this only ever lists the
          # independent ones, which is exactly what is wanted.
          runs_for_sha() {
            gh api "repos/${REPO}/actions/workflows/${workflow}/runs?head_sha=$1&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse
                    | .[] | [.id, .status, .conclusion] | @tsv'
          }

          # The same, for the most recent finished runs on a branch.
          runs_on_branch() {
            gh api "repos/${REPO}/actions/workflows/${workflow}/runs?branch=$1&status=completed&per_page=30" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse
                    | .[] | [.id, .head_sha, .conclusion] | @tsv'
          }

          started=$(date +%s)
          use_run=""
          use_conclusion=""
          use_names=""
          use_sha="${HEAD_SHA}"

          say "Looking for a \"Standalone\" run for ${HEAD_SHA}."

          # (1) The run for this very commit, waited out if it is still going.
          while :; do
            elapsed=$(( $(date +%s) - started ))
            pending=""
            pending_first=""
            barren=""
            barren_first=""

            listing=$(runs_for_sha "${HEAD_SHA}")
            while IFS=$'\t' read -r id status conclusion; do
              [ -n "${id}" ] || continue
              if [ "${status}" != "completed" ]; then
                pending="${pending} ${id}"
                [ -n "${pending_first}" ] || pending_first="${id}"
                continue
              fi
              names=$(bundles_of "${id}")
              if [ -n "${names}" ]; then
                use_run="${id}"
                use_conclusion="${conclusion}"
                use_names="${names}"
                say "Run ${id} (${conclusion}) has: ${names}"
                break
              fi
              barren="${barren} ${id} (${conclusion})"
              [ -n "${barren_first}" ] || barren_first="${id}"
            done <<<"${listing}"

            [ -z "${use_run}" ] || break

            if [ -n "${pending}" ]; then
              if [ "${elapsed}" -ge "${WAIT_SECONDS}" ]; then
                echo "::error::Gave up after $(( elapsed / 60 )) minutes waiting" \
                  "for the \"Standalone\" workflow run(s)${pending} to finish" \
                  "freezing the command line bundles for ${HEAD_SHA}. The IDE" \
                  "embeds those bundles, so there is nothing to build until" \
                  "they exist. Re-run this workflow once $(run_url "${pending_first}")" \
                  "has finished."
                exit 1
              fi
              say "Run(s)${pending} still going (${elapsed}s in, giving up at ${WAIT_SECONDS}s)."
              sleep "${POLL_SECONDS}"
              continue
            fi

            if [ -n "${barren}" ]; then
              echo "::error::The \"Standalone\" workflow run(s) for ${HEAD_SHA}" \
                "--${barren} -- finished without leaving a single" \
                "partcad-standalone-* artifact, so there is no command line" \
                "bundle to put inside the IDE. Fix or re-run that workflow for" \
                "this commit, then re-run this one: $(run_url "${barren_first}")."
              exit 1
            fi

            # No run at all for this commit -- yet, or ever.
            if [ "${elapsed}" -lt "${GRACE_SECONDS}" ]; then
              say "No run for ${HEAD_SHA} yet (${elapsed}s in, deciding at ${GRACE_SECONDS}s)."
              sleep "${POLL_SECONDS}"
              continue
            fi
            break
          done

          # (2) No run for this commit. That is legitimate: the two workflows
          # have different path filters, and a change confined to
          # "ide/standalone/**" fires this one and not that one. The
          # IDE build only needs a working bundle to embed and smoke-test, so
          # the newest one on the base branch keeps that coverage -- as long as
          # nobody reading the log can mistake it for this commit's.
          if [ -z "${use_run}" ]; then
            say "No \"Standalone\" run exists for ${HEAD_SHA}; falling back to ${base}."
            listing=$(runs_on_branch "${base}")
            while IFS=$'\t' read -r id sha conclusion; do
              [ -n "${id}" ] || continue
              names=$(bundles_of "${id}")
              [ -n "${names}" ] || continue
              use_run="${id}"
              use_conclusion="${conclusion}"
              use_names="${names}"
              use_sha="${sha}"
              say "Run ${id} (${conclusion}, ${sha}) has: ${names}"
              break
            done <<<"${listing}"

            if [ -z "${use_run}" ]; then
              echo "::error::No \"Standalone\" workflow run has command line" \
                "bundles to offer: none ran for ${HEAD_SHA}, and none of the" \
                "last 30 finished runs on ${base} still has an unexpired" \
                "partcad-standalone-* artifact (they are kept for 14 days)." \
                "The IDE cannot be built without them. Run the \"Standalone\"" \
                "workflow on ${base} -- manually, or by pushing a change under" \
                "one of its paths -- and then re-run this one."
              exit 1
            fi

            echo "::warning::The command line bundles inside this IDE build are" \
              "NOT from ${HEAD_SHA}. They come from \"Standalone\" run ${use_run}," \
              "which built ${use_sha} on ${base}: $(run_url "${use_run}")." \
              "\"Standalone\" never ran for this commit -- its path filters did" \
              "not match it -- so an older bundle is the only one there is, and" \
              "embedding it still exercises the IDE build end to end. Do not" \
              "read a green result as having tested this commit's command line" \
              "tools, though, because it has not."
          fi

          if [ "${use_conclusion}" != "success" ]; then
            echo "::warning::Taking the command line bundles from \"Standalone\"" \
              "run ${use_run}, which concluded \"${use_conclusion}\". The bundles" \
              "were uploaded before it did and they are what the IDE embeds;" \
              "whatever went wrong afterwards is reported in that run:" \
              "$(run_url "${use_run}")."
          fi

          say "Using \"Standalone\" run ${use_run} ($(run_url "${use_run}"))."
          echo "run-id=${use_run}" >> "${GITHUB_OUTPUT}"
          echo "artifacts=${use_names}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Command line tools"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Run | [${use_run}]($(run_url "${use_run}")) |"
            echo "| Conclusion | \`${use_conclusion}\` |"
            echo "| Commit | \`${use_sha}\` |"
            echo "| Bundles | \`${use_names}\` |"
            if [ "${use_sha}" != "${HEAD_SHA}" ]; then
              echo "| | **not this commit (\`${HEAD_SHA}\`)** |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: "Build (${{ matrix.platform }})"
    # All three dependencies always run -- "bundles" resolves where the command
    # line tools come from rather than building them -- so a plain `needs` says
    # all there is to say. The `!cancelled() && ... == 'skipped'` guard that used
    # to be here existed only to tolerate a "bundles" job that the release path
    # skipped, and there is no longer such a path.
    needs: [tools, bundles, set-matrix]
    strategy:
      fail-fast: false
      # IDE_CORE and IDE_DEEP at the top of this file, plus the note there on
      # what `platform` and `bundle` mean and why the macOS x86_64 leg only
      # exists on a deep run.
      matrix: ${{ fromJson(needs.set-matrix.outputs.build) }}
    runs-on: ${{ matrix.os }}
    # Longer than the command line bundles' hour: this unpacks an editor, has it
    # install a dozen extensions, and compresses a gigabyte into an installer.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"


      # Xvfb: installing an extension runs the editor, which wants a display
      # even when it never opens a window. Cairo: the icons are rendered from
      # the project's logo. Neither is available on the Windows runner, and the
      # build says what it left out rather than failing.
      - name: Install system prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb libcairo2-dev
      - name: Install system prerequisites
        if: runner.os == 'macOS'
        run: brew install cairo

      - name: Install the icon renderers
        continue-on-error: true
        run: python -m pip install cairosvg pillow

      # The one thing that can put an icon into an already-linked Windows
      # executable. Without it the installer carries the PartCAD icon and the
      # application it installs still wears VSCodium's, which is the half-done
      # version of the same bug. 'continue-on-error' to match the renderers
      # above: the build warns and produces an IDE either way.
      - name: Install rcedit
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm install -g rcedit

      # The runner images ship it, so this is a fallback rather than the usual
      # path. Without it the build produces the .zip and says it produced no
      # installer, which is not what a release should carry.
      - name: Make sure Inno Setup is installed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || command -v iscc >/dev/null 2>&1; then
            echo "Inno Setup is already installed"
          else
            choco install innosetup --no-progress --yes
          fi

      # Two steps for one download, because the bundles live in one of two
      # places and neither is a fallback for the other. On the release path
      # "deploy.yml" froze them in this very run and a called workflow shares
      # the run's artifacts, so the plain download finds them. Everywhere else
      # they belong to the sibling "Standalone" run the "bundles" job above
      # resolved, which takes `run-id` and a token to reach.
      - name: Download the command line tools (built in this run)
        if: ${{ toJSON(inputs.tools_in_this_run) == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: partcad-standalone-${{ matrix.bundle }}
          path: bundles

      # Before the download rather than through it: a "Standalone" run whose
      # depth does not match this one has the core bundles and not the deep-only
      # ones, and "actions/download-artifact" would call that "Artifact not
      # found" without saying which run it looked in or what that run does have.
      # Reachable by dispatching this workflow -- a deep run -- on a commit whose
      # only "Standalone" run was a reduced pull request one.
      - name: Check that run has this platform's bundle
        if: ${{ toJSON(inputs.tools_in_this_run) != 'true' }}
        shell: bash
        env:
          WANTED: partcad-standalone-${{ matrix.bundle }}
          AVAILABLE: ${{ needs.bundles.outputs.artifacts }}
          RUN_ID: ${{ needs.bundles.outputs.run-id }}
        run: |
          case " ${AVAILABLE} " in
          *" ${WANTED} "*)
            echo "\"Standalone\" run ${RUN_ID} has ${WANTED}."
            ;;
          *)
            echo "::error::\"Standalone\" run ${RUN_ID} has no ${WANTED}," \
              "so there is no command line bundle to put inside the" \
              "${{ matrix.platform }} IDE. That run holds: ${AVAILABLE:-nothing}." \
              "A reduced run of \"Standalone\" freezes PLATFORMS_CORE only," \
              "while this run is building the deep matrix -- run \"Standalone\"" \
              "on this commit at the same depth, then re-run this workflow."
            exit 1
            ;;
          esac

      - name: Download the command line tools (from the "Standalone" run)
        if: ${{ toJSON(inputs.tools_in_this_run) != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: partcad-standalone-${{ matrix.bundle }}
          path: bundles
          # Another run, of another workflow. `actions: read` in `permissions`
          # is what makes the token able to see it; without that this fails
          # with a bare 403 rather than anything that names the cause.
          run-id: ${{ needs.bundles.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Unpack the command line tools
        shell: bash
        run: |
          mkdir -p dist/standalone
          archive=$(find bundles -type f \( -name "partcad-*.tar.xz" -o -name "partcad-*.zip" \) ! -name "*.sha256")
          echo "Unpacking ${archive}"
          case "${archive}" in
          # `-xf`, not `-xzf`: tar reads the compression from the archive itself.
          *.tar.*) tar -xf "${archive}" -C dist/standalone ;;
          *.zip) unzip -q "${archive}" -d dist/standalone ;;
          esac
          test -d dist/standalone/partcad

      - name: Build the IDE
        shell: bash
        # The .dmg is how a macOS user expects to install an application; the
        # .tar.gz beside it is what "install.sh --ide" downloads.
        env:
          # "vscodium.json" pins no version, so the build asks the GitHub API
          # which VSCodium released last. Anonymously that is rate limited per
          # source IP, and the hosted macOS runners share theirs: the build died
          # on a 403 a second in, having downloaded nothing. The run's own token
          # counts the call against the repository instead. It needs no
          # permission beyond the `contents: read` this workflow already
          # declares -- the release it reads is public.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          extra=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            extra="--dmg"
          fi
          ide/standalone/build.sh --with-cli-bundle dist/standalone/partcad ${extra}

      # The build warns and carries on when the platform-specific packaging
      # tools are missing, which is right for someone building locally and wrong
      # for a release. Fail here instead.
      - name: Check the platform packaging was produced
        shell: bash
        run: |
          case "${{ runner.os }}" in
          Windows) required="dist/ide/partcad-ide-*-setup.exe" ;;
          macOS) required="dist/ide/partcad-ide-*.dmg" ;;
          *) exit 0 ;;
          esac
          # shellcheck disable=SC2086
          ls -la ${required}

      - name: Upload the IDE
        uses: actions/upload-artifact@v7
        with:
          name: partcad-ide-${{ matrix.platform }}
          path: |
            dist/ide/*.tar.gz
            dist/ide/*.zip
            dist/ide/*.dmg
            dist/ide/*setup.exe
            dist/ide/*.sha256
          if-no-files-found: error
          retention-days: 14

  # What a user does: download the archive this run produced and install it with
  # the script from the front page, on a machine that has never seen PartCAD.
  install:
    name: "Install (${{ matrix.platform }} on ${{ matrix.os }})"
    needs: [set-matrix, build]
    strategy:
      fail-fast: false
      # Every platform this run built that "install.sh" can install, which is
      # every one except Windows -- the setup program is the installer there, and
      # "install-windows" below runs it -- plus the macOS applications again on
      # the next macOS generation. The runner is in the job name because the
      # platform no longer identifies the leg: "macos-arm64" is installed on
      # macos-15 and on macos-latest.
      matrix: ${{ fromJson(needs.set-matrix.outputs.install) }}
    runs-on: ${{ matrix.os }}
    # The first start below runs the editor and waits for a PyInstaller bundle
    # to unpack itself, which the rest of this job does not.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Download the IDE
        uses: actions/download-artifact@v8
        with:
          name: partcad-ide-${{ matrix.platform }}
          path: archives

      - name: Install with install.sh
        shell: bash
        run: |
          version=$(sed -n 's/^__version__: str = "\(.*\)"$/\1/p' src/partcad/__init__.py)
          sh install.sh --ide \
            --version "${version}" \
            --base-url "file://${PWD}/archives" \
            --install-dir "${HOME}/partcad-standalone" \
            --bin-dir "${HOME}/partcad-bin" \
            --app-dir "${HOME}/Applications"

      - name: Run what was installed
        shell: bash
        run: |
          export PATH="${HOME}/partcad-bin:${PATH}"
          # From a directory that is not the checkout, so nothing can resolve
          # against the sources by accident.
          cd "${HOME}"
          partcad-ide --version
          # The command line tools the IDE carries, rather than a second copy.
          pc version

      - name: Check the IDE ships what it is supposed to
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            resources="${HOME}/Applications/PartCAD IDE.app/Contents/Resources"
          else
            resources="$(dirname "$(dirname "$(readlink -f "${HOME}/partcad-bin/partcad-ide")")")/resources"
          fi
          ls "${resources}/app/extensions"
          # Matched without regard to case: the editor lowercases the directory
          # it installs an extension into. The version, not a bare "*", is what
          # follows the id, so that an id which merely begins the same way
          # cannot satisfy this: "PartCAD.partcad-ide-bootstrap" is installed
          # here too, and it begins with the whole of the extension's former
          # name.
          find "${resources}/app/extensions" -maxdepth 1 -iname "partcad.partcad-official-[0-9]*" | grep -q . || {
            echo "::error::the installed IDE has no PartCAD extension"
            exit 1
          }
          test -x "${resources}/partcad-cli/partcad-json-rpc"
          # The examples the welcome window offers to open, packaged into the
          # bootstrap extension by the build.
          bootstrap=$(find "${resources}/app/extensions" -maxdepth 1 -iname "partcad.partcad-ide-bootstrap-*" | head -n 1)
          test -n "${bootstrap}" || {
            echo "::error::the installed IDE has no PartCAD IDE bootstrap extension"
            exit 1
          }
          test -f "${bootstrap}/examples/produce_part_cadquery_primitive/partcad.yaml"

      # A display for the editor. Nothing here looks at what it draws; it does
      # not start at all without one.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      # What the IDE does for someone who has just installed it: `pc init` a
      # package in ~/.partcad/projects/start and open it as the workspace.
      # Started the way a user starts it, with no arguments -- and with a user
      # data directory of its own, so that this is a first start however many
      # times the job is re-run, and so that the state the editor writes is
      # somewhere this job can read it.
      - name: Start it once
        # Blocking on Linux, where it works and is the signal this check exists
        # for. Reporting only on macOS, and that is a stop-gap with a date on it.
        #
        # This check is new in #584 and has never once passed on macOS. What it
        # gets there is a launcher that exits 0 in six seconds having printed
        # nothing, no editor process, and -- the reason nobody has been able to
        # say more than that -- not one line in the user data directory, so the
        # "what the editor logged" dump below came back empty. The same
        # commands, the same bundle, the same 'install.sh' pass on Linux and on
        # Windows. There is no evidence yet of anything wrong with the IDE that
        # a person installing it would meet; a hosted macOS runner's session is
        # the far likelier suspect, and confirming that needs a run on one.
        #
        # What is certain is the cost of leaving it blocking, because it was
        # paid: "deploy.yml" makes 'publish-to-pypi' wait on this workflow, so
        # this step held back the 0.8.32 wheel, the bundles, the extension and
        # the plugin, and PyPI stayed on 0.8.27. A check that has never passed
        # on a platform must not be what decides whether a release ships.
        #
        # So it still runs on macOS, still prints its errors, and no longer
        # fails the job there. Make it blocking again -- delete this expression
        # -- the moment a macOS run gets past it, which the diagnostics added
        # below are there to bring about.
        continue-on-error: ${{ startsWith(matrix.platform, 'macos') }}
        shell: bash
        run: |
          export PATH="${HOME}/partcad-bin:${PATH}"
          user_data="${RUNNER_TEMP}/ide-user-data"
          starter="${HOME}/.partcad/projects/start"
          rm -rf "${user_data}" "${starter}"

          # Where the editor puts its user data when '--user-data-dir' does not
          # reach it. Checked as well as the directory we asked for, so that
          # "the editor never started" and "the editor started somewhere else"
          # stop looking identical from here.
          if [ "${{ runner.os }}" = "macOS" ]; then
            default_user_data="${HOME}/Library/Application Support/PartCAD IDE"
          else
            default_user_data="${HOME}/.config/PartCAD IDE"
          fi

          # Killed however this ends: on the way out this job uninstalls the
          # application the editor is running from. Matched loosely and without
          # regard to case, because on macOS the process is the executable
          # inside "PartCAD IDE.app" rather than the launcher's name.
          #
          # The launcher spawns the editor and returns, so its own output says
          # nothing; what the editor has to say is in its log directory.
          diagnose() {
            pkill -if "partcad.ide" || true
            echo "--- what the editor logged:"
            find "${user_data}/logs" -name "*.log" -exec sh -c 'echo "== $1"; tail -n 40 "$1"' _ {} \; 2>/dev/null || true
            echo "--- what it left in ${user_data}:"
            ls -la "${user_data}" 2>/dev/null || echo "(the directory was never created)"
            echo "--- and in the default location, ${default_user_data}:"
            ls -la "${default_user_data}" 2>/dev/null || echo "(nothing there either)"
            if [ "${{ runner.os }}" = "macOS" ]; then
              # An Electron application that cannot finish starting on macOS
              # usually leaves this behind and nothing else. It is the one place
              # a WindowServer or code-signing refusal is written down.
              echo "--- macOS crash reports naming this application:"
              find "${HOME}/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
                -iname "*partcad*" -o -iname "*Electron*" 2>/dev/null |
                while IFS= read -r report; do echo "== ${report}"; head -n 40 "${report}"; done
              echo "--- how the bundle is signed:"
              codesign --verify --deep --verbose=2 "${HOME}/Applications/PartCAD IDE.app" 2>&1 | head -n 20 || true
            fi
          }
          trap diagnose EXIT

          if [ "${{ runner.os }}" = "Linux" ]; then
            # Started here rather than through `xvfb-run`: the launcher returns
            # as soon as it has spawned the editor, and `xvfb-run` takes the
            # display down with the command it was given.
            Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
            export DISPLAY=:99
            # The runner image restricts unprivileged user namespaces, which is
            # what Chromium's sandbox is built on. A property of this machine
            # rather than of the IDE.
            partcad-ide --no-sandbox --user-data-dir "${user_data}" && launcher_rc=0 || launcher_rc=$?
          else
            partcad-ide --user-data-dir "${user_data}" && launcher_rc=0 || launcher_rc=$?
          fi
          # Caught rather than left to 'set -e'. The launcher is a shell script
          # that hands off to the editor and exits, so a zero says only that the
          # hand-off was attempted -- but a non-zero is the answer, and under
          # 'set -e' alone it would have ended the step with no sentence saying
          # which command failed or what it returned.
          echo "the launcher exited ${launcher_rc}"
          if [ "${launcher_rc}" -ne 0 ]; then
            echo "::error::'partcad-ide' exited ${launcher_rc} instead of starting the editor"
            exit "${launcher_rc}"
          fi

          # Did anything actually come up? The editor is a separate process by
          # now, and if it is not there, no amount of waiting for a file it
          # writes will produce one. Thirty seconds, then say so: five minutes
          # of silence followed by "the package is not there" describes the
          # symptom and hides the cause, which is what happened on macOS.
          running=""
          for _ in $(seq 6); do
            if pgrep -if "partcad.ide" >/dev/null 2>&1; then
              running="yes"
              break
            fi
            sleep 5
          done
          if [ -z "${running}" ]; then
            echo "::error::the IDE did not leave a running process behind; the editor never started"
            exit 1
          fi

          # Five minutes: `pc init` writes a template, but it runs out of a
          # PyInstaller bundle that unpacks itself first, on a machine that has
          # just written a gigabyte to disk.
          package="${starter}/partcad.yaml"
          for _ in $(seq 60); do
            [ -f "${package}" ] && break
            sleep 5
          done
          if [ ! -f "${package}" ]; then
            echo "::error::the IDE did not create ${package} on its first start"
            exit 1
          fi
          head -n 5 "${package}"

          # And opened it: the editor writes the folder a window belongs to
          # beside that window's storage, as it opens it. The path is a URI in
          # there, so it is spelled with forward slashes.
          opened=""
          for _ in $(seq 36); do
            if grep -rls "\.partcad/projects/start" "${user_data}/User/workspaceStorage" 2>/dev/null | grep -q .; then
              opened="yes"
              break
            fi
            sleep 5
          done
          if [ -z "${opened}" ]; then
            echo "::error::the IDE did not open the starter package as its workspace"
            exit 1
          fi

      - name: Uninstall with install.sh
        shell: bash
        run: |
          # Nothing may still be running out of the tree about to be removed.
          # The editor and the `pc` daemon it starts both live in it and both
          # keep writing into it -- logs, workspace state, the directory the
          # frozen bundle unpacks itself into -- and a file appearing under a
          # directory while `rm -rf` walks it is how the removal ends in
          # "Directory not empty" with the directory still there.
          #
          # "Start it once" above already signals the editor, from the `trap
          # diagnose EXIT` in it. That is not enough here for two reasons:
          # `pkill` returns when the signal has been sent rather than when the
          # process is gone, so the uninstall starts while Electron is still
          # shutting down and still writing; and the pattern matches the editor
          # only, leaving the daemon behind it running. The Windows half of this
          # workflow has had the shape this needs from the start -- it stops the
          # editor in a `finally` and then waits for the directory to go -- and
          # this is the same idea for the half that has an extra process to
          # stop.
          #
          # `pc daemon stop` is per workspace, so it has to run in the one the
          # IDE opened on its first start rather than in the checkout; from here
          # it would stop a daemon for this repository, which is not the one
          # holding the tree open. Asking nicely first, signalling after: a
          # daemon told to stop closes its socket and removes its own state,
          # which a signal in the middle of a write does not.
          #
          # It is bounded rather than instant -- against a daemon that has itself
          # stopped answering, this is the CLI's own timeout rather than a hang,
          # which is what makes it safe to run here at all. The signals below are
          # sent either way, so a stop that times out still ends with both
          # processes gone.
          starter="${HOME}/.partcad/projects/start"
          if [ -x "${HOME}/partcad-bin/pc" ] && [ -d "${starter}" ]; then
            (cd "${starter}" && "${HOME}/partcad-bin/pc" --no-ansi daemon stop) || true
          fi
          pkill -if "partcad.ide" || true
          # And the daemon by name, exactly: it is `pc`, as the "Terminate
          # orphan process: pid (NNNN) (pc)" line at the end of a failed run
          # says. Whatever `pc daemon stop` did or did not manage, this is what
          # makes the wait below terminate.
          pkill -x pc || true

          # Then wait for both to actually be gone. Thirty seconds is far more
          # than either needs, and reaching the end of it is not a reason to
          # start removing the tree anyway: something still writing into it is
          # the entire failure this step exists to avoid, so warning and then
          # removing regardless would reproduce that failure with its diagnosis
          # one step further away than it is now.
          wait_gone() {
            for _ in $(seq "$1"); do
              if ! pgrep -if "partcad.ide" >/dev/null 2>&1 &&
                 ! pgrep -x pc >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          if ! wait_gone 30; then
            # SIGTERM was not enough. Nothing here has to shut down cleanly at
            # this point: the daemon's state lives under `~/.partcad/workspaces`,
            # outside every tree the uninstall removes, and a socket left behind
            # by a killed daemon is one the next client probes and replaces
            # rather than hangs on. So escalate, and wait again.
            echo "::warning::the editor or its daemon was still running 30s after being asked to stop; killing it"
            ps ax | grep -i -e "partcad.ide" -e "[/ ]pc\b" | grep -v grep || true
            pkill -9 -if "partcad.ide" || true
            pkill -9 -x pc || true
            if ! wait_gone 10; then
              echo "::error::the editor or its daemon is still running after SIGKILL; refusing to remove a tree that is still being written to"
              ps ax | grep -i -e "partcad.ide" -e "[/ ]pc\b" | grep -v grep || true
              exit 1
            fi
          fi

          sh install.sh --uninstall \
            --install-dir "${HOME}/partcad-standalone" \
            --bin-dir "${HOME}/partcad-bin" \
            --app-dir "${HOME}/Applications"
          test ! -e "${HOME}/partcad-bin/partcad-ide"
          test ! -e "${HOME}/Applications/PartCAD IDE.app"

  # The Windows half of the same idea: run the installer the way a user runs it,
  # then use what it installed, then uninstall it. Separate from the job above
  # because there is no shell installer on Windows -- the setup program is the
  # installer, and it is the thing to test.
  install-windows:
    name: "Install (windows-x86_64)"
    needs: build
    runs-on: windows-latest
    # The first start below runs the editor and waits for a PyInstaller bundle
    # to unpack itself, which the rest of this job does not.
    timeout-minutes: 40

    steps:
      - name: Download the IDE
        uses: actions/download-artifact@v8
        with:
          name: partcad-ide-windows-x86_64
          path: archives

      - name: Run the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem archives -Filter "*setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "no installer in the artifact" }
          # The switches a user never sees: no wizard, no dialogs, and no
          # launching the editor at the end (the [Run] entry is skipifsilent).
          Start-Process -FilePath $setup.FullName -Wait `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=install.log"
          Get-Content install.log -Tail 20

      - name: Use what it installed
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Programs\PartCAD IDE"
          if (-not (Test-Path $app)) { throw "nothing installed at $app" }
          & (Join-Path $app "bin\partcad-ide.cmd") --version
          & (Join-Path $app "resources\partcad-cli\pc.exe") version
          # Matched without regard to case (`-match` is, and the editor
          # lowercases the directory it installs an extension into). The version,
          # not a bare "*", is what follows the id, so that an id which merely
          # begins the same way cannot satisfy this:
          # "PartCAD.partcad-ide-bootstrap" is installed here too, and it begins
          # with the whole of the extension's former name. `-Filter` cannot
          # express that -- it takes wildcards, not character classes -- so this
          # filters in PowerShell instead.
          $extensions = Join-Path $app "resources\app\extensions"
          if (-not (Get-ChildItem $extensions -Directory | Where-Object { $_.Name -match "^partcad\.partcad-official-\d" })) {
            throw "the installed IDE has no PartCAD extension"
          }
          # The examples the welcome window offers to open, packaged into the
          # bootstrap extension by the build.
          $bootstrap = Get-ChildItem $extensions -Filter "partcad.partcad-ide-bootstrap-*" | Select-Object -First 1
          if (-not $bootstrap) { throw "the installed IDE has no PartCAD IDE bootstrap extension" }
          $example = Join-Path $bootstrap.FullName "examples\produce_part_cadquery_primitive\partcad.yaml"
          if (-not (Test-Path $example)) { throw "the welcome window's examples were not installed" }
          # The PATH entries the installer adds for a new terminal.
          $path = (Get-ItemProperty -Path "HKCU:\Environment" -Name Path).Path
          if ($path -notlike "*PartCAD IDE\bin*") { throw "the installer did not add bin to PATH" }

      # What the install above cannot show: it wrote into an empty directory, so
      # the installer's "[InstallDelete]" had nothing to delete and a regression
      # in it would look exactly like this. An upgrade is where it does the work.
      # The extension's id changed once -- "PartCAD.partcad" to
      # "PartCAD.partcad-official" -- and "[Files]" only overwrites, so without
      # the delete an older install's extension directory would still be sitting
      # beside this one: two directories with two ids are two extensions, both
      # loaded, both contributing the same activity bar entry and racing to
      # register the same commands.
      #
      # So plant what an older install would have left behind, run the setup
      # program over it the way an upgrade runs, and check both halves: the
      # stale directory is gone, and the directories "[InstallDelete]" also
      # matches -- this extension's own, and the bootstrap's -- were put back by
      # "[Files]" rather than deleted on the way past.
      - name: Upgrade over a stale extension directory
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Programs\PartCAD IDE"
          $extensions = Join-Path $app "resources\app\extensions"
          $stale = Join-Path $extensions "partcad.partcad-0.8.0"
          New-Item -ItemType Directory -Path $stale -Force | Out-Null
          Set-Content -Path (Join-Path $stale "package.json") `
            -Value '{"name":"partcad","publisher":"PartCAD","version":"0.8.0"}'

          $setup = Get-ChildItem archives -Filter "*setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "no installer in the artifact" }
          Start-Process -FilePath $setup.FullName -Wait `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=upgrade.log"
          Get-Content upgrade.log -Tail 20

          if (Test-Path $stale) { throw "the upgrade left $stale behind" }
          if (-not (Get-ChildItem $extensions -Directory | Where-Object { $_.Name -match "^partcad\.partcad-official-\d" })) {
            throw "the upgrade removed the PartCAD extension instead of replacing it"
          }
          if (-not (Get-ChildItem $extensions -Filter "partcad.partcad-ide-bootstrap-*")) {
            throw "the upgrade removed the PartCAD IDE bootstrap extension instead of replacing it"
          }

      # The same first start as the job above, on the platform where the setup
      # program is the installer: `pc init` in %USERPROFILE%\.partcad\projects\start,
      # and that folder opened as the workspace.
      - name: Start it once
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Programs\PartCAD IDE"
          $userData = Join-Path $env:RUNNER_TEMP "ide-user-data"
          $starter = Join-Path $env:USERPROFILE ".partcad/projects/start"
          $log = Join-Path $env:RUNNER_TEMP "ide.log"
          Remove-Item -Recurse -Force $userData, $starter -ErrorAction SilentlyContinue

          Start-Process -FilePath (Join-Path $app "partcad-ide.exe") `
            -ArgumentList "--user-data-dir", $userData `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err" | Out-Null
          try {
            # Five minutes: `pc init` writes a template, but it runs out of a
            # PyInstaller bundle that unpacks itself first, on a machine that
            # has just written a gigabyte to disk.
            $package = Join-Path $starter "partcad.yaml"
            $deadline = (Get-Date).AddMinutes(5)
            while (-not (Test-Path $package) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
            if (-not (Test-Path $package)) {
              throw "the IDE did not create $package on its first start"
            }
            Get-Content $package -TotalCount 5

            # And opened it: the editor writes the folder a window belongs to
            # beside that window's storage, as it opens it. The path is a URI
            # in there, so it is spelled with forward slashes.
            $storage = Join-Path $userData "User\workspaceStorage"
            $deadline = (Get-Date).AddMinutes(3)
            $opened = $false
            while (-not $opened -and (Get-Date) -lt $deadline) {
              $opened = $null -ne (Get-ChildItem $storage -Recurse -Filter workspace.json -ErrorAction SilentlyContinue |
                Select-String -SimpleMatch -Pattern ".partcad/projects/start")
              if (-not $opened) { Start-Sleep -Seconds 5 }
            }
            if (-not $opened) {
              throw "the IDE did not open the starter package as its workspace"
            }
          } finally {
            # Stopped however this ends: the uninstaller below cannot remove an
            # application that is running.
            Stop-Process -Name partcad-ide -Force -ErrorAction SilentlyContinue
            Write-Host "--- the editor said:"
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
            Get-Content "$log.err" -Tail 40 -ErrorAction SilentlyContinue
          }

      - name: Uninstall
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Programs\PartCAD IDE"
          # Inno Setup's uninstaller relaunches itself from the temp directory
          # and the process started here returns before the work is done, so
          # this waits for the result rather than for the process.
          Start-Process -FilePath (Join-Path $app "unins000.exe") `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          $deadline = (Get-Date).AddMinutes(5)
          while ((Test-Path $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          if (Test-Path $app) { throw "$app is still there after uninstalling" }
          $path = (Get-ItemProperty -Path "HKCU:\Environment" -Name Path).Path
          if ($path -like "*PartCAD IDE*") { throw "the uninstaller left PATH entries behind" }
