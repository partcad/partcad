# Standalone (PyInstaller) bundles: the alternative to the Python wheels
name: Standalone # Keep the action badge icon short

on:
  workflow_dispatch:
  # Called by "deploy.yml", which uploads the bundles to the GitHub release.
  workflow_call:
    inputs:
      # Not a knob, and nothing passes it. It exists so that the `concurrency`
      # group below can tell a called instance of this workflow from an
      # independent one -- which nothing else in the expression context can.
      #
      # `github.workflow` looks like the discriminator and is the wrong one:
      # inside a called workflow the whole `github` context is the *caller's*,
      # so it reads "IDE" or "Deployment" here, never "Standalone". (Same trap
      # as `github.event_name`, which reads "push" on the release path rather
      # than "workflow_call" -- "build-ide-standalone.yml" says so too.) The
      # `inputs` context, by contrast, exists only under `workflow_call` and
      # `workflow_dispatch`, and this workflow declares no `workflow_dispatch`
      # inputs -- so `inputs.called` is null on every trigger except a call,
      # and non-null on a call whether or not the caller passed anything.
      called:
        description: >-
          Reserved. Do not pass it: its presence, not its value, is what marks
          an instance of this workflow that another workflow called.
        type: boolean
        default: true
  merge_group:
  # Freezing pulls ~500MB of OpenCASCADE per runner, so this does not run on
  # every change: only on the ones that can change what is frozen. The two
  # lists are duplicated because GitHub Actions does not support YAML anchors.
  # "main" is absent on purpose: a push there runs "deploy.yml", which calls
  # this workflow itself. Listing it here would build everything twice.
  push:
    branches: ["devel"]
    paths:
      - "dev-tools/pyinstaller/**"
      - "dev-tools/snap/**"
      - "snap/**"
      - "install.sh"
      - ".github/workflows/build-standalone.yml"
      - "src/**"
      - "pyproject.toml"
      - "requirements*.txt"
  pull_request:
    branches: ["main", "devel"]
    paths:
      - "dev-tools/pyinstaller/**"
      - "dev-tools/snap/**"
      - "snap/**"
      - "install.sh"
      - ".github/workflows/build-standalone.yml"
      - "src/**"
      - "pyproject.toml"
      - "requirements*.txt"

permissions:
  contents: read

# One build per branch, or per pull request, and a new push supersedes the one
# in flight. That is the plain half of the group. The suffix is the other half,
# and it is not cosmetic.
#
# Being called used to be fatal here. `github.workflow` is the *caller's*
# workflow name inside a called workflow, so an instance called by the "IDE"
# workflow computed the group "IDE-refs/heads/devel" -- byte for byte the group
# the IDE run that called it was already holding. `cancel-in-progress` then did
# exactly what it was told. Every "IDE" run died that way, on devel and on
# every pull request, in well under a minute and with no failed job to point
# at: the called workflow was cancelled before it started a single one.
#
# Appending the run id when, and only when, an `inputs` context exists closes
# both halves of that. A called instance can no longer share a group with the
# run that called it, because the caller's own group carries no such suffix;
# and it can no longer share one with any other instance, called or
# independent, because no two runs share a run id. Independent runs keep the
# plain group unchanged, so a second push to a branch still cancels the build
# in flight -- which is why the suffix is conditional rather than always there.
#
# Note which way round the two branches go. `a && b || c` is the only
# conditional an expression has, and it is not a ternary: `&&` yields the first
# falsy operand and `||` the first truthy one, so a *falsy* `b` falls through to
# `c` and the condition stops meaning anything at all. An empty string is falsy.
# Written the other way -- `== 'null' && '' || format(...)` -- this would append
# the suffix to every run, independent ones included, and no push would ever
# supersede the build in flight again. The non-empty half has to be the half the
# condition selects.
#
# A third case now sits between them: a version bump, keyed by commit the way
# "test.yml", "build.yml" and "build-ide-standalone.yml" key theirs. The bundles
# a bump produces are that version's, and the release is cut from that commit --
# so the next bump superseding this run does not replace its artifacts, it
# removes them. Runs 490 through 494 were cancelled exactly that way on
# 2026-09-01, leaving 0.8.28 through 0.8.31 with no bundles built on "devel" at
# all.
#
# Three cases, chained left to right, and the order is the precedence: a called
# instance is a called instance whatever its commit message says, so it has to
# be tested first. The chain reads `A && B || C && D || ''` -- `&&` yields the
# first falsy operand, `||` the first truthy one, so a false `A` falls through
# to `C && D` and a false `C` to the empty string. Same trap as the note above:
# every value that is *selected* has to be non-empty, or the chain runs on past
# it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ toJSON(inputs.called) != 'null' && format('-called-{0}', github.run_id) || startsWith(github.event.head_commit.message, 'Version updated') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# One bundle per supported OS version, not one per operating system. A frozen
# bundle links against the C library and system frameworks of the machine that
# froze it, so it runs there and on anything newer, and on nothing older -- a
# single "linux" build would silently mean "the newest Linux we happened to
# build on". Every image is pinned for the same reason: "*-latest" moves, and an
# artifact name that moves with it is a contract nobody can rely on.
#
# This is the list. "install.sh" and the other clients no longer keep one --
# they read "platforms.json", which "deploy.yml" generates from the archives
# these jobs produce -- so what has to agree with it is short: the platform loop
# in the release check in "deploy.yml", which is what refuses a release with a
# platform missing, and IDE_CORE/IDE_DEEP in "build-ide-standalone.yml", which
# name the bundle that goes inside each IDE. Both consume these ids; a name that
# is wrong in either is a job waiting for an artifact nothing uploaded. The
# EXAMPLES_* lists below name them too, and those are checked in "Set matrix".
#
# ubuntu-26.04 (and -arm) are absent on purpose: still preview images, not
# covered by the Actions SLA. See the note in test.yml.
#
# macOS is the one operating system here that is built on a single OS version,
# and its labels are not symmetric. On Apple silicon a release has a pinned label
# and the newest also answers to "macos-latest" ("macos-15", "macos-26", with
# "macos-latest" pointing at the newest -- macOS 26 since July 2026). On x86_64
# the same image is "macos-15-intel"/"macos-26-intel", and **there is no
# "macos-latest-intel"**: the moving label exists on one architecture only. The
# nearest x86_64 thing to it, "macos-latest-large", is a paid larger runner and
# not a substitute. (The "-large"/"-xlarge" labels are all larger runners, which
# this repository does not use.) x86_64 macOS used to mean "macos-13", which is
# why there was no Intel bundle here at all: no macos-13 job ever started on the
# current runner plan, and GitHub retired the image in December 2025 -- see the
# note in test.yml. The "-intel" labels replaced it, as standard runners.
#
# Which label to use is decided by what the job is for, and the two answers are
# opposite:
#
#   * a job that FREEZES a bundle names a pinned image, always. The archive is
#     named after that image and the C library floor comes from it, so a label
#     that moves would silently rename what we publish and raise what it needs.
#   * a job that INSTALLS one on a later OS names the moving label where there is
#     one. Its whole question is "does this still run on the newest macOS", and
#     pinning it means the answer goes stale the day a newer macOS ships and
#     nobody notices until someone edits this file.
#
# So: freeze on macos-15/macos-15-intel, install-test on those and on
# macos-latest. The Intel forward leg has to name macos-26-intel because the
# moving label does not exist there; when a macOS 27 Intel image appears that leg
# needs editing and the arm64 one does not.
#
# **One macOS build per architecture, both frozen on macOS 15, and both install-
# tested on macOS 15 and macOS 26.** A frozen bundle runs on the OS version it
# was built on and everything newer, so the macOS 15 builds cover macOS 15 and 26
# between them and a macos-26-* build reaches no machine they do not. There used
# to be a macos-26-arm64 build; it was a second 10x-billed freeze buying the half
# of the range the first one already had, and dropping it is what pays for the
# Intel build -- which reaches machines nothing here reached before.
#
# What that costs is the assumption. "Older build runs on newer OS" is the whole
# basis of the per-OS-version scheme and nothing used to check it: a macOS 26 host
# was handed a macOS 26 build. So the "Install" job now runs each macOS bundle on
# its own generation *and* on the next one -- see INSTALL_FORWARD_* below. That is
# a ~10 minute job in place of a ~35 minute freeze, and it tests the property that
# matters rather than sidestepping it.
#
# The macOS 15 images are also the last x86_64 ones: GitHub drops x86_64 macOS
# when they retire (announced for autumn 2027). That single event is what forces
# the next move here -- arm64 to macos-26, x86_64 to nothing -- so it is one
# migration to plan, not two. "dev-tools/pyinstaller/README.md" says so as well.
#
# Windows has one build, not one per image, and that is not an oversight. The
# per-OS-version split exists because a machine can be lined up against it: an
# Ubuntu version out of /etc/os-release, a macOS major version out of sw_vers,
# and a build with a higher floor than the host is then dropped. Windows offers
# no such comparison -- "windows-2022"/"windows-2025" are runner image names, and
# the only way back to one of them is the NT build number table in
# "dev-tools/pyinstaller/build.sh", which knows those two server builds and no
# version of Windows anybody runs. A second Windows build is therefore something
# no client can ask for on purpose: redundant if it is equally portable, and
# unreachable if it is not. Windows also has no glibc-style floor for it to
# differ in -- the CRT it needs ships with the bundle or with the OS. So one
# build is published, from the older image, which is also the one the IDE
# embeds. If Windows ever does need two, the host-to-build mapping has to exist
# first, or the choice is a guess with a version number on it.
env:
  # Built on every run.
  PLATFORMS_CORE: >-
    [{"os": "ubuntu-24.04", "platform": "ubuntu-24.04-x86_64"},
    {"os": "ubuntu-24.04-arm", "platform": "ubuntu-24.04-arm64"},
    {"os": "macos-15", "platform": "macos-15-arm64"},
    {"os": "windows-2022", "platform": "windows-2022-x86_64"}]
  # Added only on a deep run: the nightly schedule, a manual dispatch, a push --
  # which includes the release path -- or "#deepTest" in the pull request. See
  # ".github/actions/test-depth", and OSES_DEEP_ONLY in "test.yml", which drops
  # the same images for the same reasons.
  #
  # This workflow is the expensive one to halve: seven freezes of ~875MB, two of
  # them on macOS runners that bill at 10x. The trade is that a pull request no
  # longer proves the Ubuntu 22.04 and the macOS x86_64 bundles still build.
  # Nothing ships unproven, though -- "deploy.yml" runs on a push, which is always
  # deep, and refuses a release that is missing any platform. Put "#deepTest" on a
  # pull request that touches the freeze, and the whole set runs before it merges.
  #
  # macos-15-x86_64 is here rather than in PLATFORMS_CORE for the billing rate and
  # for one reason of its own: it is the architecture Apple stopped shipping, so
  # it is the build least likely to be the one a change breaks and the one a
  # contributor is least likely to be on. A release still carries it, and
  # "#deepTest" still builds it before a merge.
  PLATFORMS_DEEP: >-
    [{"os": "ubuntu-22.04", "platform": "ubuntu-22.04-x86_64"},
    {"os": "ubuntu-22.04-arm", "platform": "ubuntu-22.04-arm64"},
    {"os": "macos-15-intel", "platform": "macos-15-x86_64"}]

  # Extra "Install" legs: a bundle run on a runner that did not build it.
  #
  # Every platform this run froze is installed on the image that froze it -- the
  # "Set matrix" job derives that from the lists above, so it cannot be forgotten.
  # These are the legs that go further: the macOS bundles on the *newest* macOS,
  # which is where "a frozen bundle runs on the OS it was built on and everything
  # newer" is either true or is a story we tell users. Nothing else tests it:
  # every other install runs a build on its own image.
  #
  # "macos-latest" rather than the macOS 26 it currently is, so that the leg keeps
  # asking about the newest macOS as GitHub moves the label rather than about the
  # one that was newest when this line was written. That is the opposite of the
  # rule for the freeze above, and deliberately -- see the note before `env`.
  #
  # They exercise the resolution as well as the binary, because "install.sh" runs
  # here without "--platform": a macOS 26 host has to read the manifest, work out
  # that the macOS 15 build is the one it can run, and fetch that. The assertion
  # after it names the platform, so resolving to the wrong build fails the job.
  #
  # arm64 is core rather than deep, unlike the freeze it replaced. We now ship one
  # arm64 build for every macOS version, so "it still starts on the newest macOS"
  # protects every Mac user rather than some of them -- and it is ~10 minutes
  # beside the hours of macOS "Examples" a pull request already pays for.
  INSTALL_FORWARD_CORE: >-
    [{"os": "macos-latest", "platform": "macos-15-arm64"}]
  # x86_64 follows its bundle: deep-only, both generations. Pinned, because
  # "macos-latest-intel" is not a label -- the moving one is arm64 only.
  INSTALL_FORWARD_DEEP: >-
    [{"os": "macos-26-intel", "platform": "macos-15-x86_64"}]

  # Which bundles the "Examples" job below runs the example packages through, and
  # with which suite. A representative subset of the builds above rather than all
  # of them: what those jobs exercise is the bundle's *behaviour*, which does not
  # differ between the 22.04 and the 24.04 build of the same architecture -- only
  # the libraries it links against do, and the "Install" jobs cover every
  # platform this run built for that. So this is one build per operating system
  # and architecture.
  #
  # Each runs on the image that froze it, and only there. What a second generation
  # would add is that the binary starts on a newer OS, which is the "Install"
  # job's question and is answered there for a tenth of the price -- an "Examples"
  # leg provisions a conda sandbox and renders every package.
  EXAMPLES_CORE: >-
    [{"os": "ubuntu-24.04", "platform": "ubuntu-24.04-x86_64", "suite": "PartCAD", "package": "//pub/examples/partcad", "render": true},
    {"os": "ubuntu-24.04", "platform": "ubuntu-24.04-x86_64", "suite": "All", "package": "//pub/examples", "render": false},
    {"os": "ubuntu-24.04-arm", "platform": "ubuntu-24.04-arm64", "suite": "PartCAD", "package": "//pub/examples/partcad", "render": true},
    {"os": "macos-15", "platform": "macos-15-arm64", "suite": "PartCAD", "package": "//pub/examples/partcad", "render": true},
    {"os": "macos-15", "platform": "macos-15-arm64", "suite": "All", "package": "//pub/examples", "render": false}]
  # macOS x86_64, whose bundle only a deep run has -- asking for it on a reduced
  # run would be asking to download an artifact nothing built. This is the only
  # place PartCAD runs a CAD sandbox on an Intel Mac at all, which is why it is
  # here rather than left to the "Install" job's smoke test. One suite rather
  # than the two the arm64 macOS gets: the runner bills at 10x, and "PartCAD" is
  # the suite that tests this repository rather than the public index.
  EXAMPLES_DEEP: >-
    [{"os": "macos-15-intel", "platform": "macos-15-x86_64", "suite": "PartCAD", "package": "//pub/examples/partcad", "render": true}]

jobs:
  set-matrix:
    name: "Set matrix"
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.set-matrix.outputs.build }}
      install: ${{ steps.set-matrix.outputs.install }}
      examples: ${{ steps.set-matrix.outputs.examples }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide the depth
        id: depth
        uses: ./.github/actions/test-depth

      - name: Set matrix
        id: set-matrix
        env:
          DEEP: ${{ steps.depth.outputs.deep }}
        run: |
          if [ "${DEEP}" = "true" ]; then
            platforms=$(jq -cn --argjson core '${{ env.PLATFORMS_CORE }}' --argjson deep '${{ env.PLATFORMS_DEEP }}' '$core + $deep')
            forward=$(jq -cn --argjson core '${{ env.INSTALL_FORWARD_CORE }}' --argjson deep '${{ env.INSTALL_FORWARD_DEEP }}' '$core + $deep')
            examples=$(jq -cn --argjson core '${{ env.EXAMPLES_CORE }}' --argjson deep '${{ env.EXAMPLES_DEEP }}' '$core + $deep')
          else
            platforms='${{ env.PLATFORMS_CORE }}'
            forward='${{ env.INSTALL_FORWARD_CORE }}'
            examples='${{ env.EXAMPLES_CORE }}'
          fi
          echo "Platforms: ${platforms}"
          echo 'build={"include": '"${platforms}"'}' >> "${GITHUB_OUTPUT}"

          # Everything the "Install" job can exercise, which is everything but
          # Windows: "install.sh" is a shell installer and there is none there.
          #
          # Derived from the build list rather than written out. That is what
          # makes "every bundle this run freezes is installed somewhere" true by
          # construction rather than by anyone remembering: there is no second
          # list to fall behind, and so nothing to check it against either.
          # INSTALL_FORWARD_* then adds the legs that run a bundle on an image
          # that did not build it -- those are a second list, and they are checked
          # below. `unique_by` because a forward leg naming an image already in
          # the build list would otherwise be two identical jobs.
          own=$(jq -c 'map(select(.platform | startswith("windows") | not) | {os, platform})' <<<"${platforms}")
          install=$(jq -cn --argjson own "${own}" --argjson forward "${forward}" \
            '($own + ($forward | map({os, platform}))) | unique_by([.os, .platform])')
          echo "Install: ${install}"

          # Every "Install" and "Examples" leg has to name a build this run
          # produced -- the deep-only ones are absent from a reduced run, and the
          # job would then wait for an artifact that nothing uploaded. Checked
          # rather than trusted, because these lists are edited separately from
          # the platform lists and a mismatch would otherwise show up as a
          # download failure well into the run.
          echo "Examples: ${examples}"
          built=$(jq -c '[.[].platform]' <<<"${platforms}")
          for pair in "Install:${install}" "Examples:${examples}"; do
            what="${pair%%:*}"
            legs="${pair#*:}"
            orphans=$(jq -r --argjson built "${built}" \
              '[.[] | select(.platform as $p | $built | index($p) | not) | .platform] | unique | join(" ")' \
              <<<"${legs}")
            if [ -n "${orphans}" ]; then
              echo "::error::the ${what} matrix asks for bundles this run does not build: ${orphans}"
              exit 1
            fi
          done
          echo 'install={"include": '"${install}"'}' >> "${GITHUB_OUTPUT}"
          echo 'examples={"include": '"${examples}"'}' >> "${GITHUB_OUTPUT}"

  build:
    name: "Build (${{ matrix.platform }})"
    needs: set-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.build) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The bundle embeds this interpreter, so this is the Python version
          # every user of the standalone tools ends up running. It is the newest
          # version PartCAD supports: a standalone user cannot change it after
          # the fact the way someone installing the wheels can, so shipping the
          # oldest supported interpreter would leave them on it for the life of
          # the bundle. Deliberately ahead of the wheels in "deploy.yml", which
          # publish from 3.13.
          python-version: "3.14"

      - name: Install system prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcairo2-dev

      # The platform id is passed rather than detected: the runner image label is
      # the authoritative answer to which OS version this is, and recovering it
      # from the running system is guesswork on Windows in particular.
      - name: Build the standalone bundle
        shell: bash
        run: dev-tools/pyinstaller/build.sh --platform=${{ matrix.platform }}

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: partcad-standalone-${{ matrix.platform }}
          path: |
            dist/standalone/*.tar.xz
            dist/standalone/*.zip
            dist/standalone/*.sha256
          if-no-files-found: error
          retention-days: 14

  # Every platform this run built that "install.sh" can install, which is every
  # one except Windows -- there is no shell installer there -- plus the macOS
  # bundles again on the next macOS generation. The runner is in the job name
  # because the platform no longer identifies the leg: "macos-15-arm64" is
  # installed twice, on macos-15 and on macos-latest, and those are the two jobs
  # that
  # together say the build runs everywhere it claims to.
  install:
    name: "Install (${{ matrix.platform }} on ${{ matrix.os }})"
    needs: [set-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.install) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Download the bundle
        uses: actions/download-artifact@v8
        with:
          name: partcad-standalone-${{ matrix.platform }}
          path: archives

      # "install.sh" reads the release manifest to learn which builds exist --
      # it keeps no list of its own -- so the directory it installs from needs
      # one, exactly as a release does. Generated by the same script the release
      # uses, from the archive this run actually produced: that is the contract
      # between the two being exercised, rather than asserted.
      - name: Describe what this run built
        shell: bash
        run: dev-tools/release/platforms-manifest.sh --bundles archives --output archives/platforms.json

      # This exercises the script users pipe into `sh`, against the archive
      # this run produced, on a machine where PartCAD was never installed.
      #
      # Deliberately without `--platform`: the installer resolving this machine
      # to one of the published builds is the part that can silently pick the
      # wrong one, so it runs for real and the result is asserted afterwards.
      # That assertion is the whole point of the forward legs -- on macos-latest
      # the installer has to read the manifest, work out that the macOS 15 build
      # is one this machine can run, and fetch it. A resolver that refused it, or
      # picked something else, fails here rather than in a user's terminal.
      - name: Install with install.sh
        shell: bash
        run: |
          version=$(sed -n 's/^__version__: str = "\(.*\)"$/\1/p' src/partcad/__init__.py)
          sh install.sh \
            --version "${version}" \
            --base-url "file://${PWD}/archives" \
            --install-dir "${HOME}/partcad-standalone" \
            --bin-dir "${HOME}/partcad-bin" 2>&1 | tee install.log
          # The line install.sh ends on: "Installed PartCAD <version>
          # (<platform>) in <dir>." -- the platform inside that line, so that a
          # correct download followed by a wrong install cannot pass. "PartCAD"
          # rather than anything looser because install.sh says "Installed the
          # PartCAD IDE ..." with --ide, and this job installs the bundle.
          #
          # It used to look for "(<platform>) is installed": #516 added this
          # assertion against its own branch's wording, #526 had already
          # reworded that line, the two edits were in different files so the
          # merge was clean, and the job has failed ever since however well the
          # install went -- taking the steps after it (running the commands, the
          # bundled OpenSCAD, the uninstall) with it.
          grep -q "Installed PartCAD .*(${{ matrix.platform }}) in " install.log || {
            echo "::error::install.sh did not resolve this machine to ${{ matrix.platform }}"
            exit 1
          }

      - name: Run the installed commands
        shell: bash
        run: |
          export PATH="${HOME}/partcad-bin:${PATH}"
          # From a directory that is not the checkout, so nothing can resolve
          # against the sources by accident.
          cd "${HOME}"
          pc version
          partcad --help
          pc init
          pc list

      # The bundled OpenSCAD has to survive being packed, downloaded and
      # unpacked with its executable bit intact, which the build's own smoke
      # test cannot show: it runs against the bundle before it is archived.
      - name: Run the bundled OpenSCAD after installation
        if: endsWith(matrix.platform, '-x86_64') && startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          export PATH="${HOME}/partcad-bin:${PATH}"
          cd "${HOME}"
          test -x "$(readlink -f "${HOME}/partcad-bin/pc" | xargs dirname)/_internal/openscad/AppRun"
          printf 'cube(10);\n' > smoke.scad
          "$(readlink -f "${HOME}/partcad-bin/pc" | xargs dirname)/_internal/openscad/AppRun" \
            --export-format binstl -o smoke.stl smoke.scad
          test -s smoke.stl
          pc --no-ansi healthcheck --filters openscad 2>&1 | tee healthcheck.log
          grep -q "OpenSCAD: Passed" healthcheck.log

      - name: Uninstall with install.sh
        shell: bash
        run: |
          sh install.sh --uninstall \
            --install-dir "${HOME}/partcad-standalone" \
            --bin-dir "${HOME}/partcad-bin"
          test ! -e "${HOME}/partcad-bin/pc"
          test ! -d "${HOME}/partcad-standalone"

  # The snap package: the Linux bundle above, wrapped so that `snap install` is
  # an option next to `install.sh` and `pip`. It packages the artifact rather
  # than freezing a second time, so what the snap carries is exactly what the
  # archive carries. See "dev-tools/snap/README.md".
  #
  # Not published anywhere: these are build artifacts, and uploading them to the
  # Snap Store is deliberately left for later (it needs store credentials, and a
  # manual review because the snap is classic). "deploy.yml" does not touch them.
  #
  # One base, two architectures. The base is what a snap runs on, and a core24
  # snap carries its own Ubuntu 24.04 runtime onto whatever distribution the
  # user has -- so unlike the standalone archives, there is nothing to gain from
  # a build per host OS version here. The build *host* still has to be the
  # base's release, which is why these are pinned to the ubuntu-24.04 images and
  # take the ubuntu-24.04 bundles.
  snap:
    name: "Snap (${{ matrix.arch }})"
    needs: build
    # Skipped on the release path and in the merge queue, like the examples
    # below. Nothing downstream consumes these: "deploy.yml" publishes the
    # wheels and the standalone archives, and a job whose output no release
    # carries has no business being able to block one.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/devel')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            bundle: ubuntu-24.04-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            bundle: ubuntu-24.04-arm64
    runs-on: ${{ matrix.os }}
    # Squashing ~875MB of frozen bundle is most of this.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Download the Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: partcad-standalone-${{ matrix.bundle }}
          path: archives

      # "snap/snapcraft.yaml" packages "dist/standalone/partcad", which is where
      # a local "dev-tools/pyinstaller/build.sh" leaves the bundle. Unpacking the
      # archive there puts the artifact in the same place -- and checks in
      # passing that the archive the release ships is intact.
      - name: Unpack the bundle
        run: |
          mkdir -p dist/standalone
          tar -xf archives/partcad-*-${{ matrix.bundle }}.tar.xz -C dist/standalone
          test -x dist/standalone/partcad/pc

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      # Destructive mode, so there is no LXD to set up: it builds straight on the
      # runner, which snapcraft only allows when the runner is the base's release.
      - name: Build the snap
        run: dev-tools/snap/build.sh --no-bundle --destructive-mode

      # Installing and running it is the only check that the bundle survives
      # being wrapped: that the apps resolve, that the classic confinement lets
      # the frozen interpreter start, and that PartCAD writes its state where the
      # snap directs it rather than into the home directory.
      - name: Install the snap and run it
        run: |
          sudo snap install --dangerous --classic dist/snap/partcad_*_${{ matrix.arch }}.snap
          # Only the app named after the snap gets the bare name; `pc` is
          # `partcad.pc` until aliased. Users do this too (see the README).
          sudo snap alias partcad.pc pc
          # Where snapd puts the commands. On the hosted images it is already on
          # PATH; say so anyway, so this does not depend on the image.
          export PATH="/snap/bin:${PATH}"
          # From a directory that is not the checkout, so nothing can resolve
          # against the sources by accident.
          cd "${HOME}"
          pc version
          partcad --help
          partcad.json-rpc --version
          pc init
          pc list

      # "snap/snapcraft.yaml" points PC_INTERNAL_STATE_DIR at the per-user
      # directory snapd gives the snap, so that PartCAD's cache, sandboxes and
      # git clones do not land in ~/.partcad. Nothing about the commands above
      # succeeding would show that, so check it from both ends: that snapd
      # exports the variable, and that PartCAD acted on it. Note that snapd
      # creates ~/snap/partcad/common for every snap it runs, so its mere
      # existence proves nothing and is not what is asserted.
      - name: Check the snap keeps its state in the snap directory
        run: |
          export PATH="/snap/bin:${PATH}"
          # `tail -n 1` so that anything snapd chooses to print first cannot be
          # mistaken for the value.
          # shellcheck disable=SC2016  # the expansion has to happen in the snap's shell, not here
          state_dir="$(echo 'echo "$PC_INTERNAL_STATE_DIR"' | snap run --shell partcad.pc | tail -n 1 || true)"
          echo "PC_INTERNAL_STATE_DIR as the snap sees it: '${state_dir}'"
          test "${state_dir}" = "${HOME}/snap/partcad/common" || {
            echo "::error::the snap does not export PC_INTERNAL_STATE_DIR=${HOME}/snap/partcad/common"
            exit 1
          }
          # ~/.partcad is still created and still holds the user configuration
          # and the telemetry id -- that is by design (see dev-tools/snap/README.md).
          # What must not be there is the state PC_INTERNAL_STATE_DIR redirects.
          for leftover in cache git tar external sandbox; do
            if [ -e "${HOME}/.partcad/${leftover}" ]; then
              echo "::error::PartCAD wrote '${leftover}' into ~/.partcad rather than the snap directory"
              exit 1
            fi
          done
          ls -la "${HOME}/.partcad" "${HOME}/snap/partcad/common" || true

      # A snap does not carry the user's shell environment, so a conda under
      # $HOME or a git outside the standard prefixes is not visible to it. That
      # is accepted: PartCAD falls back to `pythonSandbox: none` and reports both
      # as missing. The health check is run for the record, and deliberately not
      # allowed to fail the job over them.
      - name: Health check (informational)
        run: |
          export PATH="/snap/bin:${PATH}"
          cd "${HOME}"
          pc --no-ansi healthcheck 2>&1 | tee healthcheck.log || true
          echo "conda and git are expected to be reported missing here."

      - name: Remove the snap
        run: sudo snap remove --purge partcad

      - name: Upload the snap
        uses: actions/upload-artifact@v7
        with:
          name: partcad-snap-${{ matrix.arch }}
          path: |
            dist/snap/*.snap
            dist/snap/*.sha256
          if-no-files-found: error
          retention-days: 14

  # The wheel-based "Examples (PartCAD)" and "Examples (All)" jobs in test.yml,
  # cloned to run the same commands through the *bundled* `pc` rather than
  # `python -m partcad_cli ...`. This is the end-to-end check the build's own
  # smoke test cannot be: it fetches a git dependency (through the bundle's
  # libgit2, which nothing else here exercises), runs CAD scripts in the conda
  # sandbox, and -- on Linux x86_64 -- uses the OpenSCAD the bundle carries.
  #
  # Skipped on the release path (deploy.yml calls this workflow on a push to
  # main) and in the merge queue, to keep those fast and off heavy integration
  # tests; the deterministic build and install jobs above gate the release.
  examples:
    name: "Examples ${{ matrix.suite }} via bundle (${{ matrix.platform }})"
    needs: [set-matrix, build]
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/devel')
    # A representative subset of the build matrix, not all of it: EXAMPLES_CORE
    # and EXAMPLES_DEEP above say which builds and why. The deep half is why this
    # is an output of "set-matrix" rather than a literal list here -- a leg whose
    # bundle a reduced run did not freeze has to be absent, not skipped, or it
    # sits waiting for an artifact nothing will upload.
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.examples) }}
    runs-on: ${{ matrix.os }}
    # No conda cache and a sandbox built from scratch (cadquery-ocp is ~150MB),
    # so this is slower than the cached wheel-based jobs in test.yml.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # PartCAD runs CAD scripts in a conda sandbox it provisions at runtime, so
      # the bundle still needs conda/mamba on PATH -- the one host prerequisite
      # it does not carry, exactly as for the wheels.
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: 24.11.3-0
          use-mamba: true
          # conda-forge only, for the same ABI reason as in setup-all -- see the
          # comment there. The runtime sandbox PartCAD provisions below inherits
          # this channel list, so leaving 'defaults' in would let Anaconda builds
          # into it too.
          channels: conda-forge
          # Only base is needed -- PartCAD creates its own sandbox env at
          # runtime. No named env, which is the part of setup-all that is flaky
          # enough to need continue-on-error.
          auto-activate-base: true
          activate-environment: ""

      # The libraries the bundled OpenSCAD AppImage resolves from the host: it is
      # not fully self-contained (see dev-tools/pyinstaller/build.sh). A desktop
      # has these; a CI runner may not, so install them and let the examples use
      # the bundled OpenSCAD.
      - name: Install the bundled OpenSCAD's host libraries (Linux x86_64)
        if: matrix.platform == 'ubuntu-24.04-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1 libx11-6 libxcb1 libfontconfig1 libfreetype6 libglib2.0-0 libharfbuzz0b

      # The macOS bundles carry no OpenSCAD, and neither does the Linux arm64 one
      # -- upstream publishes the pinned release for x86_64 only (see build.sh).
      # Both fall back to a host OpenSCAD, exactly as the wheels do.
      - name: Install OpenSCAD (Linux arm64)
        if: matrix.platform == 'ubuntu-24.04-arm64'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends openscad

      # Same install as the wheel-based jobs' setup-test action.
      - name: Install OpenSCAD (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          # Homebrew disabled the "openscad" cask on 2026-09-01: the pinned
          # 2021.01 release does not pass the macOS Gatekeeper check. That makes
          # `brew install openscad` fail outright, and the retry beneath it --
          # which existed for a *corrupted cached* .dmg -- fail with it, so the
          # step could not succeed on any macOS runner.
          #
          # The snapshot cask is the maintained one, and it is what gets
          # installed on either architecture. On the arm64 runners it is also the
          # only candidate: 2021.01 ships an x86_64-only .dmg, so fetching that
          # release directly would quietly require Rosetta 2 rather than fix
          # anything -- "dev-tools/pyinstaller/build.sh" says so, and declines to
          # bundle OpenSCAD on macOS for exactly that reason. On macos-15-intel
          # that release would run, but Homebrew disabled the cask for everyone,
          # so there is nothing to gain from a second code path here.
          set -euo pipefail

          if ! command -v openscad >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask openscad@snapshot
          fi

          # A cask need not put a binary on PATH, and the .app it installs is not
          # named identically across versions, so look for the executable rather
          # than assuming either. `-iname`, because the binary inside the bundle
          # is "OpenSCAD" while what the tests invoke is "openscad".
          if ! command -v openscad >/dev/null 2>&1; then
            binary="$(find /Applications -maxdepth 4 -path '*/Contents/MacOS/*' \
              -type f -perm -111 -iname 'openscad' 2>/dev/null | head -n 1)"
            if [ -z "${binary}" ]; then
              echo "::error::openscad@snapshot installed but no OpenSCAD executable was found under /Applications"
              exit 1
            fi
            mkdir -p "${HOME}/.local/bin"
            ln -sf "${binary}" "${HOME}/.local/bin/openscad"
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.local/bin:${PATH}"
          fi

          # Proves the thing runs on this architecture, rather than that a file
          # of the right name exists. An x86_64 build on an arm64 runner with no
          # Rosetta fails here, which is the failure worth seeing.
          openscad --version

      - name: Download the bundle
        uses: actions/download-artifact@v8
        with:
          name: partcad-standalone-${{ matrix.platform }}
          path: archives

      # `--platform`, unlike the "Install" job above. The artifact downloaded
      # here holds the one build it is named after and no "platforms.json", so
      # there is no inventory for the installer to resolve this machine against.
      # Writing one into this directory would be worse than leaving it out: a
      # manifest describing every platform would point at archives that are not
      # here, so the installer would resolve the host to one of them and fail on
      # the download instead of on the missing manifest. Resolution is what the
      # "Install" job exercises, against a manifest generated from the archive
      # sitting beside it; what this job exercises is the bundle.
      - name: Install with install.sh
        shell: bash -el {0}
        run: |
          version=$(sed -n 's/^__version__: str = "\(.*\)"$/\1/p' src/partcad/__init__.py)
          sh install.sh \
            --version "${version}" \
            --platform "${{ matrix.platform }}" \
            --base-url "file://${PWD}/archives" \
            --install-dir "${HOME}/partcad-standalone" \
            --bin-dir "${HOME}/partcad-bin"
          # Put the bundled `pc` on PATH for the steps below.
          echo "${HOME}/partcad-bin" >> "${GITHUB_PATH}"

      - name: Healthcheck
        shell: bash -el {0}
        run: pc --no-ansi healthcheck

      # The same commands the wheel-based Examples jobs run, through the bundled
      # `pc`. No coverage: a frozen binary cannot be instrumented, and coverage
      # of the shipped bundle is not meaningful. `cd examples` so the local
      # package resolves as it does in test.yml.
      #
      # "The same commands" has to include how their failure is treated, and the
      # "All" suite in test.yml is `continue-on-error` -- it sweeps the example
      # packages the public index carries, and several of those have not been
      # updated for build123d 0.11, so it fails on somebody else's code. Without
      # the same escape hatch here, this job reported that as a broken bundle
      # while the "PartCAD" suite beside it -- the one that does test this
      # repository -- passed. Drop this and the two in test.yml together, when
      # the index is updated; see the TODOs there.
      - name: Run the ${{ matrix.suite }} examples through the bundle
        continue-on-error: ${{ matrix.suite == 'All' }}
        shell: bash -el {0}
        run: |
          cd examples
          pc --no-ansi list all -r ${{ matrix.package }}
          pc --no-ansi --threads-max 4 test -r --package ${{ matrix.package }}
          if [ "${{ matrix.render }}" = "true" ]; then
            pc --no-ansi --threads-max 4 render -r --package ${{ matrix.package }}
          fi
