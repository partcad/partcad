  integration-tests:
    # if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: "Run: pc"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The KiCad image as well, on the same rule as "test.yml": no test job
    # starts before every container it might run in has been published.
    # Nothing here starts that container today -- "features/open.feature"
    # asks "pc open" what it would do rather than doing it -- and the wait
    # is free either way, the build running from "scope" while
    # "poetry-install" is still going.
    needs: [scope, poetry-install, container-kicad]
    permissions:
      # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
      contents: read
      packages: read
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7
      - name: Setup Dev Container
        id: setup
        uses: ./.github/actions/setup-devcontainer

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Python Environment
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          # TODO: @alexanderilyin: Consider including devcontainer.json in the hash
          # Prefix bumped to -v2- to abandon the incrementally-built caches.
          # The old restore-keys fallback ('devcontainer-poetry-') served a
          # .venv that had been carried forward and patched across many lock
          # changes on this branch; behave then segfaulted at startup while
          # loading the OCP/VTK native stack, in a way that never reproduced
          # from a freshly built .venv. This forces a clean rebuild for the
          # current lock (there is no -v2- cache yet) and only ever restores
          # -v2- caches afterwards.
          key: devcontainer-poetry-v2-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            devcontainer-poetry-v2-

      - name: Run Acceptance Tests
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: "${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.setup.outputs.IMAGE_TAG }}"
          configFile: .devcontainer/devcontainer.json
          push: never
          # The images this run built, where it built any. Empty otherwise,
          # which "partcad_utils.container_image" reads as "the release" -- the
          # default every installed PartCAD has. Forwarded into the container
          # because that is where the tests run and where PartCAD reads it;
          # "test_part_example_kicad" starts the KiCad sandbox by this name.
          # See "Which images this run uses" on "Scope".
          env: |
            PC_CONTAINER_IMAGE_TAG=${{ needs.scope.outputs.image-override }}
            PC_CONTAINER_IMAGE_OWNER=${{ needs.scope.outputs.image-owner }}
          # Same shape as the two jobs above: every "pc" counts, and the report
          # is still written when one of them fails. This job was the only one of
          # the three that ever went red, and only by accident -- the "pc"
          # commands failed early enough to leave no coverage data, so the
          # "coverage xml" it ended on failed too.
          runCmd: |
            set -e
            mkdir -pv pc-test-results
            poetry --no-ansi --no-interaction show --tree
            status=0
            # TODO: Use similar 'coverage run' in behave steps when calling pc
            poetry --no-ansi --no-interaction run sh -c "(cd examples && coverage run $(poetry run which pc) --no-ansi list all -r //pub/examples)" || status=$?
            poetry --no-ansi --no-interaction run sh -c "(cd examples && coverage run $(poetry run which pc) --no-ansi test -r --package //pub/examples)" || status=$?
            poetry --no-ansi --no-interaction run sh -c "(cd examples && coverage run $(poetry run which pc) --no-ansi render -r --package //pub/examples)" || status=$?
            poetry --no-ansi --no-interaction run coverage xml --data-file=examples/.coverage -o pc-test-results/coverage.xml || true
            exit $status

      - name: Upload test results
        if: always()
        uses: ./.github/actions/upload-test-results
        with:
          name: pc-test-results
          path: pc-test-results/
          retention-days: 7
