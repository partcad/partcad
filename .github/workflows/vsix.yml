# The VS Code extension: one build, two ".vsix" packages.
#
# The extension itself, published as "PartCAD.partcad-official", and the
# transition shim in "ide/vscode-shim" published as "OpenVMP.partcad" -- the
# identity the extension used to have, kept alive as a package that only depends
# on the new one. Built together because they state one version and it has to be
# the same version.
#
# Called by "build.yml" (CD) and by "deploy.yml", which uploads the packages to
# the GitHub release. It deliberately has no "push"/"pull_request" triggers of
# its own: adding it to those two workflows on top would build the same package
# twice per commit. Exactly one run owns the build -- the same arrangement
# "build-ide-standalone.yml" documents for the command line bundles.
#
# This replaces "nox.yml". The extension used to carry a Python language server
# and a "bundled/libs" of PartCAD's dependencies, which is what needed nox,
# pip-compile, an interpreter and a page of native build prerequisites here --
# and which could only ever have worked on the one platform this job runs on,
# because those wheels are compiled. The extension is a JSON-RPC client now:
# TypeScript, npm, nothing else.
name: Extension # Keep the action badge icon short

on:
  workflow_dispatch:
  workflow_call:

# No "concurrency" block, on purpose. A called workflow evaluates
# `github.workflow` as the *caller's* name, so a group keyed on it would compute
# the group the caller is already holding and `cancel-in-progress` would kill the
# run that started this one. See the note on `concurrency` in
# "build-standalone.yml", which is where that was learned.

jobs:
  build:
    strategy:
      matrix:
        # ubuntu-24.04 is still the newest generally available Ubuntu LTS
        # runner image (ubuntu-26.04 is preview only), so this stays pinned.
        # One runner is now correct rather than merely cheap: the package has no
        # compiled content left, so the ".vsix" this produces is the same on
        # every platform.
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - name: Install dependencies
        working-directory: ide/vscode
        run: npm ci

      # `npm run vsce-package` runs `vscode:prepublish`, which is the production
      # webpack build, so this compiles and packages in one step. Lint and the
      # type check run in "npm-test.yml"; a packaging job that also linted would
      # be a second place for the same failure to appear.
      - name: Package the extension
        working-directory: ide/vscode
        run: npm run vsce-package

      # The "OpenVMP.partcad" transition shim, which is what the marketplace
      # entry the extension used to be published under serves now: no code, one
      # "extensionDependencies" on "PartCAD.partcad-official". See
      # "ide/vscode-shim/AGENTS.md".
      #
      # No "npm ci" and no lockfile of its own: there is nothing to compile and
      # nothing to bundle, so "vsce" comes from "npx" rather than from a second
      # node project existing to hold one dev dependency. The version is pinned
      # to the same "@vscode/vsce" the extension builds with.
      #
      # The version is the extension's, read here and handed to "vsce" rather
      # than written down in the shim's "package.json" (which holds an obvious
      # placeholder). "--no-update-package-json" is what keeps it out of the
      # file: the argument reaches the built ".vsix" and nothing on disk moves.
      # See "The version is not its own" in "ide/vscode-shim/AGENTS.md" for why
      # a second copy of the release version is a thing this repository has
      # already decided not to keep.
      - name: Package the transition shim
        working-directory: ide/vscode-shim
        run: npm run vsce-package

      # Both "vsce-package" scripts write a fixed name -- "partcad.vsix" because
      # "ide/standalone/build.sh" looks for that exact one. A release asset
      # cannot be version-less though -- every other asset on the release carries
      # the version -- so the copies that get uploaded are renamed here rather
      # than by changing the script the IDE build depends on.
      #
      # They are collected into one directory first. Handing "upload-artifact"
      # two globs under different directories would make "ide/" their common
      # ancestor and nest the artifact one level deeper on each side, which
      # "deploy.yml" then uploads to the release as directories rather than as
      # the two files it expects.
      - name: Name the packages after the version
        run: |
          version="$(jq -r .version ide/vscode/package.json)"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error::no version in ide/vscode/package.json"
            exit 1
          fi
          mkdir -p vsix
          cp ide/vscode/partcad.vsix "vsix/partcad-${version}.vsix"
          cp ide/vscode-shim/partcad-shim.vsix "vsix/partcad-shim-${version}.vsix"
          ls -l vsix

      - name: Upload the extensions
        uses: actions/upload-artifact@v7
        with:
          # Deliberately neither "partcad-ide-*" nor "partcad-standalone-*":
          # "deploy.yml" downloads those two by pattern, each into its own
          # directory, and a third name matching either would be merged into the
          # wrong one.
          name: partcad-vsix
          path: vsix/*.vsix
          if-no-files-found: error
