# CI on Linux, MacOS and Windows
name: CI # Keep the action badge icon short

on:
  workflow_dispatch:
  schedule:
    # https://crontab.guru/#0_8_*_*_*
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
    - cron: "0 18 * * *" # Run daily at Pacific time morning
  merge_group:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]

permissions:
  contents: read

concurrency:
  # Version bumps get a concurrency group of their own, keyed by commit: theirs
  # is the run that publishes the version-tagged KiCad sandbox image and the
  # only one that runs the full matrix on devel, and neither is ever done again
  # for that version. Cancelling it is what left 0.7.180 without a KiCad image
  # on ghcr. See the same block in "test-dev.yml" for the dev container image.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ startsWith(github.event.head_commit.message, 'Version updated') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

env:
  # Runner images, checked against actions/runner-images on 2026-07-21.
  # For every OS we run the '*-latest' alias plus one other generally
  # available image, so that a change of what '*-latest' points at cannot
  # silently become the only thing we ever tested on.
  #
  # Linux arm64 is here on both supported LTS releases. There is no
  # 'ubuntu-latest-arm' alias to follow, so these are named explicitly.
  # cadquery-ocp publishes aarch64 Linux wheels as of 7.9.3.1.1, which is what
  # made this possible at all.
  #
  # Deliberately NOT in this list:
  #  * ubuntu-24.04, windows-2025, macos-15 - these are exactly what
  #    ubuntu-latest / windows-latest / macos-latest alias today, so naming
  #    them as well would run the very same image twice.
  #  * ubuntu-26.04 (and ubuntu-26.04-arm) - still a preview image, not
  #    covered by the Actions SLA, so it would only make CI flaky.
  #  * windows-11-arm - Windows on arm64 is not a platform PartCAD builds or
  #    releases for; adding it to CI would test something nothing ships.
  #  * macos-14 - deprecated by GitHub, scheduled for removal.
  #  * macos-13 - no macos-13 job has ever started on the current runner
  #    plan. They queue for hours and are eventually cancelled without
  #    executing, so they only ever left checks pending forever.
  OSES:
    '["ubuntu-latest", "ubuntu-22.04", "ubuntu-24.04-arm", "ubuntu-22.04-arm", "windows-latest", "windows-2022",
    "macos-latest", "macos-26"]'
  # Of those, the ones a pull request does not pay for by default. They are
  # dropped unless the run is deep -- the nightly schedule, a manual dispatch,
  # a push, or "#deepTest" in the pull request; see
  # ".github/actions/test-depth".
  #
  # Which ones, and why these:
  #  * both Ubuntu 22.04 images. 24.04 is what 'ubuntu-latest' is, and a
  #    breakage specific to the older release is rare enough to be worth
  #    finding nightly rather than on every push.
  #  * macos-26, leaving one macOS. macOS minutes bill at 10x, so this is the
  #    single largest saving here. The one that stays is 'macos-latest',
  #    because that is the version most contributors and most users are on.
  OSES_DEEP_ONLY: '["ubuntu-22.04", "ubuntu-22.04-arm", "macos-26"]'
  PYTHONS: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
  # The two ends of the range a *sandbox* can be built at:
  # sandbox_versions.MIN_PYTHON_VERSION_CADQUERY and MAX_PYTHON_VERSION_CAD.
  # Keep them in step with those constants.
  #
  # This is a different axis from PYTHONS above, which is the range PartCAD
  # itself is supported on. The two used to be the same thing by accident: a
  # package that named no 'pythonVersion' was given the version of whatever
  # interpreter PartCAD was running on, so a matrix leg's Python decided its
  # sandbox's Python too. It no longer does - a sandbox is built at the version
  # PartCAD pins - so for the jobs whose subject is the sandbox, running five
  # host Pythons now builds the same sandbox five times over. They run these
  # two instead, which are the versions a sandbox can actually come out at.
  #
  # Jobs whose subject is PartCAD rather than the sandbox keep the full range:
  # 'test-pytest' exercises PartCAD's own code on each interpreter, and
  # 'test-examples-all' is the broad feature sweep.
  #
  # NOT filtered by EXCLUDES, deliberately. That list encodes "every image but
  # ubuntu-latest runs the oldest and the newest Python only", which for this
  # two-entry list would drop 3.11 everywhere else and leave a single version -
  # the opposite of testing both bounds.
  PYTHONS_SANDBOX: '["3.11", "3.14"]'
  # Number of parallel shards the behave suite is split into. Keep in sync with
  # the "shard" list in the set-matrix job's matrix-behave output.
  BEHAVE_SHARDS: 4
  # 8 OSes x 5 Pythons = 40 combinations per job, and macOS minutes bill at
  # 10x, which is not affordable. Only ubuntu-latest runs the full Python
  # range; every other image runs the oldest and the newest supported Python
  # only, which is where a version specific breakage actually shows up, plus
  # Windows on 3.12 (see the note below). 40 -> 21 combinations.
  #
  # NOTE: windows + Python 3.12 used to be excluded on its own, for an
  # 'ensurepip' failure (see #374), NOT for a missing cadquery-ocp wheel. It is
  # deliberately back in the matrix here: the toolchain underneath it has moved
  # a long way (miniforge 24.11 -> 26.3, setup-miniconda v3 -> v4), so this run
  # is what tells us whether #374 is still real. Re-exclude it if it is.
  EXCLUDES: >-
    [{"os": "ubuntu-22.04", "python-version": "3.11"},
    {"os": "ubuntu-22.04", "python-version": "3.12"},
    {"os": "ubuntu-22.04", "python-version": "3.13"},
    {"os": "ubuntu-24.04-arm", "python-version": "3.11"},
    {"os": "ubuntu-24.04-arm", "python-version": "3.12"},
    {"os": "ubuntu-24.04-arm", "python-version": "3.13"},
    {"os": "ubuntu-22.04-arm", "python-version": "3.11"},
    {"os": "ubuntu-22.04-arm", "python-version": "3.12"},
    {"os": "ubuntu-22.04-arm", "python-version": "3.13"},
    {"os": "windows-latest", "python-version": "3.11"},
    {"os": "windows-latest", "python-version": "3.13"},
    {"os": "windows-2022", "python-version": "3.11"},
    {"os": "windows-2022", "python-version": "3.13"},
    {"os": "macos-latest", "python-version": "3.11"},
    {"os": "macos-latest", "python-version": "3.12"},
    {"os": "macos-latest", "python-version": "3.13"},
    {"os": "macos-26", "python-version": "3.11"},
    {"os": "macos-26", "python-version": "3.12"},
    {"os": "macos-26", "python-version": "3.13"}]
  # The sharded 'test-behave' jobs and 'test-pub-repo' (45 min) are by far the
  # most expensive, so they get a reduced OS axis: the '*-latest' images only.
  # Behave then shards each of those BEHAVE_SHARDS ways. Linux arm64 is
  # deliberately not here: it is covered by 'test-pytest' and both
  # 'test-examples-*' jobs above, which is what would catch an architecture
  # specific breakage, and adding it here would multiply the most expensive jobs
  # in the workflow by BEHAVE_SHARDS.
  OSES_SLIM: '["ubuntu-latest", "windows-latest", "macos-latest"]'
  # Behave's Python axis: the oldest and the newest PartCAD is supported on.
  # Behave drives the command line rather than the sandbox, so what matters here
  # is the interpreter PartCAD itself runs on. 'test-pub-repo', which renders
  # the public index, uses PYTHONS_SANDBOX instead.
  PYTHONS_SLIM: '["3.10", "3.14"]'
  VERSION: 0.8.5
  CONTAINER_REGISTRY: ghcr.io
  PC_TELEMETRY_ENV: test
  PC_TELEMETRY_PERFORMANCE: false

jobs:
  build-containers:
    name: "Build Docker Containers"
    runs-on: ubuntu-24.04
    if: ${{ github.ref != 'refs/heads/devel' || startsWith(github.event.head_commit.message, 'Version updated') }}
    permissions:
      packages: write
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7
      - name: Setup Dev Container
        id: setup
        uses: ./.github/actions/setup-devcontainer

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container for Kicad
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom:
            "${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}-container-kicad:${{ steps.setup.outputs.IMAGE_TAG }}"
          imageName: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}-container-kicad
          imageTag: ${{ steps.setup.outputs.IMAGE_TAG }}
          configFile: tools/containers/devcontainer-kicad.json
          push: always

  set-matrix:
    name: "Set matrix"
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/devel' || startsWith(github.event.head_commit.message, 'Version updated') }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      matrix-sandbox: ${{ steps.set-matrix.outputs.matrix-sandbox }}
      matrix-slim: ${{ steps.set-matrix.outputs.matrix-slim }}
      matrix-behave: ${{ steps.set-matrix.outputs.matrix-behave }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide the depth
        id: depth
        uses: ./.github/actions/test-depth

      - name: Set matrix
        id: set-matrix
        env:
          DEEP: ${{ steps.depth.outputs.deep }}
        run: |
          # The OS axis of the full matrix, with the deep-only images removed
          # when this is not a deep run. 'matrix-slim' is untouched: it is
          # already the '*-latest' images only, none of which are deep-only.
          if [ "${DEEP}" = "true" ]; then
            OSES='${{ env.OSES }}'
          else
            OSES=$(jq -cn --argjson all '${{ env.OSES }}' --argjson deep_only '${{ env.OSES_DEEP_ONLY }}' '$all - $deep_only')
          fi
          echo "Operating systems: ${OSES}"
          # EXCLUDES still names images that may have just been dropped. That is
          # harmless -- an exclude for a combination the matrix does not contain
          # simply matches nothing -- and keeps one list to maintain rather than
          # two that have to agree.
          echo 'matrix={"os": '"${OSES}"', "python-version": ${{ env.PYTHONS }}, "exclude": ${{ env.EXCLUDES }}}' >> "${GITHUB_OUTPUT}"
          # The same OS axis as 'matrix', so it follows the depth too, but the
          # two versions a sandbox can be built at rather than every version
          # PartCAD runs on -- and no excludes, which would leave only one of
          # the two on every image but ubuntu-latest. See PYTHONS_SANDBOX above.
          echo 'matrix-sandbox={"os": '"${OSES}"', "python-version": ${{ env.PYTHONS_SANDBOX }}}' >> "${GITHUB_OUTPUT}"
          # 'test-pub-repo' renders the public index, so its subject is the
          # sandbox as well; only its OS axis is the reduced one.
          echo 'matrix-slim={"os": ${{ env.OSES_SLIM }}, "python-version": ${{ env.PYTHONS_SANDBOX }}}' >> "${GITHUB_OUTPUT}"
          # Behave is single-process and dominates CI wall-clock, so it runs
          # sharded across parallel jobs. The "shard" axis is derived from
          # BEHAVE_SHARDS (1..N) here, so the number of behave jobs can never
          # drift from it, and crosses os/python. Behave uses the slim matrix
          # (like test-pub-repo), so sharding does not multiply the full matrix.
          SHARDS_JSON=$(python3 -c "import json, os; print(json.dumps(list(range(1, int(os.environ['BEHAVE_SHARDS']) + 1))))")
          echo 'matrix-behave={"os": ${{ env.OSES_SLIM }}, "python-version": ${{ env.PYTHONS_SLIM }}, "shard": '"$SHARDS_JSON"'}' >> "${GITHUB_OUTPUT}"

  # cache-preheat:
  #   name: "Update caches"
  #   needs: set-matrix
  #   strategy:
  #     fail-fast: false
  #     matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
  #   runs-on: ${{ matrix.os }}
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: ./.github/actions/setup-all
  #       with:
  #         job: cache-preheat
  #         preheat_only: "true"

  test-pytest:
    name: "Pytest"
    needs:
      - set-matrix
      - build-containers
      # - cache-preheat
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # 30 -> 60: the build123d 0.11 / OCP 7.9 stack installs a much larger
    # dependency tree into each sandbox (~20 min on the previous stack). Measured
    # here: ubuntu ~25-31 min, Windows ~38-50 min -- the 45-minute step was still
    # catching the slower Windows runs, so give it headroom.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-all
        with:
          job: pytest
      - uses: ./.github/actions/setup-test
        with:
          job: pytest

      - name: Test with pytest
        # env:
        #   PYTHONWARNINGS: ignore
        shell: bash -el {0}
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mamba activate ${{ format('env-test-pytest-{0}', matrix.python-version) }}

          mkdir -pv pytest-test-results
          # '--junitxml' overrides the one in 'pyproject.toml', which writes to
          # 'pytest-results/' -- a directory this job neither uploads nor hands
          # to Codecov, so the JUnit report was written and then thrown away and
          # Codecov said "JUnit XML file not found" on every run. Point it at the
          # directory the upload step below actually reads.
          pytest \
            tests cad/freecad \
            --junitxml=pytest-test-results/junit.xml \
            -x -p no:error-for-skips -p no:warnings --dist no
          coverage xml --rcfile=./dev-tools/coverage.rc --data-file=.coverage -o ./pytest-test-results/coverage.xml
          mamba deactivate

      - name: Upload test results & coverage reports to github and codecov
        uses: ./.github/actions/upload-test-results
        with:
          name: pytest-test-results-${{matrix.os}}-${{matrix.python-version}}
          path: pytest-test-results/
          retention-days: 7
          status: ${{ job.status }}
          token: ${{ secrets.CODECOV_TOKEN }}
          codecov-files: pytest-test-results/junit.xml
          coverage-report: pytest-test-results/coverage.xml

  test-behave:
    name: "Behave"
    needs:
      - set-matrix
      # - cache-preheat
    strategy:
      fail-fast: false
      # Sharded, reduced matrix: the slim OS/Python set (OSES_SLIM/PYTHONS_SLIM),
      # each split BEHAVE_SHARDS ways across parallel jobs.
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix-behave) }}
    runs-on: ${{ matrix.os }}
    # The suite is sharded BEHAVE_SHARDS ways, so a single shard is a fraction
    # of the old whole-suite runtime (which used to hit the 120m cap on
    # Windows). 60m leaves generous margin for the slowest shard.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-all
        with:
          job: behave
      - uses: ./.github/actions/setup-test
        with:
          job: behave

      # For Windows only, use PowerShell to set the SSH agent service in the manual launch mode
      - name: Set SSH Agent Service to Manual
        if: runner.os == 'Windows'
        run: Set-Service -Name ssh-agent -StartupType Manual
        shell: pwsh

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_RO }}

      - name: Test with behave
        shell: bash -el {0}
        # Pass matrix.* through env rather than interpolating templates straight
        # into the script (zizmor template-injection). BEHAVE_SHARDS and PYTHONS
        # are already exported as workflow-level env vars.
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mkdir -pv behave-test-results

          mamba activate ${{ format('env-test-behave-{0}', matrix.python-version) }}

          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8

          # This shard's slice of the feature files (balanced by scenario
          # count). Across all shards every feature runs; sharding only changes
          # how many run in parallel.
          FEATURES=$(python dev-tools/behave_shard.py --shards "$BEHAVE_SHARDS" --index "$MATRIX_SHARD")
          echo "Shard $MATRIX_SHARD/$BEHAVE_SHARDS runs:"
          printf '  %s\n' $FEATURES

          BEHAVE_ARGS="$FEATURES"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BEHAVE_ARGS="$BEHAVE_ARGS --tags=-skip-windows"
          fi

          # Coverage of the source that behave exercises is, apart from
          # OS-specific branches, identical across Python versions -- so only
          # the lowest Python of each OS traces (this keeps the OS-specific
          # coverage, e.g. the Windows registry paths). Every other cell runs
          # the CLI directly (see features/steps/run.py), which removes
          # coverage.py from each subprocess the scenarios spawn. All scenarios
          # still run on every cell.
          COV_PY=$(echo "$PYTHONS" | python -c "import json,sys; print(json.load(sys.stdin)[0])")
          if [[ "$MATRIX_PYTHON" == "$COV_PY" ]]; then
            export PC_BEHAVE_COVERAGE=1
            # The scenarios drive `pc`, but a thin client hands the work to the
            # daemon -- a separate process that the `coverage run` below does
            # not wrap, and where most of the code under test runs. These make
            # coverage.py trace it too, through its own subprocess mechanism
            # (see dev-tools/coverage-subprocess/sitecustomize.py). Absolute
            # paths, because the daemon chdir()s to "/".
            export COVERAGE_PROCESS_START="$PWD/dev-tools/coverage.rc"
            export COVERAGE_FILE="$PWD/.coverage"
            export PYTHONPATH="$PWD/dev-tools/coverage-subprocess${PYTHONPATH:+:$PYTHONPATH}"
            if ! coverage run --rcfile=./dev-tools/coverage.rc --data-file=.coverage -m behave $BEHAVE_ARGS; then
              echo "Behave tests failed"
              exit 1
            fi
            coverage combine
            coverage xml --rcfile=./dev-tools/coverage.rc --data-file=.coverage -o ./behave-test-results/coverage.xml
          else
            if ! behave $BEHAVE_ARGS; then
              echo "Behave tests failed"
              exit 1
            fi
          fi
          mamba deactivate

      - name: Upload test results & coverage reports to github and codecov
        uses: ./.github/actions/upload-test-results
        with:
          name: behave-test-results-${{matrix.os}}-${{matrix.python-version}}-${{matrix.shard}}
          path: behave-test-results/
          retention-days: 7
          status: ${{ job.status }}
          token: ${{ secrets.CODECOV_TOKEN }}
          codecov-files: behave-test-results/junit.xml
          coverage-report: behave-test-results/coverage.xml

  test-examples-partcad:
    name: "Examples (PartCAD)"
    needs:
      - set-matrix
      # - cache-preheat
    strategy:
      fail-fast: false
      # The sandbox matrix: this job renders every part type this repository
      # defines, so what it is really testing is sandbox provisioning, and a
      # sandbox no longer varies with the interpreter PartCAD runs on. See
      # PYTHONS_SANDBOX above.
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix-sandbox) }}
    runs-on: ${{ matrix.os }}
    # 30 -> 75: this job renders the examples, so it populates sandboxes harder
    # than "Examples (All)" and felt the larger OCP 7.9 install the most; the SDF
    # examples (#461) then added marching-cubes render time on top. Measured with
    # both: ubuntu 24-32 min, Windows ~55 min and climbing -- 60 min was still
    # cancelling the slowest Windows cells, so give it real headroom.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-all
        with:
          job: examples-partcad
      - uses: ./.github/actions/setup-test
        with:
          job: examples-partcad

      - name: Basic integration test for CLI (PartCAD examples)
        shell: bash -el {0}
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mkdir -pv examples-partcad-test-results

          mamba activate ${{ format('env-test-examples-partcad-{0}', matrix.python-version) }}

          # BEGIN PARTCAD EXAMPLES
          cd ./examples
          coverage run --rcfile=../dev-tools/coverage.rc --data-file=.coverage.1 -m partcad_cli.click.command --no-ansi list all -r //pub/examples/partcad
          # TODO(clairbee): Limit RAM usage by restricting the number of threads?
          coverage run --rcfile=../dev-tools/coverage.rc --data-file=.coverage.2 -m partcad_cli.click.command --no-ansi --threads-max 4 test -r --package //pub/examples/partcad
          coverage run --rcfile=../dev-tools/coverage.rc --data-file=.coverage.3 -m partcad_cli.click.command --no-ansi --threads-max 4 render -r --package //pub/examples/partcad
          coverage combine
          # END PARTCAD EXAMPLES

          coverage xml --rcfile=../dev-tools/coverage.rc --data-file=.coverage -o ../examples-partcad-test-results/coverage.xml
          mamba deactivate

      # The images and README.md files under 'examples/' are what the render
      # above produces, and they are checked in on purpose: a change in how
      # PartCAD renders then shows up here as a diff, which is the only thing
      # that makes them a regression canary rather than decoration. Without this
      # a render that produces different - or new - files passes green, which is
      # how several examples came to reference images that were never committed.
      # To make it pass, re-render locally and commit the result, or fix the
      # regression.
      #
      # This job rather than a job of its own, so the check reuses the sandboxes
      # the render above has already provisioned; and one cell of the matrix
      # rather than all of them, because what is checked in is one rendering and
      # only the sandbox is pinned across images. The projection itself is
      # produced by the sandbox, so the other cells should agree - but "should"
      # is not what a required check is for, and a spurious failure on macOS
      # would train people to ignore this one.
      #
      # UNSTABLE is what a render is expected to rewrite every time, because the
      # tool that writes it cannot write it reproducibly. It is a list to keep
      # short: every entry is a file nobody is watching any more. An entry needs
      # a reason here, and the package it belongs to has to carry the same
      # reason where a reader of that package will meet it. Nothing PartCAD
      # implements itself is on it: the built-in DXF renderer suppresses the
      # timestamp and GUIDs a DXF is otherwise stamped with, and pins the order
      # of its CLASSES section, under the 'reproducible' parameter of the 'dxf'
      # file type.
      #
      # The interpreter named here has to be one PYTHONS_SANDBOX lists, because
      # that is this job's matrix. It named '3.10' until PYTHONS_SANDBOX was
      # introduced, and the condition then matched no cell at all: this check
      # silently stopped running, which is the failure it exists to catch,
      # applied to itself. Change the two together.
      - name: The rendered examples must match what is checked in
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # draftwright emits two faces of one glyph in an order that follows
          # the process's hash seed - which a wrapper running under '-I' cannot
          # pin - and stamps the PDF with the time it was written. Neither is
          # settable through anything it takes; see 'render:' in the example's
          # partcad.yaml.
          #
          # The four raster projections below drift for a different reason: the
          # bytes are not PartCAD's. '//builtin/render' projects the shape to
          # SVG itself - and those SVGs are byte-stable, which is why none of
          # them is listed here - then hands the SVG to svglib, reportlab's
          # renderPM and Pillow to rasterize. That stack is resolved into the
          # sandbox at provisioning time, so a new release of any of it moves
          # the encoded bytes by a few tens without changing the picture. See
          # 'render:' in the example's partcad.yaml.
          UNSTABLE=(
            ':(exclude)examples/feature_render_custom/bracket.svg'
            ':(exclude)examples/feature_render_custom/bracket.pdf'
            ':(exclude)examples/feature_render/images/cube.png'
            ':(exclude)examples/feature_render/images/cube.jpg'
            ':(exclude)examples/feature_render/images/cylinder.png'
            ':(exclude)examples/feature_render/images/cylinder.jpg'
          )

          if [ -n "$(git status --porcelain -- examples "${UNSTABLE[@]}")" ]; then
            echo "::error::'pc render -r' changed the checked-in examples. Re-render locally ('cd examples && pc render -r') and commit the result, or fix the regression."
            git status --porcelain -- examples "${UNSTABLE[@]}"
            git --no-pager diff -- examples "${UNSTABLE[@]}"
            exit 1
          fi

      - name: Upload test results & coverage reports to github and codecov
        uses: ./.github/actions/upload-test-results
        with:
          name: examples-partcad-test-results-${{matrix.os}}-${{matrix.python-version}}
          path: examples-partcad-test-results/
          retention-days: 7
          status: ${{ job.status }}
          token: ${{ secrets.CODECOV_TOKEN }}
          codecov-files: examples-partcad-test-results/junit.xml
          coverage-report: examples-partcad-test-results/coverage.xml

  test-examples-all:
    name: "Examples (All)"
    needs:
      - set-matrix
      # - cache-preheat
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # 30 -> 75: same larger install (plus the SDF examples) as the other example
    # jobs; matches the "Examples (PartCAD)" budget so Windows does not straddle
    # the timeout.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-all
        with:
          job: examples-all
      - uses: ./.github/actions/setup-test
        with:
          job: examples-all

      # This exercises the whole public index (//pub/examples), most of which
      # lives in the separate 'openvmp/partcad-index' repository. Several of
      # those example scripts still use build123d APIs removed in 0.11
      # (Face.thicken, Part.find_intersection, Solid.make_solid, ...), which
      # this repository cannot fix. The step is allowed to fail so those
      # external breakages do not block this PR; our own examples stay gated by
      # "Examples (PartCAD)" above, which is not marked this way.
      # TODO(clairbee): drop continue-on-error once partcad-index is updated
      # for build123d 0.11.
      - name: Basic integration test for CLI (all examples)
        continue-on-error: true
        shell: bash -el {0}
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mkdir -pv examples-all-test-results

          mamba activate ${{ format('env-test-examples-all-{0}', matrix.python-version) }}

          # BEGIN ALL EXAMPLES
          cd ./examples
          # TODO(clairbee): Limit RAM usage by restricting the number of threads?
          coverage run --rcfile=../dev-tools/coverage.rc --data-file=.coverage.1 -m partcad_cli.click.command --no-ansi list all -r //pub/examples
          coverage run --rcfile=../dev-tools/coverage.rc --data-file=.coverage.2 -m partcad_cli.click.command --no-ansi test -r --package //pub/examples
          coverage combine
          # END ALL EXAMPLES

          coverage xml --rcfile=../dev-tools/coverage.rc --data-file=.coverage -o ../examples-all-test-results/coverage.xml
          mamba deactivate

      - name: Upload test results & coverage reports to github and codecov
        uses: ./.github/actions/upload-test-results
        with:
          name: examples-all-test-results-${{matrix.os}}-${{matrix.python-version}}
          path: examples-all-test-results/
          retention-days: 7
          status: ${{ job.status }}
          token: ${{ secrets.CODECOV_TOKEN }}
          codecov-files: examples-all-test-results/junit.xml
          coverage-report: examples-all-test-results/coverage.xml

  test-pub-repo:
    name: "Repo //pub"
    needs:
      - set-matrix
      # - cache-preheat
    strategy:
      fail-fast: false
      # Reduced matrix on purpose: up to 60 minutes per job, and it hits the
      # network for the whole public repo. See OSES_SLIM/PYTHONS_SLIM above.
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix-slim) }}
    runs-on: ${{ matrix.os }}
    # 45 -> 60: Windows was already at ~35-38 min and the new stack is slower.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-all
        with:
          job: pub-repo
      - uses: ./.github/actions/setup-test
        with:
          job: pub-repo

      # The whole public index, most of which lives in 'openvmp/partcad-index'
      # and cannot be fixed here; see the note on "Examples (All)" above. Same
      # reasoning applies -- allow the step to fail so external build123d 0.11
      # breakages do not block this PR.
      # TODO(clairbee): drop continue-on-error once partcad-index is updated
      # for build123d 0.11.
      - name: Basic integration test for CLI (on the public repo)
        continue-on-error: true
        shell: bash -el {0}
        env:
          PC_PARTCAD_PACKAGE_SUB: ${{ github.workspace }}/partcad
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mkdir -pv pub-repo-test-results

          mamba activate ${{ format('env-test-pub-repo-{0}', matrix.python-version) }}

          # BEGIN PUBLIC REPO
          cd ./examples
          coverage run --rcfile=../dev-tools/coverage.rc --data-file=.coverage.1 -m partcad_cli.click.command --no-ansi list all -r //pub
          coverage run --rcfile=../dev-tools/coverage.rc --data-file=.coverage.2 -m partcad_cli.click.command --no-ansi --threads-max 4 test -r --package //pub
          coverage combine
          # END PUBLIC REPO

          coverage xml --rcfile=../dev-tools/coverage.rc --data-file=.coverage -o ../pub-repo-test-results/coverage.xml
          mamba deactivate

      - name: Upload test results & coverage reports to github and codecov
        uses: ./.github/actions/upload-test-results
        with:
          name: pub-repo-test-results-${{matrix.os}}-${{matrix.python-version}}
          path: pub-repo-test-results/
          retention-days: 7
          status: ${{ job.status }}
          token: ${{ secrets.CODECOV_TOKEN }}
          codecov-files: pub-repo-test-results/junit.xml
          coverage-report: pub-repo-test-results/coverage.xml
