# Run JavaScript tests for the VS Code extension
# TODO(clairbee): to be integrated into test.yml
name: npm test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - devel
    paths:
      - partcad-ide-vscode/**

jobs:
  build:
    strategy:
      # Don't let one OS failing cancel the other: a green Linux run was being
      # reported as failed only because it was canceled when the macOS job
      # failed. Keep both statuses independent (matches build.yml).
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest] # windows-latest for some reason doesn't run test suite.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 is the current Active LTS; 22.x is in maintenance now.
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: partcad-ide-vscode/package-lock.json
      - working-directory: partcad-ide-vscode
        run: npm install
      - working-directory: partcad-ide-vscode
        run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - working-directory: partcad-ide-vscode
        run: npm test
        if: runner.os != 'Linux'
