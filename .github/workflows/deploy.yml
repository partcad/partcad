# Deployment to PyPI
name: Deployment # Keep the action badge icon short

on:
  push:
    branches:
      - "main"
    tags:
      - "**"

permissions:
  contents: write

jobs:
  # The standalone bundles: the same tools packaged with their own Python
  # interpreter, for users who have none. One per supported OS version, all
  # attached to the same GitHub release as the wheels, which is where
  # "install.sh" downloads them from.
  #
  # That workflow also packs the Linux bundles as snaps. Those are deliberately
  # NOT part of this release: publishing them needs Snap Store credentials and,
  # because the snap is classic, a manual store review. Until that exists they
  # stay build artifacts of the "Standalone" workflow, and nothing here
  # downloads or uploads them.
  build-standalone:
    uses: ./.github/workflows/build-standalone.yml

  # The PartCAD IDE: the editor with the PartCAD extension and the command line
  # bundles above inside it, attached to the same release. It waits for the
  # bundles and is told not to build them again -- a called workflow shares this
  # run's artifacts, so it downloads what the job above produced.
  build-ide:
    needs: build-standalone
    uses: ./.github/workflows/build-ide-standalone.yml
    with:
      build_tools: false

  # Keep the "build" job identical to "python-build.yml".
  # TODO(clairbee): include "python-build.yml" instead
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 is still the newest generally available Ubuntu LTS
        # runner image (ubuntu-26.04 is preview only), so this stays pinned.
        os: [ubuntu-24.04]
        # The sdist/wheel we publish are pure Python, so a single interpreter
        # is enough. Pinned to 3.13 rather than the newest supported 3.14:
        # the release path should not be the first place a brand new
        # interpreter is exercised. Must match the guards on the upload steps
        # and the publish job below.
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    env:
      BIN_DIR: ${{ startsWith(matrix.os, 'windows') && 'Scripts' || 'bin' }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6
        id: cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-build-pip-${{ hashFiles('**/requirements.*') }}
          restore-keys: |
            ${{ runner.os }}-build-pip-
      - name: Prepare environments
        run: |
          python -m pip install --upgrade pip build
          mkdir .venv
          python -m venv .venv/build
          (. .venv/build/${{ env.BIN_DIR }}/activate && python -m pip install --upgrade pip build && deactivate)
          python -m venv .venv/build-cli
          (. .venv/build-cli/${{ env.BIN_DIR }}/activate && python -m pip install --upgrade pip build && deactivate)
          python -m venv .venv/install
          (. .venv/install/${{ env.BIN_DIR }}/activate && python -m pip install --upgrade pip build && deactivate)
          sudo apt install --yes libcairo2-dev python3-dev
      - name: Test building and packaging
        run: |
          # Build the shared partcad-utils wheel first; partcad and the CLI/service
          # pin it, and it is not published on PyPI. partcad-client pins it
          # in turn, and partcad-cli pins that.
          cp LICENSE.txt partcad-utils
          (. .venv/build/${{ env.BIN_DIR }}/activate && cd partcad-utils && python -m build && cd .. && deactivate)
          cp LICENSE.txt partcad-client
          (. .venv/build/${{ env.BIN_DIR }}/activate && cd partcad-client && python -m build && cd .. && deactivate)
          (. .venv/build/${{ env.BIN_DIR }}/activate && cd partcad && python -m build && cd .. && deactivate)
          (. .venv/build-cli/${{ env.BIN_DIR }}/activate && python -m pip install --find-links=partcad-utils/dist partcad-utils && deactivate)
          (. .venv/build-cli/${{ env.BIN_DIR }}/activate && python -m pip install -r partcad/requirements.txt && deactivate)
          (. .venv/build-cli/${{ env.BIN_DIR }}/activate && python -m pip install --no-index --find-links=partcad/dist partcad && deactivate)
          # Build the JSON-RPC service wheel too; partcad-cli pins it.
          cp LICENSE.txt partcad-service-json-rpc
          (. .venv/build-cli/${{ env.BIN_DIR }}/activate && cd partcad-service-json-rpc && python -m build && cd .. && deactivate)
          cp README.md partcad-cli
          (. .venv/build-cli/${{ env.BIN_DIR }}/activate && cd partcad-cli && python -m build && cd .. && deactivate)
      - name: Test installation
        run: |
          (. .venv/install/${{ env.BIN_DIR }}/activate && python -m pip install --find-links=partcad-utils/dist partcad-utils && deactivate)
          (. .venv/install/${{ env.BIN_DIR }}/activate && python -m pip install --find-links=partcad-client/dist --find-links=partcad-utils/dist partcad-client && deactivate)
          (. .venv/install/${{ env.BIN_DIR }}/activate && python -m pip install -r partcad/requirements.txt     && deactivate)
          (. .venv/install/${{ env.BIN_DIR }}/activate && python -m pip install --no-index --find-links=partcad/dist     partcad && deactivate)
          (. .venv/install/${{ env.BIN_DIR }}/activate && python -m pip install --no-index --find-links=partcad-service-json-rpc/dist partcad-service-json-rpc && deactivate)
          (. .venv/install/${{ env.BIN_DIR }}/activate && python -m pip install -r partcad-cli/requirements.txt && deactivate)
          (. .venv/install/${{ env.BIN_DIR }}/activate && python -m pip install --no-index --find-links=partcad-cli/dist partcad-cli && deactivate)
      # Upload artifact from the selected OS/Python version combination only
      - name: Upload "partcad"
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: partcad/dist/
      # "partcad" pins "partcad-utils"; "partcad-cli" pins that,
      # "partcad-client" and "partcad-service-json-rpc". None of them
      # exists on PyPI yet, so all of them have to be published with this release
      # or the released wheels cannot be installed.
      - name: Upload "partcad-utils"
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-utils
          path: partcad-utils/dist/
      - name: Upload "partcad-client"
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-client-utils
          path: partcad-client/dist/
      - name: Upload "partcad-service-json-rpc"
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-service
          path: partcad-service-json-rpc/dist/
      - name: Upload "partcad-cli"
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-cli
          path: partcad-cli/dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build
      # Deliberately blocking: a release that carries the wheels but not the
      # bundles is a release "install.sh" cannot install.
      - build-standalone
      # Blocking for the same reason: "install.sh --ide" installs from this
      # release too.
      - build-ide
    runs-on: ubuntu-24.04
    environment:
      name: pypi

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download lib dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Download utils dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions-utils
          path: dist

      - name: Download client-utils dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions-client-utils
          path: dist

      - name: Download service dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions-service
          path: dist

      - name: Download cli dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions-cli
          path: dist

      # Kept out of "dist", which is uploaded to PyPI as a whole.
      - name: Download standalone bundles
        uses: actions/download-artifact@v8
        with:
          pattern: partcad-standalone-*
          merge-multiple: true
          path: standalone

      - name: Download the IDE
        uses: actions/download-artifact@v8
        with:
          pattern: partcad-ide-*
          merge-multiple: true
          path: ide

      # "install.sh" derives an asset name from `uname` and fails for the user
      # if that asset is not on the release. Downloading artifacts does not fail
      # when none match, so check here, before the release exists, rather than
      # discovering a platform is missing after it is published.
      - name: Check the standalone bundles are complete
        run: |
          missing=0
          # The platforms built by "build-standalone.yml". Keep in sync with the
          # matrix there, and with LINUX_BUILDS/MACOS_BUILDS in "install.sh":
          # a name published here that the installer never asks for is dead
          # weight, and one it asks for that is not here is a failed install.
          for platform in \
            ubuntu-22.04-x86_64 ubuntu-22.04-arm64 \
            ubuntu-24.04-x86_64 ubuntu-24.04-arm64 \
            macos-15-arm64 macos-26-arm64 \
            windows-2022-x86_64 windows-2025-x86_64; do
            archive=$(find standalone -type f -name "partcad-*-${platform}.*" ! -name "*.sha256")
            checksum=$(find standalone -type f -name "partcad-*-${platform}.*.sha256")
            if [ -z "${archive}" ] || [ -z "${checksum}" ]; then
              echo "::error::no standalone bundle for ${platform}"
              missing=1
            else
              echo "${archive} $(stat -c%s "${archive}") bytes"
            fi
          done
          # And the same for the IDE, which "install.sh --ide" downloads by a
          # name derived the same way. There is more than one file per platform
          # here -- the archive, and the .dmg or the installer beside it -- so
          # this checks for the archive by name and then lists what came with it.
          for platform in linux-x86_64 macos-arm64 windows-x86_64; do
            case "${platform}" in
            windows-*) extension="zip" ;;
            *) extension="tar.gz" ;;
            esac
            archive="$(find ide -type f -name "partcad-ide-*-${platform}.${extension}" | head -n 1)"
            if [ -z "${archive}" ] || [ ! -f "${archive}.sha256" ]; then
              echo "::error::no IDE archive for ${platform}"
              missing=1
            else
              find ide -type f -name "partcad-ide-*-${platform}*" ! -name "*.sha256" \
                -printf "%p %s bytes\n"
            fi
          done
          exit "${missing}"

      - name: Determine the release tag
        if: github.ref == 'refs/heads/main'
        run: |
          git clone https://github.com/partcad/partcad partcad-git;
          cd partcad-git;
          echo "MERGED_TAG=$(git describe --abbrev=0)" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ env.MERGED_TAG }}' --repo '${{ github.repository }}' --notes "";
          gh release upload '${{ env.MERGED_TAG }}' dist/** --repo '${{ github.repository }}'
          gh release upload '${{ env.MERGED_TAG }}' standalone/** --repo '${{ github.repository }}'
          gh release upload '${{ env.MERGED_TAG }}' ide/** --repo '${{ github.repository }}'

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url:
            "${{ github.ref == 'refs/heads/main' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/'
            }}"
          user: __token__
          password: "${{ github.ref == 'refs/heads/main' &&  secrets.PYPI_KEY || secrets.TEST_PYPI_KEY }}"
