# CD on Linux, macOS and Windows
name: CD # Keep the action badge icon short

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # Run daily at Pacific time morning
  merge_group:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]

permissions:
  contents: write

# Version bumps get a concurrency group of their own, keyed by commit, exactly
# as in "test.yml" -- see the longer note beside the same block there. A bump is
# the only push to "devel" this workflow runs at all, and its artifacts are that
# version's; superseding it with the next bump leaves that version with none,
# which is what happened to 0.8.30 and 0.8.31 when five of them landed in forty
# minutes and the runs for the middle three were cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ startsWith(github.event.head_commit.message, 'Version updated') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

# The same four lists as "test.yml", with the same meanings, because this
# workflow builds what that one tests. Keep them in sync; that file carries the
# reasoning for which images are here and which are not.
env:
  # One macOS entry, the moving label: "macos-latest" and "macos-26" became the
  # same image when GitHub moved the alias in July 2026. See the note under OSES
  # in "test.yml".
  OSES:
    '["ubuntu-latest", "ubuntu-22.04", "ubuntu-24.04-arm", "ubuntu-22.04-arm", "windows-latest", "windows-2022",
    "macos-latest"]'
  # Dropped unless the run is deep: the Ubuntu 22.04 images. No macOS, because
  # there is only one macOS leg left and dropping it from the *deep* set would
  # test none. See ".github/actions/test-depth" and OSES_DEEP_ONLY in "test.yml".
  OSES_DEEP_ONLY: '["ubuntu-22.04", "ubuntu-22.04-arm"]'
  # Dropped on a pull request and kept from the merge queue up, as in "test.yml"
  # -- that file carries the reasoning for why this is macOS alone, and in
  # particular why no Windows image is in it.
  OSES_QUEUE_ONLY: '["macos-latest"]'
  PYTHONS: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
  # Same cost trade-off as test.yml: the full Python range runs on
  # ubuntu-latest only, every other image builds on the oldest and the newest
  # supported Python, plus Windows on 3.12. 40 -> 21 combinations, and 15 on a
  # run that is not deep.
  #
  # Windows + 3.12 is deliberately back in the matrix. It was excluded for an
  # 'ensurepip' failure (#374); the toolchain underneath has since moved a long
  # way, so this run is what tells us whether that is still real. Re-exclude it
  # if it is.
  EXCLUDES: >-
    [{"os": "ubuntu-22.04", "python-version": "3.11"},
    {"os": "ubuntu-22.04", "python-version": "3.12"},
    {"os": "ubuntu-22.04", "python-version": "3.13"},
    {"os": "ubuntu-24.04-arm", "python-version": "3.11"},
    {"os": "ubuntu-24.04-arm", "python-version": "3.12"},
    {"os": "ubuntu-24.04-arm", "python-version": "3.13"},
    {"os": "ubuntu-22.04-arm", "python-version": "3.11"},
    {"os": "ubuntu-22.04-arm", "python-version": "3.12"},
    {"os": "ubuntu-22.04-arm", "python-version": "3.13"},
    {"os": "windows-latest", "python-version": "3.11"},
    {"os": "windows-latest", "python-version": "3.13"},
    {"os": "windows-2022", "python-version": "3.11"},
    {"os": "windows-2022", "python-version": "3.13"},
    {"os": "macos-latest", "python-version": "3.11"},
    {"os": "macos-latest", "python-version": "3.12"},
    {"os": "macos-latest", "python-version": "3.13"}]

jobs:
  # Composed here rather than written out below, so that a pull request can run
  # a reduced matrix. Mirrors the job of the same name in "test.yml".
  set-matrix:
    name: "Set matrix"
    runs-on: ubuntu-latest
    # As in "test.yml": a push to "devel" runs this only for a version bump, and
    # the event name leads because a "schedule" carries no "head_commit" -- see
    # the long note there.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/devel' || startsWith(github.event.head_commit.message, 'Version updated') }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      # Which of the four artifacts below this change can say anything about.
      # See ".github/actions/changed-scopes".
      wheel: ${{ steps.scope.outputs.wheel }}
      docs: ${{ steps.scope.outputs.docs }}
      vsix: ${{ steps.scope.outputs.vsix }}
      plugin: ${{ steps.scope.outputs.plugin }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide the depth
        id: depth
        uses: ./.github/actions/test-depth

      - name: Decide what the change touches
        id: scope
        uses: ./.github/actions/changed-scopes
        with:
          deep: ${{ steps.depth.outputs.deep }}

      - name: Set matrix
        id: set-matrix
        env:
          DEEP: ${{ steps.depth.outputs.deep }}
          QUEUE: ${{ steps.depth.outputs.queue }}
        run: |
          # Both tiers, exactly as in "test.yml": DEEP adds the older OS
          # versions, QUEUE adds the images and the interpreters a pull request
          # does not pay for.
          OSES='${{ env.OSES }}'
          PYTHONS='${{ env.PYTHONS }}'
          if [ "${DEEP}" != "true" ]; then
            OSES=$(jq -cn --argjson all "${OSES}" --argjson deep_only '${{ env.OSES_DEEP_ONLY }}' '$all - $deep_only')
          fi
          if [ "${QUEUE}" != "true" ]; then
            OSES=$(jq -cn --argjson all "${OSES}" --argjson queue_only '${{ env.OSES_QUEUE_ONLY }}' '$all - $queue_only')
            PYTHONS=$(jq -cn --argjson all "${PYTHONS}" '[$all[0], $all[-1]]')
          fi
          echo "Operating systems: ${OSES}"
          echo "Python versions: ${PYTHONS}"
          # Leftover excludes for dropped images match nothing; see the note in
          # the same step in "test.yml".
          echo 'matrix={"os": '"${OSES}"', "python-version": '"${PYTHONS}"', "exclude": ${{ env.EXCLUDES }}}' >> "${GITHUB_OUTPUT}"

  build:
    needs: set-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The "only a version bump on devel" guard is inherited from "set-matrix"
    # through "needs" -- a job that needs a skipped job is skipped -- so what is
    # left to state here is what this change can say about the wheel. See
    # ".github/actions/changed-scopes".
    if: ${{ needs.set-matrix.outputs.wheel == 'true' }}
    env:
      # 'startsWith', not '== windows-latest': the matrix now also contains a
      # pinned windows-2022, which needs the very same venv layout.
      BIN_DIR: ${{ startsWith(matrix.os, 'windows') && 'Scripts' || 'bin' }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-all
        with:
          job: build
      - uses: ./.github/actions/setup-build

      # Two distributions: the `partcad` wheel and the `partcad-cli` shim that
      # depends on it. This used to be five, built in dependency order because
      # each pinned the ones below it at `==`; there is nothing to order now.
      - name: Test building and packaging
        shell: bash -el {0}
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mamba activate env-build
          python -m build
          # The shim states `license = {file = "LICENSE.txt"}`, so it needs the
          # repository's copy the way each distribution used to.
          cp LICENSE.txt dev-tools/shim
          (cd dev-tools/shim && python -m build)
          mamba deactivate

      - name: Test installation
        shell: bash -el {0}
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mamba activate ${{ format('env-test-build-{0}', matrix.python-version) }}
          python -m pip install --find-links=dist partcad
          # Every package the one wheel ships, and every entry point it declares.
          # A wheel that builds but is missing one of them is the failure this
          # catches -- `packages.find` sees whatever is under `src/`.
          python -c "
          import partcad, partcad_cli, partcad_client, partcad_utils, partcad_service_json_rpc, partcad_ide_client
          "
          pc --no-ansi version
          partcad-json-rpc --help >/dev/null
          # The shim brings the wheel in, and owns nothing of its own.
          python -m pip install --no-index --find-links=dist --find-links=dev-tools/shim/dist partcad-cli
          mamba deactivate

  # The documentation, built once -- one Linux runner, one interpreter, one
  # "sphinx-build -W".
  #
  # It used to be a step of the matrix above, which meant that a change to a
  # single ".rst" file built the wheel on every image and every Python version
  # to get at it, and that a change to the wheel rebuilt the documentation
  # fifteen times over. Neither is worth anything: Sphinx is pure Python and
  # "docs/source/conf.py" enables no extensions at all -- there is no autodoc,
  # so the build never imports PartCAD and cannot be affected by the platform it
  # runs on or by the source tree it sits next to.
  #
  # Its own job also means the documentation can be gated on the documentation.
  # A prose-only pull request now runs this and nothing else in this workflow.
  docs:
    name: "Documentation"
    needs: set-matrix
    if: ${{ needs.set-matrix.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The interpreter Read the Docs builds with; see ".readthedocs.yaml".
          python-version: "3.13"
      - name: Build documentation
        run: |
          python -m pip install -r docs/requirements.txt
          # "-W": a warning is an error. That is the whole point of this job --
          # a broken cross reference is how the published documentation ends up
          # with a link that goes nowhere.
          sphinx-build -M html docs/source docs/build -n -W

  # The VS Code extension, built once -- one Linux runner, one ".vsix", the same
  # package "deploy.yml" attaches to the release. It is not part of the matrix
  # above: the matrix says which OS and Python the *wheels* have to build on, and
  # the extension is packaged with `vsce` on whatever host does it.
  #
  # The workflow it calls used to run on its own "push"/"pull_request" triggers.
  # Those are gone, so this is the only thing that builds it on a pull request or
  # a push -- which also means a push to "devel" that is not a version bump
  # skips it, exactly as it skips everything else here.
  build-vscode-extension:
    name: "VS Code extension"
    # The "only a version bump on devel" guard comes through "needs", as it does
    # for "build" above; this is the extension's own gate.
    needs: set-matrix
    if: ${{ needs.set-matrix.outputs.vsix == 'true' }}
    uses: ./.github/workflows/vsix.yml

  # The Claude Code plugin, on the same footing as the extension above: built
  # once, on one runner, and attached to the release by "deploy.yml".
  #
  # It used to have a workflow of its own, "ai-agents.yml", on path-filtered
  # "push"/"pull_request" triggers. Those are gone for the reason the extension's
  # are: the version bump now rewrites "plugin.json", so every bump commit
  # matched that path filter and would have built the plugin here and there both.
  build-claude-plugin:
    name: "Claude Code plugin"
    # The "only a version bump on devel" guard comes through "needs", as above.
    # This is the one job a change under "ai-agents/" runs, and it is the only
    # thing such a change can break.
    needs: set-matrix
    if: ${{ needs.set-matrix.outputs.plugin == 'true' }}
    uses: ./.github/workflows/plugin.yml
