# CD on Linux, MacOS and Windows
name: CD # Keep the action badge icon short

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # Run daily at Pacific time morning
  merge_group:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with OSES in test.yml, which documents why
        # each image is here and why macos-13/macos-14/ubuntu-26.04 are not.
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, windows-2022, macos-latest, macos-26]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        exclude:
          # Same cost trade-off as test.yml: the full Python range runs on
          # ubuntu-latest only, every other image builds on the oldest and the
          # newest supported Python, plus Windows on 3.12.
          # 30 -> 17 combinations.
          #
          # Windows + 3.12 is deliberately back in the matrix. It was excluded
          # for an 'ensurepip' failure (#374); the toolchain underneath has
          # since moved a long way, so this run is what tells us whether that
          # is still real. Re-exclude it if it is.
          - { os: "ubuntu-22.04", python-version: "3.11" }
          - { os: "ubuntu-22.04", python-version: "3.12" }
          - { os: "ubuntu-22.04", python-version: "3.13" }
          - { os: "windows-latest", python-version: "3.11" }
          - { os: "windows-latest", python-version: "3.13" }
          - { os: "windows-2022", python-version: "3.11" }
          - { os: "windows-2022", python-version: "3.13" }
          - { os: "macos-latest", python-version: "3.11" }
          - { os: "macos-latest", python-version: "3.12" }
          - { os: "macos-latest", python-version: "3.13" }
          - { os: "macos-26", python-version: "3.11" }
          - { os: "macos-26", python-version: "3.12" }
          - { os: "macos-26", python-version: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: ${{ github.ref != 'refs/heads/devel' || startsWith(github.event.head_commit.message, 'Version updated') }}
    env:
      # 'startsWith', not '== windows-latest': the matrix now also contains a
      # pinned windows-2022, which needs the very same venv layout.
      BIN_DIR: ${{ startsWith(matrix.os, 'windows') && 'Scripts' || 'bin' }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-all
        with:
          job: build
      - uses: ./.github/actions/setup-build

      - name: Test building and packaging
        shell: bash -el {0}
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mamba activate env-build
          # Build the shared partcad-utils wheel first; partcad (and the CLI and
          # the service) pin it, and it is not on PyPI.
          cp LICENSE.txt partcad-utils
          (cd partcad-utils && python -m build)
          cp LICENSE.txt apache20.svg partcad
          (cd partcad && python -m build)
          mamba deactivate

          mamba activate env-build-cli
          cp LICENSE.txt apache20.svg README.md partcad-cli
          cp LICENSE.txt partcad-service-json-rpc
          # Install partcad-utils (pinned by partcad) before installing partcad.
          python -m pip install --find-links=partcad-utils/dist partcad-utils
          python -m pip install -r partcad/requirements.txt
          python -m pip install --no-index --find-links=partcad/dist partcad
          # Build the JSON-RPC service wheel too; partcad-cli pins it.
          (cd partcad-service-json-rpc && python -m build)
          (cd partcad-cli && python -m build)
          mamba deactivate

      - name: Test installation
        shell: bash -el {0}
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mamba activate ${{ format('env-test-build-{0}', matrix.python-version) }}
          # Install partcad-utils first (pinned by partcad/cli/service, not on PyPI).
          python -m pip install --find-links=partcad-utils/dist partcad-utils
          python -m pip install -r partcad/requirements.txt
          python -m pip install --no-index --find-links=partcad/dist partcad
          # Install the service before partcad-cli, which pins it.
          python -m pip install -r partcad-service-json-rpc/requirements.txt
          python -m pip install --no-index --find-links=partcad-service-json-rpc/dist partcad-service-json-rpc
          python -m pip install -r partcad-cli/requirements.txt
          python -m pip install --no-index --find-links=partcad-cli/dist partcad-cli
          mamba deactivate

      - name: Build documentation
        shell: bash -el {0}
        run: |
          . ~/.bashrc
          . ~/.bash_profile
          mamba activate ${{ format('env-test-build-{0}', matrix.python-version) }}
          # python -m pip install -r .devcontainer/requirements.txt
          python -m pip install -r docs/requirements.txt
          sphinx-build  -M html docs/source docs/build -n -W
          mamba deactivate
