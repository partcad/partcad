<!--
  PartCAD, 2026. Licensed under Apache License, Version 2.0.

  The PartCAD mark: the `logo` assembly of `examples/produce_assembly_assy`
  (two `bone` plates, two interlocking `head_half` brackets and an M8 `bolt`),
  seen from the camera `pc render -t svg` uses, which is (100, -100, 100)
  looking at the assembly's centre.

  It is drawn as flat faces rather than as the wireframe `pc render` writes,
  because this file is an icon before it is a drawing: it is the IDE's
  application icon (`ide/standalone/tools/make_icons.py` renders it into the
  `.png`, `.ico` and `.icns` that an application bundle needs), the marketplace
  and activity bar icon of the VS Code extension, the icon on its
  `partcad.yaml` and `.assy` files, and the icon on its `PartCAD` terminal
  view. At 16 pixels a wireframe is a smudge.

  The polygons below are that assembly projected once and flattened; nothing
  regenerates them, so treat this as artwork rather than as build output. The
  palette is `resources/logo_128x128.png` tone for tone: `t` the faces pointing
  up, then `b`, `s` and `d` for the ones facing the light, across it, and away
  from it. Every colour in the file is in the one style block below.

  Whenever this changes, rebuild `ide/standalone/resources/partcad-ide.ico`
  from it too. `ide/standalone/README.md` has that command, and the Windows
  build has nothing else to fall back on.

  Note for anyone editing the text above: XML forbids a double hyphen inside a
  comment, so this one has none.
-->
