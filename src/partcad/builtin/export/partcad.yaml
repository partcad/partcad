# The export implementations PartCAD ships with: the 3D and CAD file formats
# that `pc export` (and `Shape.convert()`) can write.
#
# Every subsection of `export:` below declares one output file type. The fields
# it carries are exactly the fields a package may declare for that type in its
# own `partcad.yaml`, with the same meaning:
#
#   - `path`                -- the wrapper script that writes the file. It runs
#                              in a PartCAD sandbox and is handed the shape plus
#                              every other field of this section (see below).
#   - `extension`           -- the file extension used when the output file name
#                              has to be derived from the object's name.
#   - `pythonRequirements`  -- what the sandbox needs installed to run `path`.
#                              Order matters: `cadquery-ocp` comes last in every
#                              list that also has `build123d`, because build123d
#                              depends on `cadquery-ocp-novtk`, which overwrites
#                              the very same OCP native module with a VTK-less
#                              build (see `sandbox_versions.py`).
#   - anything else         -- an export parameter, passed to the wrapper script
#                              as part of its `request`. The values here are the
#                              defaults; a package, a shape, or a command-line
#                              option overrides them.
#
# A package overrides any of this by declaring the same format in its own
# `export:` section. Declaring `path` there replaces the implementation below
# with the package's own script.

name: //builtin/export
desc: |
  The export implementations PartCAD ships with: the 3D and CAD file formats
  that `pc export` writes. A package replaces any of them, or adds one of its
  own, by declaring that file type in its own `export:` section.

export:
  step:
    desc: ISO 10303-21 (STEP), the CAD interchange format.
    path: export_step.py
    extension: step
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
    write_pcurves: true
    precision_mode: 0
    # 'comment' has no default: without one the STEP header is left exactly as
    # OpenCASCADE wrote it. Set it to have the text placed in the file's
    # FILE_DESCRIPTION header entity.
    # comment: <text>

  brep:
    desc: The native OpenCASCADE boundary representation.
    path: export_brep.py
    extension: brep
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1

  stl:
    desc: Triangle mesh, the 3D printing lingua franca.
    path: export_stl.py
    extension: stl
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
    tolerance: 0.1
    angularTolerance: 0.1
    ascii: false

  3mf:
    desc: 3D Manufacturing Format.
    path: export_3mf.py
    extension: 3mf
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
      - cadquery==2.8.0
    tolerance: 0.1
    angularTolerance: 0.1

  obj:
    desc: Wavefront OBJ mesh.
    path: export_obj.py
    extension: obj
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
    tolerance: 0.1
    angularTolerance: 0.1

  gltf:
    desc: glTF 2.0 (written as '.json' unless 'binary' is set).
    path: export_gltf.py
    extension: json
    pythonRequirements:
      - build123d==0.11.1
      - cadquery-ocp==7.9.3.1.1
    tolerance: 0.1
    angularTolerance: 0.1
    binary: false

  iges:
    desc: Initial Graphics Exchange Specification.
    path: export_iges.py
    extension: iges
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
    write_pcurves: true
    precision_mode: 0

  threejs:
    desc: The three.js JSON geometry format.
    path: export_threejs.py
    extension: json
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
    tolerance: 0.1
    angularTolerance: 0.1

  world:
    desc: |
      SDFormat, the XML Gazebo describes a simulation world in: a `.world` file
      plus the mesh files it references. It is the format a **scene** is
      exported to (`pc export -S -t world`), and, like `urdf` below, it is
      handed the assembly *tree* itself rather than the geometry it decodes to
      (`decode: false`) - one model per object placed in the scene, named,
      placed and looked up by what the tree says.

      Not to be confused with the `sdf` *part* type, which is a signed distance
      function and has nothing to do with this. See
      `builtin/export/export_world.py`.
    path: export_world.py
    extension: world
    # 'decode: false' -- see wrappers/wrapper_export.py, and the same note on
    # 'urdf' below.
    decode: false
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
    # The meshes are written by this exporter itself, so it takes the mesh
    # options too.
    tolerance: 0.1
    angularTolerance: 0.1
    ascii: false
    # Write an '<inertial>' for every link, computing one from the solid and
    # 'density' (kg/m^3) for a part that does not state its own.
    inertial: true
    # A scene states where things are, so nothing in it is meant to move: every
    # model is written '<static>true</static>' unless this is turned off.
    static: true
    # What makes the file usable rather than what the scene says: a world with
    # no light renders black, and one with no ground has nothing to stand on.
    sun: true
    ground_plane: true
    # 'world_name' defaults to the object's label, 'mesh_dir' to
    # '<file stem>_meshes' next to the world file, 'mesh_prefix' to empty (which
    # makes the mesh references relative to the world file; a Gazebo model
    # database sets it to 'model://<name>/'), 'version' to the SDFormat version
    # 'gazebo_common.SDF_VERSION' names, and 'density' to the exporter's own
    # default.
    # world_name: <name>
    # mesh_dir: <directory>
    # mesh_prefix: <prefix>
    # version: "1.9"
    # density: 2700.0
    # Hand the exporter what the parts report about themselves - mass, inertia,
    # friction, colour - so that it writes those rather than recomputing them or
    # losing them. See 'wrappers/wrapper_export.properties_index()'.
    properties: true

  urdf:
    desc: |
      Unified Robot Description Format: a URDF file plus the mesh files it
      references. Unlike every other format here it is handed the assembly
      *tree* itself rather than the geometry it decodes to (`decode: false`),
      because one URDF link per assembly node - named, placed and looked up by
      what the tree says - is what makes the export reversible.
    path: export_urdf.py
    extension: urdf
    # 'decode: false' -- see wrappers/wrapper_export.py. The exporter walks the
    # assembly envelopes itself; decoding them into live geometry would keep the
    # tree's shape but drop every node's name and label and bake its placement
    # in, leaving nothing to name, group or joint the links by.
    decode: false
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
      - urdf-parser-py==0.0.4
    # The meshes are written by this exporter itself, so it takes the mesh
    # options too.
    tolerance: 0.1
    angularTolerance: 0.1
    ascii: false
    # Write an '<inertial>' for every link, computing one from the solid and
    # 'density' (kg/m^3) for a part that does not state its own.
    inertial: true
    # 'robot_name' defaults to the object's label, 'mesh_dir' to
    # '<file stem>_meshes' next to the URDF, 'mesh_prefix' to empty (which makes
    # the mesh references relative to the URDF file; a ROS package sets it to
    # 'package://<pkg>/'), and 'density' to the exporter's own default.
    # robot_name: <name>
    # mesh_dir: <directory>
    # mesh_prefix: <prefix>
    # density: 2700.0
    # Hand the exporter what the parts report about themselves - mass, inertia,
    # friction, colour - so that it writes those rather than recomputing them or
    # losing them. The properties travel on the shape envelopes; this asks for
    # the index that looks one up by name, which costs a walk of the tree that
    # is already in hand. See 'wrappers/wrapper_export.properties_index()'.
    properties: true

  mjcf:
    desc: |
      MJCF, the XML MuJoCo describes a model in: an `.xml` file plus the mesh
      files it references. It is the format a scene or an assembly is handed to
      a MuJoCo simulation in (`pc sim`, through a plugin package such as
      `partcad/partcad-sim-mujoco`), and it is
      what `pc open --with mujoco` converts a scene to before opening it.

      Like `world` and `urdf` it is handed the assembly *tree* itself rather
      than the geometry it decodes to (`decode: false`) - one body per object
      placed in the scene, named, placed and looked up by what the tree says.
      See `builtin/export/export_mjcf.py`.
    path: export_mjcf.py
    extension: xml
    # 'decode: false' -- see wrappers/wrapper_export.py, and the same note on
    # 'world' above.
    decode: false
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
    # The meshes are written by this exporter itself, so it takes the mesh
    # options too. 'ascii' stays false: MuJoCo reads binary STL only.
    tolerance: 0.1
    angularTolerance: 0.1
    ascii: false
    # A scene states where things are, so nothing in it is meant to move: every
    # body is welded to the world unless this is turned off, which is what
    # gives each of them a '<freejoint>'. `pc sim` turns it off, because a
    # simulation of a model that cannot move has nothing to report.
    static: true
    # Write every node that holds geometry as a body of the '<worldbody>'
    # itself, at the world pose the tree puts it at, rather than nesting the
    # bodies as the tree nests. A nested body with no joint above it is one
    # rigid body with its parent, which is right for a rigid product and wrong
    # for a stack of blocks that is meant to be able to fall over. `pc sim`
    # turns it on for the same reason it turns 'static' off.
    flatten: false
    # What makes the file usable rather than what the scene says: a model with
    # no light renders black, and one with no ground has nothing to stand on.
    # The plane is a geom of the '<worldbody>' itself, so it is static whatever
    # 'static' says.
    light: true
    ground_plane: true
    # 'model_name' defaults to the object's label, 'mesh_dir' to
    # '<file stem>_meshes' next to the model file, 'density' (kg/m^3) to the
    # exporter's own default, and 'timestep' to MuJoCo's.
    # model_name: <name>
    # mesh_dir: <directory>
    # density: 2700.0
    # timestep: 0.002
    gravity: [0.0, 0.0, -9.81]
    # Hand the exporter what the parts report about themselves - mass, friction,
    # colour - so that it writes those rather than losing them. See
    # 'wrappers/wrapper_export.properties_index()'.
    properties: true
