# The readers PartCAD ships with: the third-party file formats a package can
# declare an assembly or a scene as, without writing anything itself.
#
# Every subsection of `import:` below declares one object type. It is the same
# shape as an `export:` entry and is resolved by the same machinery, which is
# the point -- reading a format and writing it are one piece of knowledge, and
# a package that teaches PartCAD one can teach it the other in the same file:
#
#   - `path`                -- the reader script. It runs in a PartCAD sandbox
#                              and is handed the source file plus every other
#                              field of this section (see below).
#   - `extension`           -- the source file's extension.
#   - `pythonRequirements`  -- what the sandbox needs installed to run `path`.
#   - `kinds`               -- which object kinds this type may be declared as.
#   - `noun`                -- what one of these is called in a log line.
#   - `dropped`             -- how each counter of the reader's `dropped`
#                              summary is worded when it is reported. The
#                              reader counts; this names.
#   - `binary`              -- the format's files are bytes, handed to the
#                              reader as they are rather than rendered as a
#                              template.
#   - `requireSolid`        -- every part the reader registers is a solid, so
#                              one that is not fails rather than being built
#                              with a warning (see `partTypes` below).
#   - anything else         -- a parameter, passed to the reader as part of its
#                              `request`.
#
# A package overrides any of this by declaring the same type in its own
# `import:` section, and replaces the reader outright by naming `path` there.
#
# What is *not* here is as deliberate as what is. The two scene formats that
# belong to a simulation engine are declared by that engine's plugin package --
# `mjcf` by `partcad/partcad-sim-mujoco` and `world` by
# `partcad/partcad-sim-gazebo` -- because they travel with the exporter and the
# simulator that share their knowledge of the format. `urdf` stays here: it
# describes a robot rather than any one engine's world, and ROS, MuJoCo,
# PyBullet and Isaac all read it.

name: //builtin/import
desc: |
  The readers PartCAD ships with: the third-party formats an assembly or a
  scene can be declared as, and the part types read by a script of their own
  rather than by a factory of PartCAD's. A package adds one of its own, or
  replaces one of these, by declaring that type in its own `import:` or
  `partTypes:` section.

# Part types read by a script that runs in the sandbox rather than by a factory
# of PartCAD's: through a converter PartCAD downloads on first use, through
# OpenCASCADE itself, or through a library the type installs into the sandbox
# (`usd`, Pixar's usd-core). A part names one by its bare name (`type: fcstd`) as if
# it were built in; it is a `partType` like any a package declares, so a
# plugin package that reads another format looks exactly like this.
#
#   - `extension`  -- the source file's extension. Each part is one such file:
#                     `path` relative to the part's package, `<name>.<extension>`
#                     by default, `fileFrom` to fetch it.
#   - `path`       -- the script, run in the sandbox with `request["path"]` set
#                     to that file and `request["cache_dir"]` to where whatever
#                     it downloads is kept.
#   - `requireSolid` -- every one of these reads bodies, so a part that comes
#                     back with no solid, an open or invalid one, or faces
#                     bounding nothing is one it read wrongly, and fails rather
#                     than being built with a warning (see
#                     'Shape._accepted_as_solid'). That is the whole of how a
#                     broken read is caught: the definition every part is held
#                     to, not a check of each converter's own.
#
# `iges` is read by OpenCASCADE's IGES reader, 'part_iges.py': the counterpart
# of the writer `pc export -t iges` uses, so what PartCAD writes it reads back.
# cadmpeg reads IGES too, but 0.6.7 loses most of the faces of the IGES files
# OpenCASCADE writes, and all of a solid written as one.
#
# Every other type below but `fcstd` and `usd` is read the same way -- cadmpeg
# converts the file to STEP and the part is what that file shows -- so they
# share one script, 'part_cadmpeg.py', and differ only in the file they are
# stored in.
# Which format a file is, cadmpeg decides from its content; the extension is
# what a part's file is called when its declaration names none, written the way
# the format's own application writes it.
#
# Of those, only the formats cadmpeg reads into connected solids are here: its
# level L3 ("Model") and above, as `cadmpeg inspect <file>` reports and
# https://github.com/cadmpeg/cadmpeg/blob/main/docs/format-support.md defines.
# Rhino `.3dm` (L2) and Siemens NX and Creo Parametric `.prt` (L1) are not:
# cadmpeg does not yet read their bodies into solids, so every part of theirs
# would be one this declaration fails.
partTypes:
  fcstd:
    desc: |
      A FreeCAD document (`.FCStd`): the solids FreeCAD stored in it, read with
      cadmpeg, so FreeCAD itself is not needed. The parametric history does not
      survive -- what the part is is the geometry FreeCAD last computed.
    path: part_fcstd.py
    extension: FCStd
    requireSolid: true
  iges:
    desc: |
      An IGES file (`.iges`, `.igs`): its solids, read with OpenCASCADE, with
      the colours it puts on them. A solid the file states only as the faces
      that bound it -- which is how OpenCASCADE writes IGES by default -- is
      sewn back into that solid; faces that bound no solid are not a part of
      this type.
    path: part_iges.py
    extension: iges
    requireSolid: true
  f3d:
    desc: |
      An Autodesk Fusion design (`.f3d`): the bodies it shows, read with
      cadmpeg, so Fusion is not needed. The timeline does not survive -- what the
      part is is the geometry Fusion last computed.
    path: part_cadmpeg.py
    extension: f3d
    requireSolid: true
  sldprt:
    desc: |
      A SolidWorks part (`.SLDPRT`): the bodies it shows, read with cadmpeg, so
      SolidWorks is not needed. The feature tree does not survive -- what the
      part is is the geometry SolidWorks last computed.
    path: part_cadmpeg.py
    extension: SLDPRT
    requireSolid: true
  ipt:
    desc: |
      An Autodesk Inventor part (`.ipt`): the body it holds, read with cadmpeg,
      so Inventor is not needed. The model's history does not survive.
    path: part_cadmpeg.py
    extension: ipt
    requireSolid: true
  catpart:
    desc: |
      A CATIA V5 part (`.CATPart`): the body it holds, read with cadmpeg, so
      CATIA is not needed. The specification tree does not survive.
    path: part_cadmpeg.py
    extension: CATPart
    requireSolid: true
  sat:
    desc: |
      An ACIS or ShapeManager body (`.sat`, or binary `.sab`, `.smt`, `.smb`):
      its solids, read with cadmpeg. Which of the four a file is, is read from
      its content, so a part of any of them names its file with `path`.
    path: part_cadmpeg.py
    extension: sat
    requireSolid: true
  pvz:
    desc: |
      A Creo View package (`.pvz`): the bodies of every component it places,
      read with cadmpeg, as one part. Declare it as an assembly to keep the
      components apart.
    path: part_cadmpeg.py
    extension: pvz
    requireSolid: true
  # OpenUSD is not a CAD format and is read for what it shows, which is meshes:
  # with Pixar's usd-core (installed into the sandbox for this type alone), or
  # with cadmpeg 0.6.8, the first release that reads it, when a part says
  # `reader: cadmpeg` (see 'part_usd.py' for what each route reads). Not
  # `requireSolid`: what a renderer draws need not close, and a stage that is
  # no solid is a legitimate part, built and reported. Pillow reads the
  # textures a face's colour, roughness and metalness are read off (see
  # 'usd_look.py'), at the version the render types pin it at. usd-core 26.11
  # is Python 3.11 and newer; a package that asks for 3.10 gets 25.11, the
  # last release that has it.
  usd:
    desc: |
      An OpenUSD stage (`.usd`, `.usda`, `.usdc`, or a `.usdz` package): the
      meshes its default prim shows, or the prim a part's `prim` names, in
      millimetres with Z up, each face in the colour, roughness and metalness
      its material - or its display colour - gives, textures included. Read
      with Pixar's usd-core by default, or with cadmpeg (`reader: cadmpeg`).
      A surface: a solid only where a mesh closes.
    path: part_usd.py
    extension: usd
    # A stage of loose layers is read from more files than the one a part
    # names: the script reports them as it builds the part, and the part is
    # rebuilt when one of them changes.
    reportsDependencies: true
    pythonRequirements:
      - usd-core==26.11; python_version >= "3.11"
      - usd-core==25.11; python_version < "3.11"
      - pillow==12.2.0

import:
  # A native CAD document read as an assembly, through cadmpeg: every format
  # below is converted to STEP, and its tree read the way a STEP assembly's is
  # (see 'import_cadmpeg.py'). Only the formats cadmpeg reads into connected
  # solids *and* reads the components of: Inventor's `.iam` and SolidWorks'
  # `.sldasm` are not here, because cadmpeg either leaves the files their
  # components are in unopened or does not read their component tree yet.
  # Every part it registers is a solid or fails, for the reason the part types
  # above say.
  f3d:
    desc: |
      An Autodesk Fusion design (`.f3d`) as an assembly: the bodies it shows,
      each a part, placed where its component puts it. Joints are not read --
      the assembly is the design at rest. cadmpeg does not yet place a component
      nested inside another component reliably, so a deep component tree can
      come out misplaced; declare such a design as an `f3d` part to keep its
      geometry as one shape.
    path: import_cadmpeg.py
    extension: f3d
    kinds: [assembly]
    binary: true
    noun: design
    requireSolid: true
    pythonRequirements:
      - cadquery-ocp-novtk==7.9.3.1.1
  pvz:
    desc: |
      A Creo View package (`.pvz`) as an assembly: the bodies of each component
      it places, each a part, placed as the package's occurrence tree places it.
    path: import_cadmpeg.py
    extension: pvz
    kinds: [assembly]
    binary: true
    noun: package
    requireSolid: true
    pythonRequirements:
      - cadquery-ocp-novtk==7.9.3.1.1
  # glTF as an assembly: the file's node tree, a part per mesh. Each mesh is
  # written out as a '.glb' of its own and read by the 'gltf' part type, so it
  # is read exactly as a glTF part is (see 'import_gltf.py'). A glTF scene is
  # usually a model rather than a world, which is why it is an assembly only.
  gltf:
    desc: |
      glTF 2.0 (`.gltf` with its buffers, or `.glb`) as an assembly: a part per
      mesh, placed where the file's nodes place it, a sub-assembly per node with
      children. Each part is read as a `gltf` part is: a solid per closed piece
      of its mesh, each face in its material's colour. What compresses the
      web's glTF -- Draco, meshoptimizer, quantization, GPU instancing -- is
      decoded. Animations, skins and morph targets are not read: the assembly
      is the scene as its nodes place it.
    path: import_gltf.py
    extension: [gltf, glb]
    kinds: [assembly]
    binary: true
    noun: model
    # DracoPy decodes a Draco-compressed mesh, and brings NumPy, which the
    # reader does all its arithmetic in.
    pythonRequirements:
      - DracoPy==2.2.0
  urdf:
    desc: |
      Unified Robot Description Format: a robot as a tree of links joined by
      joints, read at its zero pose. A URDF is a product rather than an
      arrangement of products, so it is an assembly and not a scene.

      It is a best-effort reader. Its links are placed with every joint at
      zero, and every movable joint is kept as the joint of the link it moves,
      so the assembly is the robot's mechanism as it is read. What an assembly
      cannot hold -- transmissions, sensors, the geometry a link was not built
      from -- is counted and reported rather than passed over in silence.
    path: import_urdf.py
    extension: urdf
    kinds: [assembly]
    noun: robot
    # 'urdf-parser-py' is what parses the file; OCP turns URDF's box, cylinder
    # and sphere into geometry -- the build every sandbox's own environment
    # holds, for the reason '//builtin/render' gives.
    pythonRequirements:
      - urdf-parser-py==0.0.4
      - cadquery-ocp-novtk==7.9.3.1.1
    # How many digits the placements coming back are rounded to. Six is a
    # micrometre at millimetre scale, which is finer than any URDF states.
    precision: 6
    # Build a link from its visual geometry rather than its collision geometry:
    # true for every link, or a list of the link names it applies to.
    ignoreCollision: false
    # Core URDF that PartCAD has no property for always stops the import;
    # 'strict' extends that to '<gazebo>', whose vocabulary is open and where an
    # unknown setting is otherwise only reported.
    strict: false
    dropped:
      collision: "collision geometry (kept as parts of its own, but not placed)"
      visual: "visual geometry (kept as parts of its own, but not placed)"
      transmission: transmissions
      gazebo: "Gazebo settings with no PartCAD property"
      sensor: sensors
      calibration: "joint calibration references"
