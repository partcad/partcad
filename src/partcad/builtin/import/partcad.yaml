# The readers PartCAD ships with: the third-party file formats a package can
# declare an assembly or a scene as, without writing anything itself.
#
# Every subsection of `import:` below declares one object type. It is the same
# shape as an `export:` entry and is resolved by the same machinery, which is
# the point -- reading a format and writing it are one piece of knowledge, and
# a package that teaches PartCAD one can teach it the other in the same file:
#
#   - `path`                -- the reader script. It runs in a PartCAD sandbox
#                              and is handed the source file plus every other
#                              field of this section (see below).
#   - `extension`           -- the source file's extension.
#   - `pythonRequirements`  -- what the sandbox needs installed to run `path`.
#   - `kinds`               -- which object kinds this type may be declared as.
#   - `noun`                -- what one of these is called in a log line.
#   - `dropped`             -- how each counter of the reader's `dropped`
#                              summary is worded when it is reported. The
#                              reader counts; this names.
#   - anything else         -- a parameter, passed to the reader as part of its
#                              `request`.
#
# A package overrides any of this by declaring the same type in its own
# `import:` section, and replaces the reader outright by naming `path` there.
#
# What is *not* here is as deliberate as what is. The two scene formats that
# belong to a simulation engine are declared by that engine's plugin package --
# `mjcf` by `partcad/partcad-sim-mujoco` and `world` by
# `partcad/partcad-sim-gazebo` -- because they travel with the exporter and the
# simulator that share their knowledge of the format. `urdf` stays here: it
# describes a robot rather than any one engine's world, and ROS, MuJoCo,
# PyBullet and Isaac all read it.

name: //builtin/import
desc: |
  The readers PartCAD ships with: the third-party formats an assembly or a
  scene can be declared as. A package adds one of its own, or replaces one of
  these, by declaring that type in its own `import:` section.

import:
  urdf:
    desc: |
      Unified Robot Description Format: a robot as a tree of links joined by
      joints, read at its zero pose. A URDF is a product rather than an
      arrangement of products, so it is an assembly and not a scene.

      It is a best-effort reader. A URDF describes a machine that moves and a
      PartCAD tree describes where things are, so what a static arrangement
      cannot hold -- the joints themselves above all -- is counted and reported
      rather than passed over in silence.
    path: import_urdf.py
    extension: urdf
    kinds: [assembly]
    noun: robot
    # 'urdf-parser-py' is what parses the file; 'cadquery-ocp' turns URDF's box,
    # cylinder and sphere into geometry. Order matters here as it does in every
    # install list: OCP comes last (see 'sandbox_versions.GUARD_INVALIDATED_BY').
    pythonRequirements:
      - urdf-parser-py==0.0.4
      - cadquery-ocp==7.9.3.1.1
    # How many digits the placements coming back are rounded to. Six is a
    # micrometre at millimetre scale, which is finer than any URDF states.
    precision: 6
    # Build a link from its visual geometry rather than its collision geometry:
    # true for every link, or a list of the link names it applies to.
    ignoreCollision: false
    # Core URDF that PartCAD has no property for always stops the import;
    # 'strict' extends that to '<gazebo>', whose vocabulary is open and where an
    # unknown setting is otherwise only reported.
    strict: false
    dropped:
      joint_kinematics: "movable joints (the assembly shows them at their zero position)"
      collision: "collision geometry (kept as parts of its own, but not placed)"
      visual: "visual geometry (kept as parts of its own, but not placed)"
      transmission: transmissions
      gazebo: "Gazebo settings with no PartCAD property"
      sensor: sensors
      calibration: "joint calibration references"
