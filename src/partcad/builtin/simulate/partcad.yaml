# The simulation plugins PartCAD ships with: the ways `pc sim` can run a scene.
#
# A simulation plugin is the third kind of implementation a package can declare,
# beside the export and render ones in `//builtin/export` and `//builtin/render`,
# and it is declared in exactly the same form -- a `path` to a script, the
# sandbox that script needs, and the parameters it is handed. What differs is
# what it does with them: an export writes a file, a render draws a picture, and
# a simulation *runs* the scene and reports what happened.
#
# The contract is narrow on purpose (see `wrappers/wrapper_simulate.py`):
#
#   in    a scene with the subject in it, as a file, in the format `format:`
#         names -- PartCAD exports it before the plugin is started
#   out   JSON carrying at least `before` and `after`
#
# What is inside `before` and `after`, and anything else beside them, is the
# plugin's own vocabulary. PartCAD does not read it: it hands the two objects to
# the `validation:` expression of the `simulate:` that asked for the run, and
# reports what the expression says.
#
# A package adds a simulator of its own by declaring it in its own `simulation:`
# section, exactly as it would add an export format, and naming it in a
# `simulate:` as `<package>:<name>`.

name: //builtin/simulate
desc: |
  The simulation plugins PartCAD ships with. A package adds one of its own, or
  replaces one of these, by declaring it in its own `simulation:` section.

simulation:
  mujoco:
    desc: |
      Run the scene in [MuJoCo](https://mujoco.org/) under gravity and report
      where everything ended up. The scene is handed over as MJCF -- MuJoCo's
      own model format, which PartCAD writes (`pc export -t mjcf`) -- with every
      body free to move and a ground plane under it, and the model is stepped
      for `duration` seconds of simulated time.

      `before` and `after` each carry `time` and a `bodies` object: one entry per
      body, holding its position `pos` (millimetres, PartCAD's unit throughout)
      and its orientation `quat` (`w x y z`). So a validation that asks whether
      anything moved reads like:

      ```
      max(
          abs(after["bodies"][name]["pos"][2] - before["bodies"][name]["pos"][2])
          for name in before["bodies"]
      ) < 1.0
      ```
    path: simulate_mujoco.py
    # The format the scene is handed over in. PartCAD exports the scene to it
    # before the plugin is started, so this is what decides which exporter runs
    # rather than anything the plugin says at runtime.
    format: mjcf
    # How that export is asked for. A scene states where things are, so the MJCF
    # exporter welds every body to the world by default and nests the bodies as
    # the tree nests - and a simulation of a model whose parts cannot move
    # relative to each other has nothing to report. So a run asks for the
    # opposite of both. It is stated here, by the plugin, because the plugin is
    # what knows it.
    formatOptions:
      static: false
      flatten: true
    # MuJoCo and nothing else: this plugin is handed a file and reads it with
    # MuJoCo's own loader, so the sandbox needs no CAD stack at all.
    #
    # A range rather than an exact pin, unlike the CAD packages in
    # 'sandbox_versions.py'. Those are pinned because two of them write the same
    # OCP native module and disagreeing versions crash the wrapper with no
    # traceback; nothing here shares a native module with anything, PartCAD does
    # not link against MuJoCo, and the four calls this plugin makes are MuJoCo's
    # oldest and most stable API. See 'sandbox_versions.MUJOCO'.
    pythonRequirements:
      - mujoco>=3.2,<4
    # How long, in seconds of simulated time. Ten is long enough for something
    # that is going to fall over to have fallen over and come to rest.
    duration: 10.0
    # MuJoCo's own timestep unless this says otherwise, in seconds.
    # timestep: 0.002
    gravity: [0.0, 0.0, -9.81]
    # Report where every body is at each of these many evenly spaced instants,
    # as 'samples'. Zero -- the default -- reports only 'before' and 'after',
    # which is what a validation reads.
    samples: 0
