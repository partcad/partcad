# The applications `pc open` knows how to launch.
#
# Every subsection of `open:` below declares one of them. It is the same shape
# as an `export:` or an `import:` entry and is read the same way, and it is data
# and nothing else: where to find the application on each operating system, what
# to run it as, which container to fall back to, and what it can read. None of
# it is logic -- finding the binary, creating the container, forwarding the X
# display and converting a file the application cannot read is
# `partcad_client.external`, once, for every tool there is.
#
# What an entry declares:
#
#   - `displayName`      what the application is called in a message.
#   - `image`            the container it runs in when the machine has no local
#                        copy. `--docker-image` overrides it.
#   - `binaries`         executables to look for, on PATH and inside the
#                        container, in order; the first one found wins.
#   - `args`             arguments that go before the file name.
#   - `binaryArgs`       the same, for one executable in particular. An
#                        application with more than one front end needs it.
#   - `macosApps`        bundles to look for under /Applications and ~/Applications.
#   - `macosExecutable`  the executable inside the bundle, for an application
#                        that is handed arguments rather than a document.
#   - `windowsGlobs`     install locations, as globs, so a versioned directory
#                        still matches.
#   - `flatpakId`        the Flatpak to run when there is one.
#   - `companions`       extensions this application really opens, when the file
#                        it was handed is not one of them and one of these sits
#                        beside it.
#   - `fileArgs`         how the file reaches the application, when being the
#                        last argument is not it. `{path}` is substituted with
#                        the file name and `{path_repr}` with it quoted as a
#                        Python string.
#   - `ownFormats`       extensions this application opens whatever they hold,
#                        because they are its own.
#   - `imports`          the mesh formats it can read, for one that reads meshes.
#   - `meshVia`          what a file that is not a mesh is converted to first.
#   - `sceneType`        the PartCAD scene type it reads, for one that reads a
#                        description of an arrangement rather than geometry.
#
# A package adds an application of its own by declaring it in its own `open:`
# section. That is how `gazebo` and `mujoco` reach `pc open`: each belongs to
# the plugin package for that engine, beside the exporter, the reader and the
# simulator that share their knowledge of it.

name: //builtin/open
desc: |
  The applications `pc open` can launch. A package adds one of its own, or
  replaces one of these, by declaring it in its own `open:` section.

open:
  freecad:
    displayName: FreeCAD
    # `:latest`, not a pinned tag: a user asking for a container wants the
    # current FreeCAD, and a pin here would quietly age into a version nobody
    # chose. The image is a community one because the FreeCAD project publishes
    # none -- the `freecad/freecad` repository on Docker Hub has never had an
    # image pushed to it -- and it is this one because it carries a GUI FreeCAD
    # on `PATH` and is still being rebuilt. `--docker-image` overrides it, which
    # is also the answer for anyone who would rather run their own.
    image: linuxserver/freecad:latest
    binaries: [freecad, FreeCAD, freecad-daily]
    macosApps: [FreeCAD.app]
    windowsGlobs: ["FreeCAD*/bin/FreeCAD.exe", "FreeCAD*/FreeCAD.exe"]
    flatpakId: org.freecad.FreeCAD

  kicad:
    displayName: KiCad
    # The image PartCAD already builds and uses for `kicad` parts (see
    # 'partcad.part_factory_kicad'), pinned to this release the same way: it is
    # `kicad/kicad` with PartCAD's own environment on top, so the GUI is in it
    # and there is one KiCad container in the product rather than two. It is
    # `linux/amd64` only, as KiCad's own images are; a machine that cannot run
    # it almost certainly has KiCad installed, which is used first anyway.
    #
    # `{version}` is substituted with the running PartCAD's version, which is
    # what pins the image to this release without repeating the number here.
    image: "ghcr.io/partcad/partcad-container-kicad:{version}"
    binaries: [kicad]
    macosApps: [KiCad/KiCad.app, KiCad.app]
    windowsGlobs: ["KiCad/*/bin/kicad.exe"]
    flatpakId: org.kicad.KiCad
    # What a `kicad` part points at is the STEP file KiCad's CLI generates from
    # the board. The board is the project beside it, and that is what opening
    # KiCad means.
    companions: [.kicad_pro, .kicad_pcb, .kicad_sch]

  blender:
    displayName: Blender
    # `:latest`, for the reason FreeCAD's is: a user asking for a container
    # wants the current Blender. The image is a community one because the
    # Blender project publishes none, and it is this one because it carries a
    # GUI Blender on `PATH` and is still being rebuilt. `--docker-image`
    # overrides it, as it does for every other tool here.
    image: linuxserver/blender:latest
    binaries: [blender]
    macosApps: [Blender.app]
    # Not through `open -a`: the arguments below are the whole point of the
    # launch, and `open -a` drops them on a Blender that is already running.
    macosExecutable: Contents/MacOS/Blender
    windowsGlobs: ["Blender Foundation/Blender*/blender.exe", "Blender*/blender.exe"]
    flatpakId: org.blender.Blender
    # A `.blend` is Blender's own file: not a mesh, and not something to convert
    # into one. It is also the only thing `blender <file>` *opens* -- everything
    # else is an import, which is an operator call and nothing else, hence the
    # expression below.
    ownFormats: [.blend]
    # What that expression knows how to import. '.json' is deliberately absent:
    # PartCAD writes both glTF and three.js to it, and only one of the two is a
    # file Blender reads -- so a '.json' is converted rather than guessed at.
    imports: [.stl, .obj, .ply, .gltf, .glb, .fbx, .x3d]
    # Blender reads triangles. Anything else -- a STEP file, a CadQuery script,
    # a part PartCAD builds -- reaches it as the STL PartCAD makes out of it.
    # STL rather than a richer mesh format because every part type converts to
    # it, which is what makes this one rule rather than a table of exceptions.
    meshVia: stl
    # Written as one expression on the command line rather than a script file
    # because it has to work identically in a container, where a script file
    # would be one more thing to make visible on both sides of the mount.
    #
    # Two names per format: Blender 4.x replaced the old Python importers with
    # C++ ones under different operator names ('wm.stl_import' for what used to
    # be 'import_mesh.stl'), and both releases are in use. Whichever exists
    # answers; the loop tries them in turn, newest first, and says so if none
    # does. Reading a home file with no contents first is what leaves the
    # imported object alone in the scene instead of inside Blender's default
    # cube.
    fileArgs:
      - "--python-expr"
      - |
        import bpy, os
        path = {path_repr}
        importers = {
            '.stl': ('wm.stl_import', 'import_mesh.stl'),
            '.obj': ('wm.obj_import', 'import_scene.obj'),
            '.ply': ('wm.ply_import', 'import_mesh.ply'),
            '.gltf': ('import_scene.gltf',),
            '.glb': ('import_scene.gltf',),
            '.json': ('import_scene.gltf',),
            '.fbx': ('import_scene.fbx',),
            '.x3d': ('import_scene.x3d',),
        }
        extension = os.path.splitext(path)[1].lower()
        bpy.ops.wm.read_homefile(use_empty=True)
        for name in importers.get(extension, ()):
            category, _, operator = name.partition('.')
            try:
                getattr(getattr(bpy.ops, category), operator)(filepath=path)
                break
            except Exception as e:
                print('PartCAD: bpy.ops.' + name + ' did not import ' + path + ': ' + str(e))
        else:
            print('PartCAD: this Blender has no importer for ' + (extension or path))

  # The two below are here only until the packages that own them are published:
  # `gazebo` belongs to `partcad/partcad-sim-gazebo` and `mujoco` to
  # `partcad/partcad-sim-mujoco`, beside the exporter, the reader and the
  # simulator for that engine's own scene format.

  gazebo:
    displayName: Gazebo
    # The simulator's own image for the current Gazebo. `:latest`, for the
    # reason FreeCAD's is: a user asking for a container wants the current
    # Gazebo, and `--docker-image` is the answer for anyone who wants another
    # one (`osrf/gazebo` for Gazebo Classic, say).
    image: gazebosim/gz-harmonic:latest
    # Three generations of one program, newest first: `gz sim` today,
    # `ign gazebo` in the Ignition years, and `gazebo` for Gazebo Classic.
    # Whichever the machine has is the one used.
    binaries: [gz, ign, gazebo]
    binaryArgs:
      gz: [sim]
      ign: [gazebo]
    macosApps: [Gazebo.app]
    windowsGlobs: ["Gazebo*/bin/gz.exe"]
    flatpakId: org.gazebosim.Gazebo

  mujoco:
    displayName: MuJoCo
    # DeepMind's own image, `:latest` for the reason every other one here is:
    # a user asking for a container wants the current MuJoCo, and
    # `--docker-image` is the answer for anyone who wants another.
    image: ghcr.io/google-deepmind/mujoco:latest
    # `simulate` is the viewer the MuJoCo release ships; `mujoco` is what a
    # distribution package sometimes calls it. Whichever the machine has is the
    # one used.
    binaries: [simulate, mujoco]
    macosApps: [MuJoCo.app]
    macosExecutable: Contents/MacOS/simulate
    windowsGlobs: ["MuJoCo*/bin/simulate.exe", "mujoco*/bin/simulate.exe"]
    # MuJoCo reads MJCF and no other model format. A scene given as anything
    # else -- a Gazebo world, above all -- is written out as MJCF first, which
    # is `pc export -t mjcf` and so is the daemon's work.
    sceneType: mjcf
