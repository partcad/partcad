# The render implementations PartCAD ships with: the 2D projections that
# `pc render` writes, and the videos of an object turning (see the video file
# types at the end).
#
# The structure is identical to `//builtin/export` -- see that package for what
# each field means. The only difference is which section a package declares
# these in: `render:` rather than `export:`.
#
# `readme` is deliberately absent. It is not produced by a wrapper script at all
# but assembled by PartCAD itself out of the images the other formats leave
# behind, so there is nothing here for a package to replace.
#
# `reproducible` is the one field here that is worth reading twice. Unlike the
# exporters, where it is so far only declared, every file type below acts on it:
# it picks the hidden-line algorithm the projection goes through, and for DXF
# the metadata that goes in the header. It is `false` on all four, which is the
# default everywhere -- a picture produced to be looked at should be the fastest
# correct one. A package that *keeps* its drawings, so that a diff answers
# whether they changed, sets it to `true` on the file type; every example in
# this repository does.

name: //builtin/render
desc: |
  The render implementations PartCAD ships with: the 2D projections that
  `pc render` writes, and videos of an object turning as it turns in the
  Digital Thread's 3D view. A package replaces any of them, or adds one of its
  own, by declaring that file type in its own `render:` section.

# What every script in this package imports. Declared for the package rather
# than repeated on each of the file types below, because it is the same
# projection underneath all four: `render_png.py`, `render_jpeg.py` and
# `render_dxf.py` all call `render_svg.process()` and then convert what it
# wrote. Each file type below adds only what its own conversion step needs.
#
# It also decides what a file type *another* package declares against these
# scripts gets: `Implementation.python_requirements` reads a file type's
# requirements from the package that implements it, and a file type that
# package never heard of has none of its own - so the imports its script needs
# have to be the package's, which is what this is. (See
# `examples/feature_interface`, which declares two drawings of its own against
# `render_svg.py`.)
#
# The OCP build is the one build123d depends on, `cadquery-ocp-novtk`, rather
# than CadQuery's `cadquery-ocp`: the two write the same native module, and this
# is the one every sandbox's own environment holds, so a projection runs there
# with nothing installed for it. Asking for `cadquery-ocp` is asking for a layer
# that carries it (see `runtime_python.base_requirements`).
pythonRequirements:
  - ocpsvg==0.6.0
  - build123d==0.11.1
  - cadquery-ocp-novtk==7.9.3.1.1

render:
  svg:
    desc: A 2D projection of the shape, as SVG.
    path: render_svg.py
    extension: svg
    line_weight: 1.0
    # 'viewport_origin' and 'viewport_up' have no defaults here: the wrapper
    # picks them from the kind of shape it was handed (a sketch is looked at
    # head-on, a part from a corner). Set either to override that.
    #
    # How big the overlays `pc render --with-ports`/`--with-interfaces` draw
    # are, as a fraction of the projection's largest dimension: the length of a
    # port's +Z arrow, and the cap height of the names written beside it. A
    # package whose port names are long, or whose ports are crowded, tunes them
    # here. They cost nothing when neither option is given -- nothing is drawn.
    port_marker_size: 0.1
    port_label_size: 0.035
    # How many decimal places every coordinate is written to. Ten is what this
    # renderer has always written; lower it for a drawing that is kept in a
    # repository, where the last six of them are bytes rather than information.
    precision: 10
    # Which hidden-line algorithm the projection goes through. 'false' - the
    # default here as everywhere - picks the polygonal one: it works from the
    # triangulation, it is the only one that does not read past the end of an
    # OCCT allocation, and it draws a large assembly in seconds rather than
    # minutes. What it costs is that the triangulation is floating point all the
    # way down, so the same shape comes out with a slightly different silhouette
    # on a different machine. 'true' picks the exact one, which works from the
    # surfaces and draws the same bytes anywhere - which is what a drawing kept
    # in a repository needs, and what every image under 'examples/' asks for.
    # See 'render_svg.project()' for the whole trade.
    reproducible: false

  png:
    desc: The SVG projection, rasterized.
    path: render_png.py
    extension: png
    pythonRequirements:
      - svglib==1.5.1
      - reportlab==4.4.3
      - rlpycairo==0.3.0
    line_weight: 1.0
    width: 512
    height: 512
    # See 'svg' above.
    port_marker_size: 0.1
    port_label_size: 0.035
    # The projection underneath this one, so a raster asked for reproducibly is
    # drawn from the projection that is. See 'svg' above. It settles the picture
    # and not the encoding: what rasterizes the SVG is svglib, reportlab and
    # Pillow, and a new release of any of the three moves the encoded bytes
    # without moving the picture.
    reproducible: false

  jpeg:
    # The format is named 'jpeg' but the file it writes is a '.jpg'.
    desc: The SVG projection, rasterized and JPEG-compressed.
    path: render_jpeg.py
    extension: jpg
    pythonRequirements:
      - svglib==1.5.1
      - reportlab==4.4.3
      - rlpycairo==0.3.0
    line_weight: 1.0
    width: 512
    height: 512
    # See 'svg' above.
    port_marker_size: 0.1
    port_label_size: 0.035
    # JPEG has no alpha channel, so the transparent SVG background has to be
    # flattened onto some color.
    background: "#ffffff"
    quality: 85
    progressive: false
    optimize: false
    # A projection is line art: 4:2:0 chroma subsampling (what Pillow picks
    # below quality 95) smears color across the one-pixel-wide edges, so keep
    # full chroma unless the package asks for something smaller.
    subsampling: "4:4:4"
    # See 'png' above.
    reproducible: false

  dxf:
    desc: The SVG projection, converted to DXF.
    path: render_dxf.py
    extension: dxf
    pythonRequirements:
      - svgpathtools==1.7.2
      - ezdxf==1.4.4
    line_weight: 1.0
    viewport_origin: [0, 0, 100]
    viewport_up: [0, 1, 0]
    # See 'svg' above.
    port_marker_size: 0.1
    port_label_size: 0.035
    # Write the same bytes for the same drawing: the exact projection rather
    # than the polygonal one (see 'svg' above), and a fixed creation time and
    # the all-zero GUID pair instead of the wall clock and the fresh GUIDs a DXF
    # is otherwise stamped with on every save.
    #
    # This was the one file type that had a flag of this name before it was one,
    # and it was on by default. It is off now, with the rest: 'reproducible' is
    # a protocol field with one meaning and one default everywhere it appears,
    # and a DXF that alone among the file types wrote fixed metadata was a
    # second answer to the question this field asks. A package that wants the
    # old behaviour says so - 'examples/feature_render' does, and so does every
    # example that keeps its drawing in the repository.
    reproducible: false

  # ---------------------------------------------------------------------------
  # Videos
  # ---------------------------------------------------------------------------
  #
  # A video of the object turning, drawn the way the Digital Thread's 3D view
  # draws it with Animate ticked - the same camera, light, material and colours
  # - by 'render_video.py', and encoded by GStreamer into the container each file
  # type names as its 'container_format' (not 'container', which is the
  # protocol's: an implementation declaring one is run in that image). None of
  # them is written by a bare 'pc render': a package asks for one by declaring
  # it, or a command by naming it ('pc render -t mp4').
  #
  # GStreamer is not something pip can install, so each of these names the
  # image PartCAD publishes with it in ('dockerImage'), and a machine rendering
  # in the 'docker' sandbox renders them there. Elsewhere it is the machine's own
  # 'gst-launch-1.0' (or wherever 'PC_GSTREAMER' says), and a machine with
  # neither is told so before anything is drawn. '{version}' and '{python}' are
  # filled in with this release and the sandbox's interpreter.
  #
  # The fields every video file type takes. The ones declared below are the
  # ones a package most often changes; every other one has the default
  # 'render_video.py' gives it, which is what it says here.
  #
  #   size          where the video is going: 'reels' (1080x1920, the default:
  #                 also 'shorts', 'tiktok', 'story', 'vertical', '9:16'),
  #                 'portrait' (1080x1350, '4:5'), 'square' (1080x1080, '1:1'),
  #                 'pinterest' (1000x1500, '2:3'), 'landscape' (1920x1080,
  #                 'youtube', '16:9', '1080p', 'fhd'), '720p', '480p', '1440p',
  #                 '4k', '4:3', '21:9', 'vertical-720p', 'vertical-4k' - or
  #                 '<width>x<height>'. 'width' and 'height' override it.
  #   fps           frames a second.
  #   duration      seconds. Unset is one turn of the fastest-turning axis -
  #                 twelve seconds at the default speed - or five seconds if
  #                 nothing turns.
  #   speed         how fast the object turns about X, Y and Z, in degrees a
  #                 second, each axis at its own: [x, y, z], or one number for Z.
  #                 The default is Animate's thirty about the vertical.
  #   start_angle   the angles about X, Y and Z the first frame is drawn at.
  #   append        add to the video already at the output path rather than
  #                 writing it again. The video keeps where its turn stopped in
  #                 one of its container's tags - in an Ogg file, as Vorbis
  #                 comments, PARTCAD_ANGLES=<x>,<y>,<z> and its siblings -
  #                 and the new part starts there; a video that says nothing
  #                 (one PartCAD did not write) is appended to from
  #                 'start_angle'. A video that is a different size is fitted
  #                 into the new one's frame, with bars.
  #   preset        the trade between how long encoding takes and how small the
  #                 file is: ultrafast, superfast, veryfast, faster, fast,
  #                 medium, slow, slower, veryslow - x264's names, which every
  #                 encoder is told the nearest equivalent of.
  #   quality       0 to 100: how much of the picture survives the encoder - for
  #                 H.264 and H.265 a CRF of 51 * (100 - quality) / 100, so the
  #                 default 65 is CRF 18. 'bitrate' (kbit/s) asks for a bitrate
  #                 instead.
  #   codec         the video codec, where the container carries more than one:
  #                 h264 (the default), h265, vp9, vp8, theora, mjpeg, mpeg4,
  #                 wmv2 - whichever of them the container takes.
  #   audio_codec, audio_bitrate   likewise for the soundtrack: aac, mp3, opus,
  #                 vorbis; 192 kbit/s.
  #   viewport_origin, viewport_up  where the object is looked at from, as for
  #                 the projections ('pc render --view' sets them). Unset is the
  #                 3D view's: from the front right, a little above.
  #   zoom          closer than the 3D view frames the object (above 1), or
  #                 further (below).
  #   background    the colour behind the object: the editor's, '#1F1F1F'.
  #   antialias     each frame is drawn this many times larger each way and
  #                 shrunk, which smooths the edges: 2. 1 is about four times as
  #                 fast to draw.
  #   line_weight   how wide a line that bounds no face is, in pixels.
  #   threads       how many frames are drawn at once: one per core, up to four.
  #   fade_in, fade_out, fade_color   seconds of fading from and to a colour
  #                 (black) at the start and the end.
  #   text          text over the picture: a string (shown throughout, at the
  #                 bottom) or a list of them, or of maps with 'text', 'start',
  #                 'end' or 'duration' (seconds), 'position' (top, center,
  #                 bottom, left, right, top-left, top-right, bottom-left,
  #                 bottom-right), 'size' (a fraction of the frame's height),
  #                 'font', 'color', 'outline', 'shadow', 'box'.
  #   logo          an image in a corner: its path, or a map with 'path',
  #                 'position' (top-right), 'width' (a fraction of the frame's)
  #                 and 'opacity'.
  #   audio         a soundtrack: the path of anything GStreamer can play, or a
  #                 map with 'path', 'start' (which extract of it, in seconds
  #                 from its start), 'volume', 'fade_in', 'fade_out' and 'loop'.
  #                 Cut to the length of the video.
  #   filters       GStreamer video filters the frames go through, each
  #                 '<element> <property>=<value> ...' ('videobalance
  #                 saturation=1.3').
  #   title         the title the container says the video has.
  #
  # A relative path in 'logo' and 'audio' is read from the package of the object
  # being rendered. A video that reads a file - one of those, or the video it is
  # appended to - is not cached, since what the file holds is not in the
  # question the cache keys on.
  #
  # 'reproducible' is declared for the protocol's sake and decides nothing: a
  # container is stamped with the time it was written, and an encoder running
  # on several threads is not held to the same bytes twice.
  mp4:
    desc: A video of the object turning, as H.264 in MP4 - what every social network takes.
    path: render_video.py
    extension: mp4
    container_format: mp4
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false

  m4v:
    desc: The MP4 video under the extension Apple's players file it under.
    path: render_video.py
    extension: m4v
    container_format: mp4
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false

  mov:
    desc: A video of the object turning, as H.264 in QuickTime.
    path: render_video.py
    extension: mov
    container_format: mov
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false

  qt:
    desc: The QuickTime video under its older extension.
    path: render_video.py
    extension: qt
    container_format: mov
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false

  mkv:
    desc: A video of the object turning, as H.264 in Matroska.
    path: render_video.py
    extension: mkv
    container_format: mkv
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false

  webm:
    desc: A video of the object turning, as VP9 in WebM - what a web page plays without a plugin.
    path: render_video.py
    extension: webm
    container_format: webm
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false

  avi:
    desc: A video of the object turning, as H.264 in AVI.
    path: render_video.py
    extension: avi
    container_format: avi
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false

  wmv:
    # Without a soundtrack: see 'CONTAINERS' in 'video_encode.py' for why.
    desc: A video of the object turning, as Windows Media Video in ASF.
    path: render_video.py
    extension: wmv
    container_format: asf
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false

  asf:
    desc: The Windows Media video under the container's own extension.
    path: render_video.py
    extension: asf
    container_format: asf
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false

  ogv:
    # Ogg keeps none of GStreamer's tags for a Theora stream, so where its turn
    # stopped, and its 'title', are written into the stream's Vorbis comments
    # once the file is: PARTCAD_VIDEO, PARTCAD_ANGLES, PARTCAD_FRAMES,
    # PARTCAD_FPS and TITLE (see 'video_encode.write_comments').
    desc: A video of the object turning, as Theora in Ogg - free of patents throughout.
    path: render_video.py
    extension: ogv
    container_format: ogg
    dockerImage: "ghcr.io/partcad/partcad-container-python:{version}-py{python}-gstreamer"
    size: reels
    fps: 30
    speed: [0, 0, 30]
    preset: medium
    quality: 65
    reproducible: false
