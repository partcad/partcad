desc: Four analyses whose answer is known before the solver runs.

# TEMPORARY, until the public index carries `feature/cae`. The CAE packages are
# not on the index's `main`, which is what `examples/partcad.yaml` and every
# `pc init` project pin -- so `//pub/feature/cae/calculix` and its siblings,
# which the `cae*Implementation` options name by default, resolve to nothing and
# the commands below answer "the package implementing 'fea' is not found".
# Depending on them directly makes this example run today without repinning the
# whole examples tree at the index's `devel`, which would also drag in changes
# that have nothing to do with this.
#
# Delete these and the `implementation:` lines below once the index has them,
# and the parts fall back to the user configuration like any other.
dependencies:
  calculix:
    desc: Finite element analysis, by CalculiX.
    type: git
    url: https://github.com/partcad/partcad-cae-calculix.git
  elmer:
    desc: Finite element, modal, heat transfer and flow analysis, by Elmer.
    type: git
    url: https://github.com/partcad/partcad-cae-elmer.git
  openfoam:
    desc: Flow analysis, by OpenFOAM.
    type: git
    url: https://github.com/partcad/partcad-cae-openfoam.git

docs:
  intro: |
    PartCAD ships no solver, so `pc cae` is only ever as right as whoever
    implements it. These two parts are how you find out: each analysis of them
    is a textbook case with a closed-form answer, so the number the solver
    returns can be compared against arithmetic rather than against
    expectations.

    The cantilever is analysed three ways -- for stress (`fea:`), for its
    natural frequencies (`dynamic:`) and for heat (`thermal:`) -- and the pipe
    for flow (`cfd:`). See README.md for the derivations, the expected values,
    what each implementation measured, and what a given disagreement would mean.

  usage: |
    ```shell
    # The implementation each part names, or whatever the user configuration does
    pc cae fea :cantilever
    pc cae dynamic :cantilever
    pc cae thermal :cantilever
    pc cae cfd :pipe

    # A particular one, for this run only
    pc cae fea -i elmer:fea :cantilever

    # All of them as checks that fail on any finding
    pc test

    # Where the boundary conditions actually landed
    pc render -t svg --with-ports cantilever
    ```

# A port is a coordinate frame; a sketch on it is a surface. The pipe's ends are
# drawn with this one -- the bore's own cross-section, a circle of its radius --
# placed by each port's frame, Z out of the end face. That is what the flow
# analysis is driven through and leaves by: PartCAD imprints each sketch on the
# part and hands the implementation the faces it covers, and the area those
# faces add up to is what a `load:` is spread over.
sketches:
  bore:
    type: basic
    desc: The bore of the pipe, seen end on.
    circle: 5

interfaces:
  beam-root:
    desc: |
      The clamped end of the cantilever.

      Drawn with no sketch, because it needs none: the port sits in the middle
      of the end face, and a port with no sketch covers the face it lies on --
      all 10x10 mm of it, which is exactly what "clamped" means here.
    ports:
      root:

  beam-tip:
    desc: The free end of the cantilever, where the load and the heat are applied.
    ports:
      tip:

  pipe-inlet:
    desc: The face the flow is driven through.
    ports:
      inlet:
        sketch: bore

  pipe-outlet:
    desc: |
      The face the flow leaves through, held at the reference pressure.

      An incompressible flow is posed by *differences* in pressure, so a part
      that names an inlet and no outlet has asked a question with no answer --
      the solver has nowhere to put what is being pushed in, and reports a dead
      field or a divergence rather than an error. This is that missing half.
    ports:
      outlet:
        sketch: bore

parts:
  cantilever:
    type: build123d
    desc: |
      A 100x10x10 mm steel bar, clamped at one end. Pulled down by 100 N at the
      other, its tip deflection and peak bending stress are both closed forms;
      left to ring, so is its first natural frequency; and heated by 1 W at the
      tip with the root held at 20 C, so is the temperature it reaches.
    # Not on 64-bit ARM Linux, where the analyses below cannot all run: gmsh
    # publishes no wheel for that platform and no source distribution, so an
    # implementation cannot be installed in a Python sandbox there. They run
    # perfectly well in the images the packages name -- each is built for arm64
    # too -- and this line comes out the moment those images are published.
    #
    # The exclusion is on the part rather than on its sections because `unless`
    # selects declarations, and a part that declares an analysis nothing can run
    # is a part whose check fails: `pc test` does not excuse an implementation
    # that was asked and did not answer where a container runtime is running,
    # which on a 64-bit ARM Linux machine it usually is.
    unless: [aarch64]
    implements:
      beam-root: [[-50, 0, 0], [0, 0, 1], 0]
      beam-tip: [[50, 0, 0], [0, 0, 1], 0]
    fea:
      # Temporary, with the dependencies at the top of this file: the public
      # index does not carry `feature/cae` yet, so the default
      # `caeFeaImplementation` resolves to nothing. Delete them and this falls
      # back to the user configuration like any other part.
      implementation: calculix:fea
      fix:
        - beam-root
      load:
        beam-tip: 100 N
    dynamic:
      implementation: elmer:dynamic
      fix:
        - beam-root
    thermal:
      implementation: elmer:thermal
      temperature:
        beam-root: 20 C
      heat:
        beam-tip: 1 W

  pipe:
    type: build123d
    desc: |
      The bore of a 10x100 mm pipe, driven by 5 mN at the inlet and leaving at
      the outlet; every other surface is the wall, held no-slip. Fully developed
      laminar flow: Hagen-Poiseuille.
    implements:
      pipe-inlet: [[0, 0, -50], [0, 0, 1], 0]
      pipe-outlet: [[0, 0, 50], [0, 0, 1], 0]
    # No `fix:`. Every surface that is neither an inlet nor an outlet is a wall,
    # so the bore's lateral surface is one without being named -- and it could
    # not be named by a sketch anyway: a sketch is flat, and that surface is a
    # cylinder.
    cfd:
      implementation: openfoam:cfd
      load:
        pipe-inlet: 0.005 N
      outlet:
        - pipe-outlet
    # The drawing README.md shows: the bore, with both ports and the circle
    # each is drawn with. Declared here rather than as a package-wide file type
    # because it is this part's boundary that is worth looking at.
    render:
      svg-with-ports:
        desc: The bore, with its ports marked and the sketch each is drawn with.
        package: //builtin/render
        path: render_svg.py
        extension: ports.svg
        with_ports: true
        with_interfaces: true
        # This drawing is checked in, so it has to be the same file every time
        # it is rendered. See 'reproducible' in '//builtin/render', and the note
        # at the top of 'examples/partcad.yaml'.
        reproducible: true
        precision: 4

# Only the parameters, and deliberately no `path:`/`package:`: which package
# implements each analysis is the parts' answer above, and repeating it here
# would say it twice in a way that can disagree. A layer that names `path:` is
# claiming to *be* the implementation -- see `output.stamp()` -- so a package
# re-tuning someone else's parameters says neither.
#
# Every one of these is pinned because the closed forms in README.md assume it.
cae:
  fea:
    youngs_modulus: 2.0e+11   # 200 GPa
    poissons_ratio: 0.30
    density: 7850
    self_weight: false        # the closed form is the tip load alone
    mesh_order: 2
    mesh_size: 0.03
    # CalculiX's, and nobody else's: it applies a condition to the nodes within
    # this fraction of the part's size of a port, where the others use the face
    # the port covers. 7.5 mm on a 100 mm bar is the smallest ball that clamps
    # the whole 10x10 end face (its half-diagonal is 7.07 mm). It also clamps
    # 7.5 mm of the length, which is the modelling error README.md is about.
    port_radius: 0.075

  dynamic:
    youngs_modulus: 2.0e+11
    poissons_ratio: 0.30
    density: 7850
    mesh_order: 2
    mesh_size: 0.03
    # Enough to see the first bending pair, the first torsion mode and the
    # second bending pair.
    modes: 6

  thermal:
    # W/(m*K), a plain carbon steel. The closed form is P*L/(k*A).
    conductivity: 50.0
    mesh_order: 2
    mesh_size: 0.03

  cfd:
    density: 900              # a light oil, kg/m^3
    viscosity: 0.1            # Pa*s
    # 0.8 mm on a 100 mm bore: about six cells across the radius, which is
    # where the measured flow rate stops moving with the mesh.
    mesh_size: 0.008
