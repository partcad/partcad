# A landscape: generated by the `gen-landscape` skill's landscape.py from site.json.
# Do not edit it; run `landscape.py package` again. A scene of your own places this
# one (`scene: <this package>:landscape`) and the objects you test in it.
#
# The frame: millimetres, X east, Y north, Z up, the origin at the centre of the area.
# `landscape.py height site.json X Y` is the height of the ground at a point of it, and
# `landscape.py place site.json X Y --footprint W,D` a location standing an object there.
desc: "400 x 400 m of the world around 38.664070, -77.160180, as a landscape to test objects in."
manufacturable: false

# Where its data came from, and what each source asks of whoever uses what was made of it.
docs:
  usage: |
    The landscape is the scene `landscape`. Place it in a scene of your own,
    with the objects to test, at z = the ground's height (`landscape.py height`).

    Origin: 38.66407000, -77.16018000. Fetched 2026-11-16.
    Ground: 10.7 to 39.7 m above the elevation model's datum, the lowest at z = 1000 mm.

    - AWS Terrain Tiles (Terrarium): Elevation from the AWS Terrain Tiles (Mapzen): SRTM, GMTED, ETOPO1 and NED/3DEP courtesy of the U.S. Geological Survey; EU-DEM produced using Copernicus data and information funded by the European Union; and the other sources listed at the URL (https://github.com/tilezen/joerd/blob/master/docs/attribution.md)
    - OpenStreetMap: © OpenStreetMap contributors, under the Open Database License (ODbL) (https://www.openstreetmap.org/copyright)
    - The tree is drawn as //pub/collection/printables/models:556482: CC-BY-SA, 'Low poly tree' on Printables (printables.com/model/556482)

colors:
  asphalt:
    desc: "A road."
    display: "#4A4A4F"
    manufacturable: false
  building:
    desc: "A building."
    display: "#C9B8A0"
    manufacturable: false
  fence:
    desc: "A fence or a guard rail."
    display: "#7A5C3E"
    manufacturable: false
  foliage:
    desc: "A tree's leaves."
    display: "#4E7D3A"
    manufacturable: false
  gravel:
    desc: "A path."
    display: "#B8A98C"
    manufacturable: false
  ground:
    desc: "The ground: grass and soil."
    display: "#8A9A5B"
    manufacturable: false
  hedge:
    desc: "A hedge."
    display: "#3F6B35"
    manufacturable: false

parts:
  ground:
    type: build123d
    path: ground.py
    desc: "The ground, on a flat base at z = 0, and what lies or stands on it that is not a prop (roads, paths, buildings, fences, hedges), one part with each layer in its own colour."
    manufacturable: false
    parameters:
      layer:
        type: string
        default: all
        enum: [all, terrain, roads, paths, buildings, fences, hedges]
        desc: Every layer, or one of them alone.
  tree:
    type: basic
    desc: "A tree, as its trunk: what a robot runs into. Drawn whole. Its origin is the centre of its base."
    manufacturable: false
    parameters:
      height: {type: float, default: 10000, desc: How high it is in mm.}
    cylinder: {radius: 200, height: "%height%"}
    offset: [[0, 0, "%height / 2%"], [0, 0, 1], 0]
    visual: tree-look
  tree-look:
    type: alias
    source: "//pub/collection/printables/models:556482"
    desc: "What a tree is drawn as: CC-BY-SA, 'Low poly tree' on Printables (printables.com/model/556482)"
    private: true
    manufacturable: false
    parameters:
      height: {type: float, default: 10000}
      color: {type: string, default: ":foliage"}
    # Its base's centre to the origin, in its own units, then scaled to the prop's height.
    offset: [[0.042, 0.037, 0.305], [0, 0, 1], 0]
    scale: "%height / 20.513%"

scenes:
  landscape:
    type: assy
    path: landscape.assy
    timeout: 1800
    desc: "The landscape: the ground, what is draped on it, and its props, all fixed."
    gravity: [0, 0, -9.81]
