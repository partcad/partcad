desc: This example demonstrates how to define a sketch using a build123d script.

docs:
  usage: |
    ```shell
    pc inspect -s clock
    ```

sketches:
  clock:
    type: build123d
    desc: A clock face taken from the build123d examples

render:
  readme:
  svg:
    # This drawing is checked in, so it has to be the same file every time it
    # is rendered. See 'reproducible' in '//builtin/render', and the note at
    # the top of 'examples/partcad.yaml' for what that settles and what it
    # cannot.
    reproducible: true
