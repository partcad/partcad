desc: |
  PartCAD example: sketches built by a package-defined 'sketchType'.

  'sketchTypes' declares a reusable way to construct sketches, the way
  'partTypes' does for parts. The 'plate' sketchType below is of the default
  kind 'wrapper': its 'path' is a Python script run in the sandbox, which hands
  back the sketch's faces, wires and edges. The sketches reference it with the
  short form ':plate' (expanded to '<this package>:plate' when loaded), and each
  sets the type's parameters to its own values.

docs:
  usage: |
    ```shell
    pc ide view -s plate
    pc ide view -s plate_wide
    ```

sketchTypes:
  plate:
    kind: wrapper
    desc: A rounded plate with a row of holes, and the open path of its bend line.
    path: plate.py

sketches:
  plate:
    type: ":plate"
    desc: A plate built by the 'plate' sketchType, with its parameters' defaults.
    parameters:
      width:
        type: float
        default: 40
      height:
        type: float
        default: 20
      holes:
        type: int
        default: 2
  plate_wide:
    type: ":plate"
    desc: The same sketchType, asked for a wider plate with more holes.
    parameters:
      width:
        type: float
        default: 70
      height:
        type: float
        default: 20
      holes:
        type: int
        default: 4

render:
  readme:
  svg:
    # This drawing is checked in, so it has to be the same file every time it
    # is rendered. See 'reproducible' in '//builtin/render', and the note at
    # the top of 'examples/partcad.yaml' for what that settles and what it
    # cannot.
    reproducible: true
