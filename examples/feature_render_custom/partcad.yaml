desc: |
  PartCAD example: `render:` implementations that another package supplies.

  `feature_export_custom` writes an implementation of its own. This package
  writes none. It names one that somebody else published - and with it gets a
  file type PartCAD has no implementation of at all.

  The three drawings below are produced by
  [draftwright](https://github.com/pzfreo/draftwright) through
  `//pub/feature/render/draftwright`, a package in the public PartCAD index.
  Each file type says where the implementation lives (`package`) and which
  script in it to run (`path`); every other field is a parameter of the drawing,
  handed to that script verbatim.

  Nothing has to be installed by hand. PartCAD installs the implementing
  package's Python requirements - draftwright, in this case - into the sandbox
  it runs that package's implementations in.

docs:
  intro: |
    ![The drawing this example produces](./bracket.svg)

    That is `bracket.svg`: a fully dimensioned technical drawing, not the flat
    projection PartCAD's built-in `svg` renderer produces. The same drawing is
    also written as [PDF](./bracket.pdf), and as `bracket.dxf` for a CAD tool to
    pick up - too large to keep in the repository, so `pc render` is what puts
    it there.

    ### Why these are `render:` types and not `export:` ones

    PartCAD's two output sections are not two names for the same thing:

    - `export:` is for files another CAD tool opens as a **part or a sketch** -
      geometry it can go on working with.
    - `render:` is for **output files in general** - a drawing, a picture, a
      report.

    A technical drawing is a *document about* a part rather than the part:
    nothing downstream can load the PDF and machine from it. So all three file
    types are declared under `render:`, and the same three would be a lie under
    `export:` - they would promise callers geometry this package cannot deliver.

    Nothing is lost by that. The section a file type belongs to is decided by
    where it is declared, not by which command asked for it, so `pc export -t
    pdf :bracket` produces the drawing just as `pc render -t pdf :bracket` does.
    What the split settles is not reachability but meaning, and that is the
    promise being kept.

  usage: |
    ```shell
    pc render :bracket           # all three drawings, and this README
    pc render -t pdf :bracket
    ```

    The same implementation draws an object of any other package, without that
    package knowing about it. `-e` says which package to read the output
    configuration from - the implementing one for its own defaults, or this one
    for the drawing parameters set below:

    ```shell
    pc render -t pdf -e //pub/feature/render/draftwright \
        //pub/examples/partcad/produce_part_step:bolt
    ```

dependencies:
  # The public index, which is where '//pub/feature/render/draftwright' comes
  # from. Declared here as well as in the parent package so that this example
  # also works on its own, checked out by itself: 'onlyInRoot' means it is used
  # when this package is the root and ignored when it is not, so nothing is
  # fetched twice when the examples are used together.
  pub:
    onlyInRoot: true
    type: git
    url: https://github.com/partcad/partcad-index.git

parts:
  bracket:
    type: build123d
    path: bracket.py
    desc: A mounting plate, drawn rather than projected.

# Re-rendering this example dirties the working tree, and that is expected.
# None of draftwright's three formats is byte-reproducible, each for its own
# reason, and no parameter of its own can settle it: 'build_drawing()' takes
# what to draw, 'Drawing.export()' takes which formats and a raster DPI.
# Measured by rendering each format twice in a row from the same input:
#
#   svg  Two faces of one glyph - the stem and the tittle of an 'i' in the
#        title block - swap places from one run to the next. Same paths, same
#        coordinates, different order. It follows the process's hash seed: with
#        the seed pinned, two runs are byte-identical, and two different seeds
#        differ. A sandbox wrapper cannot pin it, because it runs under '-I',
#        which makes Python ignore PYTHONHASHSEED.
#   pdf  Carries the moment it was written in '/CreationDate'.
#   dxf  Carries it twice, in the '$TDCREATE' and 'TDUPDATE' header variables.
#
# So the two committed files are re-committed only when the drawing itself
# changes. The CI job that renders the examples skips exactly these paths and
# says so where it does (.github/workflows/test.yml, "The rendered examples
# must match what is checked in"). If you see them modified after 'pc render'
# and the drawing is the same, throw the change away: 'git checkout -- .'
render:
  # The package document, assembled by PartCAD out of the images below.
  readme:

  svg: &drawing
    # Where the implementation lives and which script in it produces the file.
    # 'package' is what makes this someone else's implementation rather than
    # this package's own; without it PartCAD looks for 'path' in '//builtin'.
    package: //pub/feature/render/draftwright
    path: render_draftwright.py

    # Everything below is a drawing parameter, not something PartCAD knows
    # about: it is handed to the script above as it stands. A parameter left out
    # keeps draftwright's own default.
    title: Mounting Plate
    number: PC-EX-0001
    material: AL 6061-T6
    company: PartCAD
    drawn_by: PartCAD example
    frame: true
    # The sheet, named rather than left to draftwright's default - which matters
    # for more than its size. Unset, this part came out A4 at 1:1 and the
    # overall 90 width had nowhere to go: both dimension strips of the plan view
    # were full (the slot's length below, the hole positions and the slot's own
    # position above), so draftwright dropped the width and said so
    # ('overall_dim_withheld'). Naming a sheet fits the drawing to it instead -
    # A4 lands on 1:2 and A3 on 2:1, and both leave room for the width. A3
    # because a 90 mm plate is worth reading at 2:1.
    page: A3

  # The same implementation and the same parameters, in the other two formats.
  # A YAML anchor, not a PartCAD feature - the file type each one names is what
  # tells the implementation which file to write.
  pdf: *drawing
  dxf: *drawing
