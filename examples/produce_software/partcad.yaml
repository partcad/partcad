desc: |
  PartCAD example: the software a product ships with.

  'software' declares a file the product ships with -- a firmware image, a
  binary, a disk image -- as an object of the package, beside its parts and its
  assemblies. It is not geometry: nothing renders it, nothing exports it. What
  it is is a file, and every software type is one; the types that will join
  'raw' (the default) each name a firmware flashing procedure for the same file
  rather than a different kind of object.

  A part or an assembly says what it ships with in its own 'software:', and the
  bill of materials of every assembly it ends up in then lists that software
  beside the parts, with the revision of the package it came from -- because a
  firmware image, unlike a bracket, is a different thing once its package
  publishes again.

docs:
  usage: |
    ```shell
    pc list software
    pc bom :device
    ```

software:
  controller-firmware:
    desc: The image the controller board is flashed with
    version: "1.0.0"
    # 'path' is optional; without it the file is the object's own name. The
    # default carries no extension, because a firmware image is as likely to be
    # a '.img' or nothing at all as it is a '.bin'.
    path: controller-firmware.bin

  # The short form: the value is the path of the file.
  service-tool: service-tool.sh

parts:
  controller:
    type: cadquery
    desc: The controller board
    # What this part ships with. A bare name is software of this package; a
    # '<package path>:<name>' is software of another one.
    software:
      - controller-firmware

assemblies:
  device:
    type: assy
    desc: A device made of two controller boards, and what runs on them
    # The assembly ships the host-side tool itself: it is not any one board's.
    software:
      - service-tool
