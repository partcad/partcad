desc: URDF assembly examples

docs:
  usage: |
    A URDF file is used as an assembly directly, with no conversion step:

    ```shell
    pc inspect -a robot
    ```

    This package declares it the way `pc add assembly` would. The other way in
    is `pc import assembly`, which converts instead of declaring - the package
    ends up with an `stl` part per link and an interface pair per joint, and
    nothing points at the URDF afterwards:

    ```shell
    pc add assembly urdf robot.urdf     # declare it, as this package does
    pc import assembly robot.urdf       # or convert it, as with a STEP file
    ```

    Each link becomes a part of this package, named `<assembly>/<link>`, which
    can be inspected and exported like any other part. So does the geometry a
    link was not built from, as `<assembly>/<link>/<visual|collision>`:

    ```shell
    pc inspect robot/forearm
    pc export -t step robot/wrist
    pc inspect robot/base_link/visual
    ```

    What each link says about its physics becomes named properties of its part -
    `mass`, `centerOfMass`, `inertia`, `friction` - in PartCAD's own units:

    ```shell
    pc info robot/base_link
    ```

    The reverse direction writes a URDF (plus the mesh files it references) from
    any PartCAD assembly:

    ```shell
    pc export -a -t urdf -O ./ robot
    pc export -P /produce_assembly_assy -a -t urdf -O ./ :logo
    ```

    `pc convert assembly` goes further and rewrites the package: to ASSY it
    writes an `stl` part per link and an interface pair per joint, so the
    assembly places its parts with `connect:`; to URDF it writes the `.urdf` and
    its meshes and switches the declaration over.

    ```shell
    pc convert assembly -t assy robot
    ```

assemblies:
  robot:
    type: urdf
    desc: A URDF robot description used directly as a PartCAD assembly
    # A link that states both is built from its collision geometry, which is
    # what a simulator resolves contact against. 'ignoreCollision: true' - or a
    # list of link names - builds from the visual geometry instead. Either way
    # the other one is kept, as '<assembly>/<link>/<visual|collision>'.
    ignoreCollision: false
    # Core URDF that PartCAD has no property for always stops the import.
    # 'strict: true' extends that to '<gazebo>', whose vocabulary is open and
    # where an unknown setting is otherwise only reported.
    strict: false

render:
  readme:
  svg:
    prefix: ./
