desc: Assembly YAML examples

docs:
  usage: |
    ```shell
    pc inspect primitive
    pc inspect 'primitive_parametrized;offset=12'
    pc inspect logo
    pc inspect logo_embedded
    ```

assemblies:
  primitive:
    type: assy
  primitive_parametrized:
    type: assy
    desc: Parameters declared here are passed to the ASSY file as 'param_<name>'
    parameters:
      # The short form is expanded to '{type: float, default: 5.0}'
      offset: 5.0
  logo:
    type: assy
    desc: PartCAD logo
  logo_embedded:
    type: assy
    desc: PartCAD logo using embedded assemblies
  partcad_logo:
    type: alias
    source: logo
  partcad_logo_short: logo

parts:
  # A 'compound' part flattens a referenced assembly into a single part
  # (a TopoDS_Compound).
  primitive_compound:
    type: compound
    source: primitive

render:
  readme:
  svg:
    prefix: ./
