desc: PartCAD example project which demonstrates parts defined using Chili3D.

docs:
  usage: |
    ```shell
    pc inspect cube
    ```

parts:
  cube:
    type: chili3d
    desc: Sample part defined using Chili3D

render:
  readme:
  svg:
    # This drawing is checked in, so it has to be the same file every time it
    # is rendered. See 'reproducible' in '//builtin/render', and the note at
    # the top of 'examples/partcad.yaml' for what that settles and what it
    # cannot.
    reproducible: true
    prefix: ./
