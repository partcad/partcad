desc: >
  This example demonstrates how to lay out a space with walls: one-sided
  surfaces seen from the inside of a room and looked through from outside it.

docs:
  usage: |
    A wall is a surface rather than a body - a sheet of faces with no thickness,
    drawn from the side it faces and not at all from the other - so a room drawn
    from outside is drawn *through* its near walls, the way a floor plan or a
    sales brochure shows a flat. None of it is manufacturable, and it says so.

    ```shell
    pc ide view -S living-room
    pc render -t png --view iso -S living-room
    pc render -t svg --view top -S living-room   # from above, it is the plan
    ```

    `living-room` is a `walls` scene: a wall per edge of the sketch `plan`, every
    one of them looking in, and every one painted the room's colour - a CMF
    colour, `sage`, that claims nothing, since nobody buys a wall. `entrance` is
    one wall on its own, with a door and a window cut out of it by the sketch
    `openings`, drawn as if the wall were unrolled flat. `bay` is PartCAD's own
    wall asked for an arc, bending towards the side it is seen from, in the grey
    a wall is unless it is painted.

    A shaded picture, or a video of the room turning, is drawn the same way:

    ```shell
    pc render -t png --style shaded -S living-room
    ```

    PartCAD ships both as `//builtin/building:wall` and `//builtin/building:room`,
    which any package can use without declaring anything - name the sketch in
    full, because it is yours and not `//builtin`'s:

    ```shell
    pc render -t png -S "//builtin/building:room;sketch=//pub/examples/partcad/produce_scene_walls:plan"
    ```

# A wall is never made, and has to say so: on the part, or - as here - once for
# the whole package.
manufacturable: false

# What the walls are painted. A CMF colour like any other, and only a picture:
# nobody is going to buy a wall, so the colour claims nothing either.
colors:
  sage:
    desc: A muted green, for the walls of a living room
    display: "#7D8F69"
    manufacturable: false

sketches:
  plan:
    type: build123d
    desc: A living room from above, with a bay window and a column
  openings:
    type: build123d
    desc: A door and a window, on a wall unrolled flat

parts:
  entrance:
    type: wall
    desc: A wall with a door and a window in it, seen from the front, painted sage
    length: 4500
    height: 2700
    openings: openings
    parameters:
      color:
        type: string
        default: ":sage"
  # PartCAD's own wall, asked for an arc: an eighth of a turn of radius 1500.
  bay:
    type: enrich
    source: //builtin/building:wall
    desc: An arc wall of radius 1500, bending towards the side it is seen from
    with:
      length: 1178.097245
      radius: 1500

scenes:
  living-room:
    type: walls
    desc: The walls standing on the plan, every one looking in, every one painted sage
    sketch: plan
    height: 2700
    # A room's colour is every wall's.
    parameters:
      color:
        type: string
        default: ":sage"

render:
  readme:
  svg:
    # This drawing is checked in, so it has to be the same file every time it
    # is rendered. See 'reproducible' in '//builtin/render', and the note at
    # the top of 'examples/partcad.yaml' for what that settles and what it
    # cannot.
    reproducible: true
