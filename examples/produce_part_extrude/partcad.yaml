desc: >
  This example demonstrates how to define 3D parts by extruding 2D sketches.

docs:
  usage: |
    ```shell
    pc inspect dxf
    pc inspect cylinder
    pc inspect clock
    ```

parts:
  cylinder:
    desc: Extrude a circle sketch to create a cylinder.
    type: extrude
    sketch: ../produce_sketch_basic:circle_01
    depth: 1
  dxf:
    desc: Extrude a DXF sketch to create a 3D part.
    type: extrude
    sketch: ../produce_sketch_dxf:dxf_01
    depth: 10
  clock:
    desc: Extrude a clock sketch to create a 3D clock.
    type: extrude
    sketch: ../produce_sketch_build123d:clock
    depth: 1

render:
  readme:
  svg:
    # This drawing is checked in, so it has to be the same file every time it
    # is rendered. See 'reproducible' in '//builtin/render', and the note at
    # the top of 'examples/partcad.yaml' for what that settles and what it
    # cannot.
    reproducible: true
