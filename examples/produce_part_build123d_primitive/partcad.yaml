desc: PartCAD example project which demonstrates parts defined using build123d.

docs:
  usage: |
    ```shell
    pc inspect cube
    ```

parts:
  cube:
    type: build123d
    desc: Sample part defined using build123d

render:
  readme:
  svg:
    # This drawing is checked in, so it has to be the same file every time it
    # is rendered. See 'reproducible' in '//builtin/render', and the note at
    # the top of 'examples/partcad.yaml' for what that settles and what it
    # cannot.
    reproducible: true
    prefix: ./
