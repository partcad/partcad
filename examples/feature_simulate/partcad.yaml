desc: PartCAD example project which demonstrates simulating a part or an assembly.

docs:
  usage: |
    A part says what it *is*. `simulate:` is where it says what it is supposed
    to **do** -- or, as here, what it is supposed not to do:

    ```shell
    pc sim -a stable      # the stack stands; the validation passes
    pc sim -a unstable    # the top block falls off; that validation passes too
    pc sim                # every simulation this package declares
    ```

    `stable` and `unstable` are the same two blocks. In `stable` the upper one
    sits squarely on the lower one; in `unstable` it is pushed 18 mm out of 20
    off the edge, so its centre of mass is past the corner it rests on. Nothing
    static distinguishes them -- both render, export and list the same way --
    and neither does anything PartCAD can check by looking. What separates them
    is what happens when the world is switched on.

    Each `simulate:` states five things: the `scene:` the object is placed in
    (here the default, `//builtin/scene:subject`, an empty world holding the
    subject and nothing else), the `offset:` that puts it there -- the blocks
    are drawn about their own centres, so the stack is lifted 10 mm to stand its
    bottom face on the floor -- the `simulation:` plugin that runs it, the
    `validation:` expression that says whether what happened is what was
    supposed to happen, and a `desc:` for whoever reads the result.

    ### The simulator is somebody else's package

    PartCAD implements no simulator. It ships the *concept* -- the `simulate:`
    section, the `simulation:` section a plugin is declared in, the sandbox the
    plugin runs in, and the MJCF export a scene reaches it through -- and a
    package supplies the physics. This one imports
    [partcad-sim-mujoco](https://github.com/partcad/partcad-sim-mujoco) below and
    names it as `sim-mujoco:mujoco`. Nothing has to be installed by hand: PartCAD
    installs that package's requirements into the sandbox it runs it in, so a
    machine with no MuJoCo on it simulates just the same.

    ### `slippery` is `stable` in another material

    `slippery.assy` is `stable.assy` with one word changed: the blocks are PTFE
    instead of aluminium. Same geometry, same locations, same scene, same
    simulation -- and the top block ends up on the floor.

    ```shell
    pc sim -a stable      # nothing moves
    pc sim -a slippery    # the top block slides off
    ```

    The scene both run in is `tilted`, whose gravity leans 15 degrees off
    vertical. On a level floor nothing pushes a block sideways, so its friction
    is never asked anything and both stacks stand; a sideways pull is what makes
    the material matter. Tilting the world rather than building a ramp keeps
    the floor endless and the stacks placed exactly as they are drawn: a block
    on a level floor under a leaning gravity is, as far as sliding goes, a
    block on a 15-degree ramp.

    That is not a quirk of the simulator; it is what the two materials are. A
    block slides when its friction is below tan(15 deg), 0.268. Aluminium on
    aluminium grips (`mu: 1.05` -- dry aluminium galls, which is why the number
    is above one): four times what it takes. PTFE on PTFE (`mu: 0.04`) has a
    seventh of it. So "will this stack stand?" is a question about the
    material, and `materials:` below is where the answer is written down. Every
    part that names one gets its `mu` written into the simulation, in the same
    place SDFormat calls `<mu>` and URDF calls `<mu1>`.

    It is the top block that slides, and not the stack along the floor: MuJoCo
    meets two surfaces at the larger of their two frictions, and the floor
    states MuJoCo's default of 1.0, so every block grips the floor. Two PTFE
    blocks meet at PTFE's.

    Without it the simulation would answer with **MuJoCo's** default friction of
    1.0 -- a plausible number for metal, a badly wrong one for PTFE, and in
    either case a number nobody chose.

    ### Looking at what happened

    `--json` prints everything the plugin reported, which for MuJoCo is where
    every body was before and after:

    ```shell
    pc sim --json -a slippery
    ```

    The scene reaches the simulator as the MJCF PartCAD writes. That is an
    ordinary export, so the same file can be written out and looked at -- or
    opened in MuJoCo:

    ```shell
    pc export -a -t sim-mujoco:mjcf -O ./ unstable
    pc ide open --with mujoco ./unstable.xml
    ```

    ### `float` and `block` in a tank of water

    A scene says what its world is like as well as where things are in it: the
    `gravity:` in it, and the `medium:` it is filled with, which is a material
    like any other. `tank` is filled with `water`, and holds whatever is
    simulated in it 100 mm above its floor.

    ```shell
    pc sim -f sinks block    # the aluminium block sinks to the bottom of the tank
    pc sim float             # the float rises -- and, in the default scene, falls
    ```

    `float` is the same 20 mm cube as `block`, standing for a sealed float that
    weighs 3 g: less than the 8 g of water it displaces. Its `simulate:` runs it
    twice, in the tank and in the default scene, and the two validations are
    opposite claims about the same part. The default scene is a vacuum, as every
    scene that states no `medium:` is, so there the float falls like anything
    else.

    The float states its own `mass` because it is hollow, which its geometry
    does not say; PartCAD works out the rest -- its centre of mass and its
    inertia, from its solid, scaled to that mass -- and so does the volume of
    water it displaces. MuJoCo models a fluid as drag alone; the buoyancy is
    written by the MJCF exporter, and the water has no surface, so the float
    rises for as long as the run lasts rather than coming to rest at a
    waterline. See
    [partcad-sim-mujoco](https://github.com/partcad/partcad-sim-mujoco) for what
    is and is not modelled.

    `buoy` is the float again with its weight low down: 4 g, balanced 6 mm
    below its middle, as a float with a lead weight in its bottom would be. The
    water lifts it from its middle -- the centroid of its solid, its centre of
    buoyancy -- so its weight and the lift make a couple that turns the heavy
    side down. Released tilted 60 degrees, it is upright within a second.

    ```shell
    pc sim buoy           # the ballasted float rights itself as it rises
    ```

    `water` is declared below so that this example stays self-contained; the
    standard catalogue's is `//pub/std/manufacturing/material/fluid:water`.

dependencies:
  # The simulator. Declared here rather than assumed: PartCAD implements no
  # simulator, so a package that wants one imports it and says so.
  #
  # Not 'onlyInRoot', unlike the index dependency in the parent package: this
  # one is needed whenever these objects are simulated, whether this package is
  # the root or is being used from somewhere else.
  sim-mujoco:
    type: git
    url: https://github.com/partcad/partcad-sim-mujoco.git

# What the blocks are made of. A material is not a shape - there is nothing to
# render or export - it is a set of facts about a substance that the parts refer
# to by name.
#
# 'density' is the fact PartCAD computes a mass from; 'mu' is the one that
# decides whether these two blocks stay stacked. Both are stated in the units
# the rest of PartCAD works in.
materials:
  aluminium:
    formal: Al
    full: Aluminium
    desc: |
      Dry aluminium on aluminium, which galls rather than slides - which is why
      the coefficient is above one, and why the stack in `stable.assy` stands.
    density: 2700 # kg/m^3, i.e. 2.7 g/cm^3
    mu: 1.05
    tags:
      - metal

  ptfe:
    formal: PTFE
    full: Polytetrafluoroethylene
    desc: |
      One of the lowest coefficients of friction of any solid. The same two
      blocks made of it do not stay stacked.
    density: 2200
    mu: 0.04
    tags:
      - low-friction

  # What 'tank' below is filled with. A part is rarely made of water; a scene is
  # often filled with it, and names it the same way a part names what it is made
  # of. 'viscosity' is the fact a fluid states that a solid does not: dynamic
  # viscosity, in Pa*s - SI, like the density beside it.
  water:
    formal: H2O
    full: Fresh water at 15 C
    desc: |
      The same numbers as the standard catalogue's
      //pub/std/manufacturing/material/fluid:water, declared here so that this
      example works checked out on its own.
    density: 999.1 # kg/m^3
    viscosity: 0.001138 # Pa*s
    tags:
      - fluid

parts:
  block:
    desc: A 20 mm cube of aluminium, centred on its own origin
    type: cadquery
    path: block.py
    parameters:
      # What the part is asked to be made of. 'cadquery' is one of the part
      # types that accept a 'material' - it produces one homogeneous body, so a
      # single answer is true of the whole of it - and the factory records that
      # answer as the shape's 'material' property, which is what the exporters
      # and the simulation read.
      #
      # A relative reference, resolved in this package, so this example works
      # the same whether it is used from the examples tree or checked out on its
      # own. A material catalogued somewhere else is named the same way any
      # other object in another package is.
      material:
        type: string
        default: ":aluminium"
    simulate:
      # A part declares these exactly as an assembly does. One block on a floor
      # has nowhere to fall, which is the point: it is the control the three
      # assemblies below are read against.
      rests:
        desc: A block set down on the floor stays where it was put
        simulation: sim-mujoco:mujoco
        offset: [[0, 0, 10], [0, 0, 1], 0]
        validation: |
          max(
              abs(after["bodies"][name]["pos"][2] - before["bodies"][name]["pos"][2])
              for name in before["bodies"]
          ) < 5.0
      sinks:
        desc: Aluminium is denser than water, so the block goes to the bottom of the tank
        simulation: sim-mujoco:mujoco
        # A scene of this package's own, filled with water, and the block
        # released 100 mm above its floor.
        scene: :tank
        offset: [[0, 0, 100], [0, 0, 1], 0]
        # Released at 100 mm, it ends with its centre 10 mm above the floor:
        # 90 mm down. Water slows it; it does not stop it.
        validation: |
          max(
              after["bodies"][name]["pos"][2] - before["bodies"][name]["pos"][2]
              for name in before["bodies"]
          ) < -50.0

  float:
    desc: A sealed float - a 20 mm cube that weighs 3 g, less than the 8 g of water it displaces
    type: cadquery
    # The same script and so the same geometry as 'block': a float is the solid
    # it displaces. What makes it a float is what it weighs.
    path: block.py
    properties:
      physics:
        # Stated rather than derived, because it is hollow and its geometry
        # does not say so: 3 g in kg, the unit 'mass' is in. Its inertia is
        # the solid's, scaled to this, and is not stated.
        mass: 0.003
    simulate:
      floats:
        desc: Lighter than the water it displaces, the float rises through the tank
        simulation: sim-mujoco:mujoco
        scene: :tank
        offset: [[0, 0, 100], [0, 0, 1], 0]
        # The water has no surface, so a float rises for as long as the run
        # lasts. A tenth of a metre is far below where it gets to in ten
        # seconds, and something that sank could not get there.
        validation: |
          min(
              after["bodies"][name]["pos"][2] - before["bodies"][name]["pos"][2]
              for name in before["bodies"]
          ) > 100.0
      falls:
        desc: The same float in the default scene, which is a vacuum, falls like anything else
        simulation: sim-mujoco:mujoco
        # Released at the height the tank releases it at, so the two runs differ
        # in the medium and in nothing else.
        offset: [[0, 0, 100], [0, 0, 1], 0]
        validation: |
          max(
              after["bodies"][name]["pos"][2] - before["bodies"][name]["pos"][2]
              for name in before["bodies"]
          ) < -50.0

  buoy:
    desc: The float again, with its 4 g of weight low down - a ballasted float, which rights itself
    type: cadquery
    # The same solid once more: what makes it right itself is where its weight
    # is, not its shape.
    path: block.py
    properties:
      physics:
        # 4 g, half the water it displaces, and balanced 6 mm below its middle:
        # what a float with a lead weight in its bottom states about itself.
        # The water lifts it from its middle -- the centroid of the solid,
        # which PartCAD measures -- so the lift and the weight make a couple
        # that turns the heavy side down, whichever way it was released.
        mass: 0.004
        centerOfMass: [0, 0, -6]
    simulate:
      rights_itself:
        desc: Released tilted 60 degrees in the tank, the ballasted float turns its heavy side down
        simulation: sim-mujoco:mujoco
        scene: :tank
        # 100 mm above the floor and turned 60 degrees about X, so its own Z
        # axis starts half-way to horizontal.
        offset: [[0, 0, 100], [1, 0, 0], 60]
        # How upright it is: the world Z component of its own Z axis, from the
        # orientation the plugin reports (w, x, y, z) - 1 is upright, 0.5 is the
        # 60 degrees it was released at. It swings a little either side of
        # upright as it goes on rising, so "upright" is within 25 degrees.
        validation: |
          all(
              1 - 2 * (before["bodies"][name]["quat"][1] ** 2 + before["bodies"][name]["quat"][2] ** 2) < 0.6
              and 1 - 2 * (after["bodies"][name]["quat"][1] ** 2 + after["bodies"][name]["quat"][2] ** 2) > 0.9
              for name in before["bodies"]
          )

  block_ptfe:
    desc: The same 20 mm cube, in PTFE
    type: cadquery
    # The same script, and so the same geometry: the shape cache is keyed on
    # what was built, and what a shape reports about itself is carried beside
    # the cache entry rather than in it. Two parts cut from one solid can be
    # made of different things.
    path: block.py
    parameters:
      material:
        type: string
        default: ":ptfe"

scenes:
  tilted:
    desc: An empty world whose gravity leans 15 degrees off vertical, towards +X - a ramp with no edge
    type: assy
    path: tilted.assy
    # 9.81 m/s^2, 15 degrees off -Z towards +X: (9.81 sin 15, 0, -9.81 cos 15).
    # Everything in it is pulled sideways by a quarter of its weight, which is
    # what makes its friction matter: a block slides when its friction is below
    # tan(15 deg) = 0.268.
    gravity: [2.539, 0, -9.476]
    parameters:
      # The same three the scene PartCAD ships takes, assigned by 'pc sim'. The
      # stack that stands by default, so the scene on its own holds something.
      subject:
        type: string
        default: stable
      subject_kind:
        type: string
        default: assembly
      subject_offset:
        type: string
        default: "0 0 10 0 0 1 0"

  tank:
    desc: A tank of fresh water, holding whatever is simulated in it 100 mm above its floor
    type: assy
    path: tank.assy
    # The fluid the scene is filled with, as a material: its density and
    # viscosity are what a simulation of the scene drags and buoys what moves
    # through it with. A scene that names none is a vacuum.
    medium: :water
    # Earth's, along -Z, in m/s^2 - which is also what a scene that states no
    # gravity gets from the engine. Stated here only to show where it goes: on
    # the scene, and in m/s^2, the units every reader of 9.81 already knows.
    gravity: [0, 0, -9.81]
    parameters:
      # The object being simulated, assigned by 'pc sim' as a full path. The
      # float by default, so that the tank on its own holds something to draw.
      subject:
        type: string
        default: float
      # Which kind of object that is, since an ASSY link names a part and an
      # assembly with different keys.
      subject_kind:
        type: string
        default: part
      # Where it goes - seven numbers, as the scene PartCAD ships takes them,
      # from the 'offset:' of the simulation that names this scene.
      subject_offset:
        type: string
        default: "0 0 100 0 0 1 0"

assemblies:
  stable:
    desc: Two aluminium blocks, the upper one squarely on top of the lower one
    type: assy
    simulate:
      stands:
        desc: |
          Nothing moves, even pulled sideways by a quarter of its weight:
          aluminium grips with four times the friction it takes to hold.
        simulation: sim-mujoco:mujoco
        # A world tilted by 15 degrees, so that something pushes the top block
        # sideways and its friction is asked what it can hold.
        scene: :tilted
        # The blocks are drawn about their own centres, so the stack spans z
        # from -10 to 30. Lift it by 10 to stand its bottom face on the floor of
        # the scene: this is what an 'offset:' is for -- reconciling the frame
        # the object is drawn in with the frame the scene places things in.
        offset: [[0, 0, 10], [0, 0, 1], 0]
        # 'before' and 'after' are what the MuJoCo plugin reported: where every
        # body was when the world started, and where it was ten seconds later,
        # in millimetres. Half a millimetre of creep and settling is contact
        # softness, not motion; a block that comes off the stack moves seventy
        # along and twenty down. So: no block moved 5 mm in any direction.
        validation: |
          max(
              sum((a - b) ** 2 for a, b in zip(after["bodies"][name]["pos"], before["bodies"][name]["pos"])) ** 0.5
              for name in before["bodies"]
          ) < 5.0

  unstable:
    desc: The same two blocks, with the upper one 18 mm out of 20 off the edge
    type: assy
    simulate:
      falls:
        desc: The top block topples off and ends up on the floor
        simulation: sim-mujoco:mujoco
        offset: [[0, 0, 10], [0, 0, 1], 0]
        # The opposite condition, on the very same simulation: something ended
        # up markedly lower than it started. The top block falls a whole block's
        # height, so 5 mm is far below what happens and far above the settling
        # the stable stack shows.
        validation: |
          max(
              before["bodies"][name]["pos"][2] - after["bodies"][name]["pos"][2]
              for name in before["bodies"]
          ) > 5.0

  slippery:
    desc: The stable stack again, in PTFE, which does not stay stacked
    type: assy
    simulate:
      slides_off:
        desc: |
          The same geometry as 'stable', in the same tilted world, and the
          opposite outcome, because the material is the other one.
        simulation: sim-mujoco:mujoco
        scene: :tilted
        offset: [[0, 0, 10], [0, 0, 1], 0]
        # The top block slides off the bottom one and falls its full height, 20
        # mm, onto the floor; 5 mm is far below that and far above the settling
        # of a stack that holds.
        validation: |
          max(
              before["bodies"][name]["pos"][2] - after["bodies"][name]["pos"][2]
              for name in before["bodies"]
          ) > 5.0

render:
  readme:
  svg:
    # This drawing is checked in, so it has to be the same file every time it
    # is rendered. See 'reproducible' in '//builtin/render', and the note at
    # the top of 'examples/partcad.yaml' for what that settles and what it
    # cannot.
    reproducible: true
    prefix: ./
